# cargo-release configuration
# https://github.com/crate-ci/cargo-release

# Release all workspace members together
allow-branch = ["main"]
# Create a single shared tag for the whole workspace
shared-version = true
# Tag format
tag-name = "v{{version}}"
# Commit message
tag-message = "Release {{version}}"
# Pre-release commit message
pre-release-commit-message = "chore: release {{version}}"

# Sign tags (uncomment if you have GPG set up)
# sign-tag = true
# sign-commit = true

# Push to remote after release
push = true
# Push tags
tag = true

# Don't publish to crates.io by default (uncomment if you want to publish)
publish = false

# Consolidate commits
consolidate-commits = true

# You can add version replacements for other files here, e.g., README badges
# [[pre-release-replacements]]
# file = "README.md"
# search = "tacacs-rs/v[0-9]+\\.[0-9]+\\.[0-9]+"
# replace = "tacacs-rs/v{{version}}"
