[package]
name = "tacacsrs-config"
description = "YANG JSON configuration types for TACACS+ and ietf-system-tacacs-plus."
version = "0.0.0-dev"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.23"
bitflags = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
tacacsrs-secrets = { path = "../tacacsrs_secrets", features = ["rfc7951"] }
tacacsrs-credential-resolution = { path = "../tacacsrs_credential_resolution" }

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1.52.3", features = ["macros", "rt"] }

[lints]
workspace = true
