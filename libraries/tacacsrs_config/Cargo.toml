[package]
name = "tacacsrs-config"
description = "YANG JSON configuration types for TACACS+ and ietf-system-tacacs-plus."
version = "0.0.0-dev"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.23"
bitflags = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
tacacsrs-secrets = { path = "../tacacsrs_secrets", features = ["rfc7951"] }
tacacsrs-credential-resolution = { path = "../tacacsrs_credential_resolution" }
tacacsrs-networking = { path = "../tacacsrs_networking" }

[dev-dependencies]
async-trait = "0.1"
log = "0.4.30"
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread", "fs"] }
tacacsrs-protocol = { path = "../tacacsrs_protocol" }
openssl = "0.10.80"
tokio-openssl = "0.6.5"
env_logger = "0.11.10"
console-subscriber = "0.5.0"

[package.metadata.cargo-udeps.ignore]
development = ["console-subscriber"]

[lints]
workspace = true
