# Generated by expand_yang_tree.py --list-features --list-features-format ini
# Toggle entries between true and false as needed.
# Section names are pyang module names.

[ietf-system-tacacs-plus]
# Indicates whether service credentials references are supported.
credential-reference = true

[ietf-crypto-types]
# Indicates that the server implements the 'certificate-expiration' notification.
certificate-expiration-notification = false

# Indicates that the server supports cleartext private keys.
cleartext-private-keys = true

# Indicates that the server supports cleartext symmetric keys.
cleartext-symmetric-keys = true

# Indicates that the server implements the 'generate-csr' action.
csr-generation = false

# Indicates that the server supports encryption of private keys.
encrypted-private-keys = false

# Indicates that the server supports encryption of symmetric keys.
encrypted-symmetric-keys = false

# Indicates that the server supports hidden keys.
hidden-private-keys = false

# Indicates that the server supports hidden keys.
hidden-symmetric-keys = false

[ietf-keystore]
# The 'asymmetric-keys' feature indicates that the server implements the
# /keystore/asymmetric-keys subtree.
asymmetric-keys = true

# The 'central-keystore-supported' feature indicates that the server supports the central
# keystore (i.e., fully implements the 'ietf-keystore' module).
central-keystore-supported = false

# The 'inline-definitions-supported' feature indicates that the server supports locally
# defined keys.
inline-definitions-supported = true

# The 'symmetric-keys' feature indicates that the server implements the
# /keystore/symmetric-keys subtree.
symmetric-keys = true

[ietf-tls-client]
# Indicates that the client supports identifying itself using raw public keys.
client-ident-raw-public-key = false

# Indicates that the client supports identifying itself using TLS 1.3 External PSKs (pre-
# shared keys).
client-ident-tls13-epsk = true

# Indicates that the client supports authenticating servers using raw public keys.
server-auth-raw-public-key = false

# Indicates that the client supports authenticating servers using TLS 1.3 External PSKs
# (pre-shared keys).
server-auth-tls13-epsk = true

[ietf-tls-common]
# TLS hello message parameters are configurable.
hello-params = false

# TLS Protocol Version 1.3 is supported.
tls13 = true

[ietf-truststore]
# The 'central-truststore-supported' feature indicates that the server supports the
# truststore (i.e., implements the 'ietf-truststore' module).
central-truststore-supported = false

# The 'certificates' feature indicates that the server implements the
# /truststore/certificate-bags subtree.
certificates = true

# The 'inline-definitions-supported' feature indicates that the server supports locally
# defined trust anchors.
inline-definitions-supported = true

# The 'public-keys' feature indicates that the server implements the /truststore/public-
# key-bags subtree.
public-keys = true

[tacacsrs]
# Indicates that TLS 1.3 PSK psk_dhe_ke ClientHello supported group and key share
# parameters are configurable.
psk-dhe-ke-hello-params = true
