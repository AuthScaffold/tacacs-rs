[package]
name = "tacacsrs-lifecycle"
description = "Shutdown, application lifetime, hosted-service, and health-group contracts for TACACS+ agent components."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
health-checks = { version = "0.1.0", default-features = false }
tokio = { version = "1.52.3", features = ["macros", "time"] }
tokio-util = "0.7.18"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["rt", "test-util"] }

[lints]
workspace = true
