[package]
name = "tacacsrs-cli-datastore"
description = "A datastore for TACACS+ configuration from a CLI or configuration file."
version = "0.1.5"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
futures-core = "0.3"
futures-util = "0.3"
log = "0.4"
notify = "8.2.0"
rustls-pki-types = "1.14.1"
tacacsrs-config = { path = "../tacacsrs_config" }
tacacsrs-datastore = { path = "../tacacsrs_datastore" }
tokio = { version = "1.52.3", features = ["macros", "rt", "sync", "time"] }
tokio-stream = "0.1"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["full"] }

[lints]
workspace = true
