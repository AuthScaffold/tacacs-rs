[package]
name = "tacacsrs-agent"
version = "0.0.0-dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TACACS+ configuration supervision, routed operations, and service lifecycle."
readme = "README.md"

[dependencies]
anyhow = { version = "1.0.102", features = ["backtrace"] }
async-trait = "0.1.89"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
if-addrs = "0.15.0"
log = "0.4.30"
rand = "0.10.0"
tacacsrs-unix-socket = { path = "../tacacsrs_unix_socket" }
tacacsrs-config = { path = "../tacacsrs_config" }
tacacsrs-credential-resolution = { path = "../tacacsrs_credential_resolution" }
tacacsrs-protocol = { path = "../tacacsrs_protocol" }
tacacsrs-networking = { path = "../tacacsrs_networking" }
tacacsrs-secrets = { path = "../tacacsrs_secrets" }
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "net", "parking_lot", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.18"

# The agent runtime does not own the IPC transport. The IPC crate and its stream
# and async helpers are development dependencies used only by the integration
# tests that compose the client API listener with the runtime.
[dev-dependencies]
tacacsrs-ipc = { path = "../tacacsrs_ipc" }
tokio = { version = "1.52.3", features = ["test-util"] }
tokio-stream = { version = "0.1.18", features = ["net"] }

[lints]
workspace = true
