[package]
name = "tacacsrs-secrets"
version = "0.1.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Secret ownership with memory zeroization for tacacs-rs workspace crates."

[features]
default = []
rfc7951 = ["dep:base64", "dep:serde"]

[dependencies]
base64 = { version = "0.23", optional = true }
serde = { version = "1", optional = true }
subtle = "2.6"
zeroize = "1.9.0"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true