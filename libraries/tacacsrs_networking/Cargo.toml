[package]
name = "tacacsrs-networking"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = { version = "1.0.100", features = ["backtrace"] }
base64 = "0.22"
tokio = { version = "1.49.0", features = ["full"] }
tacacsrs-config = { path = "../tacacsrs_config" }
tacacsrs-messages = { path = "../tacacsrs_messages" }
async-trait = "0.1.89"
rand = "0.10.0"
log = "0.4.29"
parking_lot = "0.12.5"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws_lc_rs", "logging"] }
rustls-pki-types = "1.14.0"
rustls-cert-file-reader = "0.4.2"
webpki-roots = "1.0.6"
openssl = { version = "0.10.76", optional = true }
tokio-openssl = { version = "0.6.5", optional = true }

[features]
default = []
psk = ["dep:openssl", "dep:tokio-openssl"]

[dev-dependencies]
argh = "0.1.13"
console-subscriber = "0.5.0"
test-log = "0.2.19"
env_logger = "0.11.8"
futures = "0.3"

[lints]
workspace = true

[[example]]
name = "tls_psk_client"
required-features = ["psk"]
