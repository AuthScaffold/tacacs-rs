[package]
name = "tacacsrs-networking"
version = "0.0.0-dev"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "TACACS+ transport layer with TCP, TLS, and PSK support"

[dependencies]
tacacsrs-config = { path = "../tacacsrs_config" }
anyhow = { version = "1.0.102", features = ["backtrace"] }
tokio = { version = "1.52.3", features = ["full"] }
tacacsrs-messages = { path = "../tacacsrs_messages" }
tacacsrs-flow-abstractions = { path = "../tacacsrs_flow_abstractions" }
async-trait = "0.1.89"
rand = "0.10.1"
log = "0.4.30"
parking_lot = "0.12.5"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws_lc_rs", "logging"] }
rustls-pki-types = "1.14.1"
webpki-roots = "1.0.7"
openssl = { version = "0.10.80", optional = true }
openssl-sys = { version = "0.9.116", optional = true }
tokio-openssl = { version = "0.6.5", optional = true }
foreign-types = { version = "0.3.2", optional = true }
zeroize = { version = "1.8.2", optional = true }

[features]
default = []
psk = ["dep:foreign-types", "dep:openssl", "dep:openssl-sys", "dep:tokio-openssl", "dep:zeroize"]

[dev-dependencies]
console-subscriber = "0.5.0"
env_logger = "0.11.10"
futures = "0.3"

[lints]
workspace = true

[package.metadata.cargo-udeps.ignore]
development = ["console-subscriber"]

[[example]]
name = "tls_psk_client"
required-features = ["psk"]
