[package]
name = "tacacsrs-networking"
version = "0.0.0-dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TACACS+ TCP and TLS connections with certificate and PSK support."

[dependencies]
tacacsrs-secrets = { path = "../tacacsrs_secrets" }
anyhow = { version = "1.0.102", features = ["backtrace"] }
async-trait = "0.1.89"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "parking_lot", "rt", "rt-multi-thread", "sync", "time"] }
tacacsrs-protocol = { path = "../tacacsrs_protocol" }
rand = "0.10.1"
log = "0.4.30"
parking_lot = "0.13.0"
openssl = "0.10.80"
openssl-sys = "0.9.116"
tokio-openssl = "0.6.5"
foreign-types = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
rtnetlink = "0.23.0"
futures-util = "0.3"
libc = "0.2"

[dev-dependencies]
futures = "0.3"
tokio = { version = "1.52.3", features = ["test-util"] }

[lints]
workspace = true
