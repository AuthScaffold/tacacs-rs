[package]
name = "tacacsrs-networking"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { version = "1.0.100", features = ["backtrace"] }
tokio = { version = "1.49.0", features = ["full"] }
tacacsrs-messages = { path = "../tacacsrs_messages" }
async-trait = "0.1.89"
rand = "0.9.2"
log = "0.4.29"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws_lc_rs", "logging"] }
rustls-pki-types = "1.14.0"
rustls-cert-file-reader = "0.4.2"

[dev-dependencies]
argh = "0.1.13"
console-subscriber = "0.5.0"
webpki-roots = "1.0.6"
test-log = "0.2.19"
env_logger = "0.11.8"
futures = "0.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }
