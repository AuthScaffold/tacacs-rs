[package]
name = "tacacsrs-networking"
version = "0.1.33"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "TACACS+ TCP and TLS connections with certificate and PSK support."

[dependencies]
tacacsrs-config = { path = "../tacacsrs_config" }
anyhow = { version = "1.0.102", features = ["backtrace"] }
tokio = { version = "1.52.3", features = ["full"] }
tacacsrs-messages = { path = "../tacacsrs_messages" }
rand = "0.10.1"
log = "0.4.30"
parking_lot = "0.12.5"
openssl = "0.10.80"
openssl-sys = "0.9.116"
tokio-openssl = "0.6.5"
foreign-types = "0.3.2"

[dev-dependencies]
console-subscriber = "0.5.0"
env_logger = "0.11.10"
futures = "0.3"
tacacsrs-flows = { path = "../tacacsrs_flows" }
tacacsrs-secrets = { path = "../tacacsrs_secrets" }

[lints]
workspace = true

[package.metadata.cargo-udeps.ignore]
development = ["console-subscriber"]

[[example]]
name = "tls_psk_client"
