[package]
name = "tacacsrs-kubesonic"
description = "KubeSONiC configuration and mounted credentials for the TACACS+ agent."
version = "0.0.0-dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false }
libc = "0.2"
log = "0.4"
notify = "8.2.0"
redis = { version = "1.7", default-features = false, features = ["aio", "tokio-comp"] }
rustls-pki-types = "1.14.1"
serde_json = "1"
tacacsrs-config = { path = "../tacacsrs_config" }
tacacsrs-credential-resolution = { path = "../tacacsrs_credential_resolution" }
tacacsrs-secrets = { path = "../tacacsrs_secrets" }
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-stream = "0.1"
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["test-util"] }

[lints]
workspace = true
