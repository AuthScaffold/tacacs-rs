[package]
name = "tacacsrs-client-service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reusable central TACACS+ client service components and IPC protocol"
readme = "README.md"

[dependencies]
anyhow = { version = "1.0.100", features = ["backtrace"] }
async-trait = "0.1.89"
log = "0.4.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.2.1", features = ["derive"] }
tacacsrs-messages = { path = "../tacacsrs_messages" }
tacacsrs-networking = { path = "../tacacsrs_networking" }
tokio = { version = "1.49.0", features = ["full"] }

[features]
default = []
psk = ["tacacsrs-networking/psk"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
