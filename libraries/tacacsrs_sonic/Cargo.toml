[package]
name = "tacacsrs-sonic"
description = "SONiC ConfigDB datastore backend for tacacsrs-agentd: maps the SONiC TACPLUS / TACPLUS_SERVER tables to the ietf-system-tacacs-plus YANG model."
version = "0.0.0-dev"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false }
log = "0.4"
redis = { version = "1.2", default-features = false, features = ["aio", "tokio-comp"] }
tacacsrs-config = { path = "../tacacsrs_config" }
tacacsrs-datastore = { path = "../tacacsrs_datastore" }
tokio = { version = "1.52.3", features = ["sync", "macros", "rt", "time"] }
tokio-stream = { version = "0.1" }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["full"] }

[lints]
workspace = true
