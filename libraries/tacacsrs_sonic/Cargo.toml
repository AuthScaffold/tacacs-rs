[package]
name = "tacacsrs-sonic"
description = "Maps SONiC ConfigDB TACPLUS and TACPLUS_SERVER data to the ietf-system-tacacs-plus YANG model."
version = "0.1.13"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false }
log = "0.4"
notify = "8.2.0"
redis = { version = "1.2", default-features = false, features = ["aio", "tokio-comp"] }
rustix = { version = "1.1.4", features = ["fs"] }
tacacsrs-config = { path = "../tacacsrs_config" }
tacacsrs-credential-resolution = { path = "../tacacsrs_credential_resolution" }
tacacsrs-datastore = { path = "../tacacsrs_datastore" }
tokio = { version = "1.52.3", features = ["sync", "macros", "rt", "time"] }
tokio-stream = { version = "0.1" }
zeroize = "1.9.0"

[dev-dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["full"] }

[package.metadata.cargo-udeps.ignore]
development = ["tempfile"]

[lints]
workspace = true
