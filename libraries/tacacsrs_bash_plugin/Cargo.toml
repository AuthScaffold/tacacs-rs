[package]
name = "tacacsrs-bash-plugin"
version = "0.1.12"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A SONiC Bash execve plug-in that uses the tacacsrs-agentd IPC endpoint."

[lib]
name = "tacacsrs_bash_plugin"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.102"
libc = "0.2"
tacacsrs-ipc = { path = "../tacacsrs_ipc" }
tacacsrs-protocol = { path = "../tacacsrs_protocol" }
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }

[lints]
workspace = true
