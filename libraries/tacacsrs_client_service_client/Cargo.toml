[package]
name = "tacacsrs-client-service-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reusable local IPC client and shared protocol types for the central TACACS+ client service"
build = "build.rs"

[dependencies]
anyhow = { version = "1.0.100", features = ["backtrace"] }
http = "1.4.0"
hyper-util = "0.1.20"
prost = "0.14.3"
tokio = { version = "1.49.0", features = ["full"] }
tonic = "0.14.5"
tonic-prost = "0.14.5"
tower = { version = "0.5.2", features = ["util"] }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
