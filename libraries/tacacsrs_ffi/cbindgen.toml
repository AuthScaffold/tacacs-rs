# cbindgen configuration for tacacsrs-ffi

language = "C"
cpp_compat = true

header = """
/**
 * TACACS-rs FFI Bindings
 * 
 * C/C++ bindings for the TACACS+ protocol implementation.
 * 
 * This header provides a Foreign Function Interface (FFI) to use
 * the TACACS-rs library from C and C++ applications.
 * 
 * @file tacacs.h
 * @version 0.1.1
 * @license MIT
 */
"""

include_guard = "TACACS_H"
autogen_warning = "/* Warning: This file is automatically generated by cbindgen. Do not modify manually. */"
tab_width = 4
line_length = 100

[export]
prefix = "tacacs_"
exclude = []

[export.rename]

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[struct]
rename_fields = "SnakeCase"
derive_eq = false
derive_neq = false

[parse]
parse_deps = false
include = []

