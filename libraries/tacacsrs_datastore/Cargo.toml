[package]
name = "tacacsrs-datastore"
description = "A datastore that supplies YANG TACACS+ configuration and change notifications to the agent."
version = "0.1.10"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures-core = "0.3"
tacacsrs-config = { path = "../tacacsrs_config" }
tokio = { version = "1.52.3", features = ["sync", "macros", "rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
tacacsrs-secrets = { path = "../tacacsrs_secrets" }
tokio = { version = "1.52.3", features = ["full"] }

[lints]
workspace = true
