[package]
name = "tacacsrs-agent-ipc-emulator"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A local IPC emulator that uses Rego for TACACS+ agent integration tests."
readme = "README.md"
build = "build.rs"

[dependencies]
anyhow = { version = "1.0.102", features = ["backtrace"] }
log = "0.4"
prost = "0.14.3"
regorus = { version = "0.12.0", default-features = false, features = ["arc", "regex"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tacacsrs-ipc = { path = "../tacacsrs_ipc" }
tacacsrs-protocol = { path = "../tacacsrs_protocol" }
tokio = { version = "1.52.2", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["net"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
