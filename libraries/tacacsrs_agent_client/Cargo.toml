[package]
name = "tacacsrs-agent-client"
version = "0.0.0-dev"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reusable local IPC client and shared protocol types for the central TACACS+ client service"
readme = "README.md"
build = "build.rs"

[dependencies]
anyhow = { version = "1.0.102", features = ["backtrace"] }
http = "1.4.1"
hyper-util = "0.1.20"
prost = "0.14.3"
tokio = { version = "1.52.3", features = ["full"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tower = { version = "0.5.3", features = ["util"] }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"

[lints]
workspace = true
