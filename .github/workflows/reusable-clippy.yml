name: Reusable Clippy

on:
  workflow_call:
    inputs:
      toolchain:
        description: 'Rust toolchain for clippy'
        required: false
        default: 'stable'
        type: string
      deny-warnings:
        description: 'Treat warnings as errors'
        required: false
        default: true
        type: boolean
      os-matrix:
        description: 'JSON array of OS runners'
        required: false
        default: '["ubuntu-latest", "windows-latest"]'
        type: string

jobs:
  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os-matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust
        uses: ./.github/steps/setup-rust
        with:
          toolchain: ${{ inputs.toolchain }}
          components: clippy
          cache-key: ${{ inputs.toolchain }}

      - name: Run Clippy
        run: cargo clippy --workspace ${{ matrix.os == 'windows-latest' && '--exclude session-wrapper' || '' }} --all-targets --all-features ${{ inputs.deny-warnings && '-- -D warnings' || '' }}
