name: Reusable Build

on:
  workflow_call:
    inputs:
      targets:
        description: 'JSON array of target configurations with os, target, and optional asset_name'
        required: false
        default: |
          [
            {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu", "asset_name": "tacon-linux-gnu-x86_64"},
            {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-musl", "asset_name": "tacon-linux-musl-x86_64"},
            {"os": "windows-latest", "target": "x86_64-pc-windows-msvc", "asset_name": "tacon-windows-msvc-x86_64.exe"}
          ]
        type: string
      build-release:
        description: 'Build in release mode'
        required: false
        default: false
        type: boolean
      upload-artifacts:
        description: 'Upload build artifacts'
        required: false
        default: false
        type: boolean
      binary-name:
        description: 'Name of the binary to build'
        required: false
        default: 'tacon'
        type: string

jobs:
  build:
    name: Build (${{ matrix.config.target }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(inputs.targets) }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/steps/setup-rust
        with:
          targets: ${{ matrix.config.target }}
          cache-key: ${{ matrix.config.target }}
          install-musl-tools: ${{ contains(matrix.config.target, 'musl') }}

      - name: Build (simple)
        if: inputs.upload-artifacts == false
        run: cargo build --workspace ${{ inputs.build-release && '--release' || '' }} --target ${{ matrix.config.target }}

      - name: Build Binary (with artifacts)
        if: inputs.upload-artifacts == true
        uses: ./.github/steps/build-binary
        with:
          target: ${{ matrix.config.target }}
          binary-name: ${{ inputs.binary-name }}
          asset-name: ${{ matrix.config.asset_name }}
