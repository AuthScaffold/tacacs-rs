name: Reusable Build

on:
  workflow_call:
    inputs:
      targets:
        description: 'JSON array of target configurations with os, target, asset_name, and optional features'
        required: false
        default: |
          [
            {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu", "asset_name": "tacon-linux-gnu-x86_64", "features": ""},
            {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-musl", "asset_name": "tacon-linux-musl-x86_64", "features": ""},
            {"os": "windows-latest", "target": "x86_64-pc-windows-msvc", "asset_name": "tacon-windows-msvc-x86_64.zip", "features": "psk"}
          ]
        type: string
      build-release:
        description: 'Build in release mode'
        required: false
        default: false
        type: boolean
      upload-artifacts:
        description: 'Upload build artifacts'
        required: false
        default: false
        type: boolean
      binary-name:
        description: 'Name of the binary to build'
        required: false
        default: 'tacon'
        type: string
      version:
        description: 'Override package version in Cargo.toml before building (e.g. CalVer tag version)'
        required: false
        default: ''
        type: string

jobs:
  build:
    name: Build (${{ matrix.config.target }})
    runs-on: ${{ matrix.config.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(inputs.targets) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Override package version
        if: inputs.version != ''
        shell: bash
        run: |
          CARGO_TOML=$(find executables -name 'Cargo.toml' -exec grep -l "name = \"${{ inputs.binary-name }}\"" {} \;)
          if [ -n "$CARGO_TOML" ]; then
            sed -i "s/^version = \".*\"/version = \"${{ inputs.version }}\"/" "$CARGO_TOML"
            echo "Updated $CARGO_TOML to version ${{ inputs.version }}"
          fi

      - name: Setup Rust
        uses: ./.github/steps/setup-rust
        with:
          targets: ${{ matrix.config.target }}
          cache-key: ${{ matrix.config.target }}
          install-musl-tools: ${{ contains(matrix.config.target, 'musl') }}

      - name: Build (simple)
        if: inputs.upload-artifacts == false
        shell: bash
        run: |
          FEATURE_ARGS=()
          if [[ -n "${{ matrix.config.features }}" ]]; then
            FEATURE_ARGS+=(--features "${{ matrix.config.features }}")
          fi

          cargo build --workspace ${{ inputs.build-release && '--release' || '' }} --target ${{ matrix.config.target }} "${FEATURE_ARGS[@]}"

      - name: Build Binary (with artifacts)
        if: inputs.upload-artifacts == true
        uses: ./.github/steps/build-binary
        with:
          target: ${{ matrix.config.target }}
          binary-name: ${{ inputs.binary-name }}
          asset-name: ${{ matrix.config.asset_name }}
          features: ${{ matrix.config.features }}
