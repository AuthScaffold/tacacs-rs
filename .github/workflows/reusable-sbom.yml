name: Reusable SBOM Generation

on:
  workflow_call:
    inputs:
      versions:
        description: 'JSON map of crate-name → version to inject into Cargo.toml files. Empty or {} is a no-op.'
        required: false
        default: '{}'
        type: string

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Inject versions
        uses: ./.github/steps/inject-versions
        with:
          versions: ${{ inputs.versions }}

      - name: Setup Rust
        uses: ./.github/steps/setup-rust
        with:
          cache-key: sbom

      - name: Generate SBOM (JSON)
        uses: ./.github/steps/generate-sbom
        with:
          output-format: json
          all-features: 'true'

      - name: Generate SBOM (XML)
        uses: ./.github/steps/generate-sbom
        with:
          output-format: xml
          all-features: 'true'

      - name: Collect SBOM files
        run: |
          mkdir -p sbom-output
          find . -name "*.cdx.json" -type f -exec cp {} sbom-output/ \;
          find . -name "*.cdx.xml" -type f -exec cp {} sbom-output/ \;
          echo "Collected SBOM files:"
          ls -lh sbom-output/

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom-output/*
