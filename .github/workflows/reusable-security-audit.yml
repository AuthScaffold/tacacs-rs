name: Reusable Security Audit

on:
  workflow_call:
    inputs:
      skip-if-no-dep-changes:
        description: 'Skip audit if no dependency files changed (for PRs)'
        required: false
        default: false
        type: boolean

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: changes
        if: inputs.skip-if-no-dep-changes
        with:
          filters: |
            deps:
              - '**/Cargo.toml'
              - '**/Cargo.lock'

      - name: Should run audit
        id: should-run
        run: |
          if [[ "${{ inputs.skip-if-no-dep-changes }}" == "true" ]]; then
            echo "run=${{ steps.changes.outputs.deps }}" >> $GITHUB_OUTPUT
          else
            echo "run=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Rust toolchain
        if: steps.should-run.outputs.run == 'true'
        uses: ./.github/steps/setup-rust
        with:
          cache-key: stable

      - name: Install cargo-audit
        if: steps.should-run.outputs.run == 'true'
        uses: taiki-e/install-action@fa0dd4cd0a40696e6f9766370614a5ce482e6aa8 # v2.77.5
        with:
          tool: cargo-audit

      - name: Generate Cargo.lock
        if: steps.should-run.outputs.run == 'true'
        run: cargo generate-lockfile

      - name: Run security audit
        if: steps.should-run.outputs.run == 'true'
        run: cargo audit

      - name: Skip notice
        if: steps.should-run.outputs.run != 'true'
        run: echo "Skipping audit - no dependency changes detected"
