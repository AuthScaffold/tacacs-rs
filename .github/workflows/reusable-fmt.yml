name: Reusable Rustfmt

on:
  workflow_call:
    inputs:
      toolchain:
        description: 'Rust toolchain for rustfmt (use nightly for unstable options)'
        required: false
        default: 'nightly'
        type: string
      os-matrix:
        description: 'JSON array of OS runners'
        required: false
        default: '["ubuntu-latest", "windows-latest"]'
        type: string

jobs:
  fmt:
    name: Rustfmt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os-matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust
        uses: ./.github/steps/setup-rust
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt
          cache-key: fmt-${{ matrix.os }}

      - name: Check formatting
        run: cargo +${{ inputs.toolchain }} fmt --all -- --check
