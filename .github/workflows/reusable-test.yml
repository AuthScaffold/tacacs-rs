name: Reusable Test

on:
  workflow_call:
    inputs:
      os-matrix:
        description: 'JSON array of OS runners (e.g., ["ubuntu-latest", "windows-latest"])'
        required: false
        default: '["ubuntu-latest", "windows-latest"]'
        type: string
      rust-matrix:
        description: 'JSON array of Rust toolchains (e.g., ["stable", "beta"])'
        required: false
        default: '["stable"]'
        type: string
      release:
        description: 'Run tests in release mode instead of debug'
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: Test (${{ matrix.os }} - ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os-matrix) }}
        rust: ${{ fromJson(inputs.rust-matrix) }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust
        uses: ./.github/steps/setup-rust
        with:
          toolchain: ${{ matrix.rust }}
          cache-key: ${{ matrix.rust }}

      - name: Run tests
        run: cargo test --workspace ${{ matrix.os == 'windows-latest' && '--exclude session-wrapper' || '' }} --all-features ${{ inputs.release && '--release' || '' }}
