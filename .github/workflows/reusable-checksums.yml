name: Reusable Checksums Generation

on:
  workflow_call:

jobs:
  checksums:
    name: Generate Checksums
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          # Use find to handle files robustly
          find . -type f -exec sha256sum {} \; | sed 's|^\./||' > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: checksums-sha256.txt
          path: artifacts/checksums-sha256.txt
