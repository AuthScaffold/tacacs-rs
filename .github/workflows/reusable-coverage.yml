name: Reusable Code Coverage

on:
  workflow_call:
    inputs:
      fail-under-lines:
        description: 'Fail if line coverage is below this percentage (0 to disable)'
        required: false
        default: 0
        type: number

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Coverage
        uses: ./.github/steps/setup-coverage

      - name: Generate Coverage
        uses: ./.github/steps/generate-coverage
        with:
          fail-under-lines: ${{ inputs.fail-under-lines }}
