name: Reusable Debian Package Build

on:
  workflow_call:
    inputs:
      package-name:
        description: 'Name of the Rust package to build .deb for'
        required: true
        type: string
      upload-artifacts:
        description: 'Whether to upload the .deb package as an artifact'
        required: false
        default: true
        type: boolean
      binary-artifact-name:
        description: 'Name of the artifact containing the pre-built binary (e.g., tacon-linux-gnu-x86_64). If not provided, binary will be built from scratch.'
        required: false
        type: string
      version:
        description: 'Override package version in Cargo.toml and debian/changelog (e.g. CalVer tag version)'
        required: false
        default: ''
        type: string

jobs:
  build-deb:
    name: Build Debian Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Override package version
        if: inputs.version != ''
        run: |
          CARGO_TOML="executables/${{ inputs.package-name }}/Cargo.toml"
          if [ -f "$CARGO_TOML" ]; then
            sed -i "s/^version = \".*\"/version = \"${{ inputs.version }}\"/" "$CARGO_TOML"
            echo "Updated $CARGO_TOML to version ${{ inputs.version }}"
          fi
          CHANGELOG="executables/${{ inputs.package-name }}/debian/changelog"
          if [ -f "$CHANGELOG" ]; then
            sed -i "1s/([^)]*)/(${{ inputs.version }})/" "$CHANGELOG"
            echo "Updated $CHANGELOG to version ${{ inputs.version }}"
          fi

      - name: Download pre-built binary
        if: inputs.binary-artifact-name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.binary-artifact-name }}
          path: binary-artifact

      - name: Prepare pre-built binary
        if: inputs.binary-artifact-name != ''
        run: |
          ls -alh binary-artifact/
          mkdir -p target/release
          cp binary-artifact/${{ inputs.binary-artifact-name }} target/release/${{ inputs.package-name }}
          chmod +x target/release/${{ inputs.package-name }}
          strip target/release/${{ inputs.package-name }}

      - name: Setup Rust (for building from scratch)
        if: inputs.binary-artifact-name == ''
        uses: ./.github/steps/setup-rust
        with:
          targets: x86_64-unknown-linux-gnu
          cache-key: debian-${{ inputs.package-name }}

      - name: Build release binary (from scratch)
        if: inputs.binary-artifact-name == ''
        run: cargo build --release --package ${{ inputs.package-name }}

      - name: Strip binary (from scratch)
        if: inputs.binary-artifact-name == ''
        run: strip target/release/${{ inputs.package-name }}

      - name: Build package to generate man page (when using pre-built binary)
        if: inputs.binary-artifact-name != ''
        run: cargo build --package ${{ inputs.package-name }}

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Copy generated man page and compress Debian assets
        run: |
          # Prefer the release build output when we built the package locally.
          # Fall back to debug output when only generating the man page for a pre-built binary.
          MAN_PAGE=$(find target/release/build -path "*/out/man/${{ inputs.package-name }}.1" -type f | head -1)
          if [ -z "$MAN_PAGE" ]; then
            MAN_PAGE=$(find target/debug/build -path "*/out/man/${{ inputs.package-name }}.1" -type f | head -1)
          fi
          if [ -z "$MAN_PAGE" ]; then
            echo "Error: Generated man page not found"
            exit 1
          fi
          echo "Found man page at: $MAN_PAGE"
          # Copy to debian directory and compress
          cp "$MAN_PAGE" executables/${{ inputs.package-name }}/debian/${{ inputs.package-name }}.1
          cd executables/${{ inputs.package-name }}/debian
          gzip -9 -n -c changelog > changelog.gz
          gzip -9 -n -c ${{ inputs.package-name }}.1 > ${{ inputs.package-name }}.1.gz

      - name: Generate .deb package
        run: cargo deb --package ${{ inputs.package-name }} --no-build --dbgsym

      - name: Verify package with lintian
        run: |
          sudo apt-get update
          sudo apt-get install -y lintian
          lintian target/debian/${{ inputs.package-name }}_*.deb || true

      - name: Display package info
        run: |
          dpkg --info target/debian/${{ inputs.package-name }}_*.deb
          if ls target/debian/${{ inputs.package-name }}-dbgsym_*.ddeb 1>/dev/null 2>&1; then
            dpkg --info target/debian/${{ inputs.package-name }}-dbgsym_*.ddeb
          fi

      - name: Upload Debian package
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.package-name }}.deb
          path: target/debian/${{ inputs.package-name }}_*.deb

      - name: Upload Debian debug symbols package
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.package-name }}-dbgsym.ddeb
          path: target/debian/${{ inputs.package-name }}-dbgsym_*.ddeb
          if-no-files-found: ignore
