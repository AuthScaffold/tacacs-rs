name: Reusable CI Pipeline

on:
  workflow_call:
    inputs:
      include-fmt:
        description: 'Run the rustfmt validation job'
        required: false
        default: true
        type: boolean
      include-proto-compat:
        description: 'Run the protobuf backward-compatibility validation'
        required: false
        default: true
        type: boolean
      include-miri:
        description: 'Run the Miri job'
        required: false
        default: true
        type: boolean
      include-fuzz:
        description: 'Run the fuzz smoke-test job'
        required: false
        default: true
        type: boolean
      validation-ref:
        description: 'Immutable commit to validate. Empty selects the triggering SHA.'
        required: false
        default: ''
        type: string
      require-hydrated:
        description: 'Require the validated commit to contain the computed versions already'
        required: false
        default: false
        type: boolean
      include-clippy-nursery:
        description: 'Run the Clippy nursery-lint job'
        required: false
        default: true
        type: boolean
      rust-test-matrix:
        description: 'Deprecated. This workflow defines the test platforms. This input remains for caller compatibility.'
        required: false
        default: '["stable"]'
        type: string
      proto-compat-ref:
        description: 'Git ref for protobuf backward-compatibility validation'
        required: false
        default: 'main'
        type: string
      include-outdated:
        description: 'Run the outdated-dependency validation job'
        required: false
        default: true
        type: boolean
      skip-audit-if-no-dep-changes:
        description: 'If dependency files do not change, skip the security audit'
        required: false
        default: false
        type: boolean
      build-release:
        description: 'The build commands and tests use release mode'
        required: false
        default: true
        type: boolean
      versions:
        description: 'JSON map of crate names to versions for Cargo.toml files. An empty map or {} causes no changes.'
        required: false
        default: '{}'
        type: string

permissions:
  pull-requests: read
  contents: read

jobs:
  armhf:
    name: ARMhf Build and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.validation-ref || github.sha }}
      - name: Enable ARM subprocess execution
        run: docker run --rm --privileged tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm
      - name: Build and execute ARMhf coverage
        run: |
          docker buildx build --platform linux/amd64 \
            --file .github/steps/armhf/Dockerfile \
            --no-cache-filter verify \
            --output "type=local,dest=${RUNNER_TEMP}/armhf-evidence" .
      - name: Upload ARMhf evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: armhf-verification
          path: ${{ runner.temp }}/armhf-evidence
          if-no-files-found: error

  automation-tests:
    name: Delivery Automation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.validation-ref || github.sha }}
      - uses: ./.github/steps/setup-rust
        with:
          toolchain: '1.91.0'
          components: clippy rustfmt
          cache-key: delivery-tools
          install-libseccomp-dev: 'false'
          install-openssl: 'true'
      - name: Install pinned test prerequisites
        shell: bash
        run: |
          python3 -m pip install pytest==8.4.2 PyYAML==6.0.3 -r .github/steps/inject-versions/requirements.txt
          rustup toolchain install nightly-2025-11-23 --profile minimal
      - name: Test delivery scripts and workflow contracts
        shell: bash
        run: python3 -m pytest .github/steps/cargo-metadata .github/steps/check-architecture .github/steps/compute-versions .github/steps/inject-versions .github/steps/source-release
      - name: Test API classification against real Git fixtures
        shell: bash
        run: env -u CARGO_TARGET_DIR cargo +1.91.0 test --manifest-path .github/tools/api-classifier/Cargo.toml --locked
      - name: Install dependency auditor
        uses: taiki-e/install-action@7be9fd86bd1707236395105d6e9329dd1511a7e1 # v2.79.0
        with:
          tool: cargo-audit
      - name: Audit API classifier dependencies
        shell: bash
        run: cargo audit --file .github/tools/api-classifier/Cargo.lock

  msrv:
    name: Minimum Rust 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.validation-ref || github.sha }}
      - name: Install the minimum Rust toolchain
        uses: ./.github/steps/setup-rust
        with:
          toolchain: '1.88.0'
          cache-key: msrv
          install-libseccomp-dev: 'true'
          install-openssl: 'true'
      - name: Check all workspace targets on the minimum toolchain
        shell: bash
        run: cargo check --workspace --all-targets --all-features --locked

  cache-preflight:
    name: Cache Preflight (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Linux Stable
            os: ubuntu-latest
            toolchain: stable
            components: clippy llvm-tools-preview
            targets: x86_64-unknown-linux-gnu
            cache_key: stable
            metadata_target: x86_64-unknown-linux-gnu
            install_libseccomp_dev: 'true'
            install_openssl: 'true'
          - name: Windows Stable
            os: windows-latest
            toolchain: stable
            components: clippy
            targets: x86_64-pc-windows-msvc
            cache_key: stable
            metadata_target: x86_64-pc-windows-msvc
            install_libseccomp_dev: 'false'
            install_openssl: 'true'
          - name: Linux Nightly
            os: ubuntu-latest
            toolchain: nightly
            components: rustfmt clippy miri
            targets: x86_64-unknown-linux-gnu
            cache_key: nightly
            metadata_target: x86_64-unknown-linux-gnu
            install_libseccomp_dev: 'true'
            install_openssl: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.validation-ref || github.sha }}

      - name: Install Rust and configure native caches
        uses: ./.github/steps/setup-rust
        with:
          toolchain: ${{ matrix.config.toolchain }}
          components: ${{ matrix.config.components }}
          targets: ${{ matrix.config.targets }}
          cache-key: ${{ matrix.config.cache_key }}
          save-if: 'true'
          install-libseccomp-dev: ${{ matrix.config.install_libseccomp_dev }}
          install-openssl: ${{ matrix.config.install_openssl }}

      - name: Resolve cargo metadata
        uses: ./.github/steps/resolve-cargo-metadata
        with:
          metadata-target: ${{ matrix.config.metadata_target }}
          profile: ${{ matrix.config.cache_key }}

  pre-tests:
    name: Pre-Tests (${{ matrix.config.name }})
    needs: [cache-preflight]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Linux GNU
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            feature_args: --all-features
            install_libseccomp_dev: 'true'
            install_openssl: 'true'
            metadata_checks: 'true'
            package_args: '--workspace'
          - name: Windows MSVC
            os: windows-latest
            target: x86_64-pc-windows-msvc
            feature_args: --all-features
            install_libseccomp_dev: 'false'
            install_openssl: 'true'
            metadata_checks: 'false'
            package_args: '--package tacon --package tacacsrs-config --package tacacsrs-protocol --package tacacsrs-networking --package tacacsrs-secrets'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.validation-ref || github.sha }}
          fetch-depth: 0

      - name: Install nightly Rust
        uses: ./.github/steps/setup-rust
        with:
          toolchain: nightly
          components: rustfmt
          targets: ${{ matrix.config.target }}
          cache-key: nightly
          install-libseccomp-dev: ${{ matrix.config.install_libseccomp_dev }}
          install-openssl: ${{ matrix.config.install_openssl }}

      - name: Make sure that formatting is correct
        if: inputs.include-fmt
        uses: ./.github/steps/check-format

      - name: Make sure that dependencies are used
        uses: ./.github/steps/check-unused-deps
        with:
          package-args: ${{ matrix.config.package_args }}
          target: ${{ matrix.config.target }}
          feature-args: ${{ matrix.config.feature_args }}

      - name: Install stable Rust
        uses: ./.github/steps/setup-rust
        with:
          toolchain: stable
          components: clippy
          targets: ${{ matrix.config.target }}
          cache-key: stable
          install-libseccomp-dev: ${{ matrix.config.install_libseccomp_dev }}
          install-openssl: ${{ matrix.config.install_openssl }}

      - name: Run Clippy
        uses: ./.github/steps/run-clippy
        with:
          package-args: ${{ matrix.config.package_args }}
          target: ${{ matrix.config.target }}
          feature-args: ${{ matrix.config.feature_args }}

      - name: Run advisory Clippy style lints
        if: inputs.include-clippy-nursery
        uses: ./.github/steps/run-clippy
        with:
          package-args: ${{ matrix.config.package_args }}
          target: ${{ matrix.config.target }}
          feature-args: ${{ matrix.config.feature_args }}
          lint-args: -W clippy::pedantic -W clippy::nursery
          advisory: 'true'

      - name: Build documentation
        uses: ./.github/steps/build-docs
        with:
          package-args: ${{ matrix.config.package_args }}
          target: ${{ matrix.config.target }}
          feature-args: ${{ matrix.config.feature_args }}

      - name: Run security audit
        if: matrix.config.metadata_checks == 'true'
        uses: ./.github/steps/security-audit
        with:
          skip-if-no-dep-changes: ${{ inputs.skip-audit-if-no-dep-changes }}

      - name: Make sure that dependencies are current
        if: matrix.config.metadata_checks == 'true' && inputs.include-outdated
        uses: ./.github/steps/check-outdated

      - name: Make sure that protobuf changes are backward-compatible
        if: matrix.config.metadata_checks == 'true' && inputs.include-proto-compat
        uses: ./.github/steps/proto-compat
        with:
          against-ref: ${{ inputs.proto-compat-ref }}
          github-token: ${{ github.token }}

      - name: Verify the pinned YANG artifacts (offline)
        if: matrix.config.metadata_checks == 'true'
        uses: ./.github/steps/verify-yang

  testing:
    name: Testing (${{ matrix.config.name }})
    needs: [pre-tests]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Linux GNU
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            feature_args: --all-features
            components: llvm-tools-preview
            install_libseccomp_dev: 'true'
            install_openssl: 'true'
            coverage: 'true'
            deep_checks: 'true'
            package_args: '--workspace'
          - name: Windows MSVC
            os: windows-latest
            target: x86_64-pc-windows-msvc
            feature_args: --all-features
            components: ''
            install_libseccomp_dev: 'false'
            install_openssl: 'true'
            coverage: 'false'
            deep_checks: 'false'
            package_args: '--package tacon --package tacacsrs-config --package tacacsrs-protocol --package tacacsrs-networking --package tacacsrs-secrets'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.validation-ref || github.sha }}

      - name: Install stable Rust
        uses: ./.github/steps/setup-rust
        with:
          toolchain: stable
          components: ${{ matrix.config.components }}
          targets: ${{ matrix.config.target }}
          cache-key: stable
          install-libseccomp-dev: ${{ matrix.config.install_libseccomp_dev }}
          install-openssl: ${{ matrix.config.install_openssl }}

      - name: Run unit tests
        uses: ./.github/steps/run-tests
        with:
          package-args: ${{ matrix.config.package_args }}
          target: ${{ matrix.config.target }}
          feature-args: ${{ matrix.config.feature_args }}
          build-release: ${{ inputs.build-release }}

      - name: Generate coverage
        if: matrix.config.coverage == 'true'
        uses: ./.github/steps/run-coverage

      - name: Install nightly Rust for extended validation
        if: matrix.config.deep_checks == 'true' && (inputs.include-miri || inputs.include-fuzz)
        uses: ./.github/steps/setup-rust
        with:
          toolchain: nightly
          components: miri
          cache-key: nightly
          install-libseccomp-dev: ${{ matrix.config.install_libseccomp_dev }}
          install-openssl: ${{ matrix.config.install_openssl }}

      - name: Run Miri
        if: matrix.config.deep_checks == 'true' && inputs.include-miri
        uses: ./.github/steps/run-miri

      - name: Test fuzz smoke action
        if: matrix.config.deep_checks == 'true' && inputs.include-fuzz
        shell: bash
        run: python3 .github/steps/run-fuzz-smoke/test_action.py

      - name: Run fuzz smoke tests
        if: matrix.config.deep_checks == 'true' && inputs.include-fuzz
        uses: ./.github/steps/run-fuzz-smoke

  consumer-profiles:
    name: Consumer Profile (${{ matrix.config.name }})
    needs: [pre-tests]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          # The protocol and secrets crates must build and test with no native
          # system dependency. OpenSSL and libseccomp are not installed.
          - name: Protocol (no native dependencies)
            package_args: '--package tacacsrs-protocol --package tacacsrs-secrets'
            install_openssl: 'false'
            install_libseccomp_dev: 'false'
          # A direct TACACS+ client consumer uses configuration and networking.
          # Networking needs OpenSSL, but not libseccomp or IPC.
          - name: Direct toolkit (OpenSSL)
            package_args: '--package tacacsrs-config --package tacacsrs-networking'
            install_openssl: 'true'
            install_libseccomp_dev: 'false'
          # The local IPC crate is Linux-only through its Unix socket ownership.
          - name: IPC (Linux)
            package_args: '--package tacacsrs-ipc'
            install_openssl: 'false'
            install_libseccomp_dev: 'false'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.validation-ref || github.sha }}

      - name: Install stable Rust
        uses: ./.github/steps/setup-rust
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
          cache-key: stable
          install-libseccomp-dev: ${{ matrix.config.install_libseccomp_dev }}
          install-openssl: ${{ matrix.config.install_openssl }}

      - name: Build and test the isolated selection
        shell: bash
        run: |
          cargo test \
            ${{ matrix.config.package_args }} \
            --target x86_64-unknown-linux-gnu \
            --all-features \
            --locked

  build-validation:
    name: Build Validation (${{ matrix.config.target }})
    needs: [testing]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            packages: 'tacon tacacsrs-agentd tacacsrs-agent-health tacacsrs-bash-plugin'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            packages: 'tacon'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.validation-ref || github.sha }}

      - name: Inject versions
        uses: ./.github/steps/inject-versions
        with:
          versions: ${{ inputs.versions }}

      - name: Require an already hydrated release candidate
        if: inputs.require-hydrated
        shell: bash
        run: git diff --exit-code -- Cargo.lock ':(glob)**/Cargo.toml'

      - name: Install Rust
        uses: ./.github/steps/setup-rust
        with:
          targets: ${{ matrix.config.target }}
          cache-key: stable
          install-libseccomp-dev: ${{ runner.os == 'Linux' }}
          install-openssl: 'true'

      - name: Build with default features and the locked dependency graph
        shell: bash
        env:
          PACKAGES: ${{ matrix.config.packages }}
        run: |
          set -euo pipefail
          for package in $PACKAGES; do
            cargo build --locked --release \
              --target "${{ matrix.config.target }}" \
              --package "$package"
          done

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - armhf
      - automation-tests
      - msrv
      - cache-preflight
      - pre-tests
      - testing
      - consumer-profiles
      - build-validation
    steps:
      - name: Require executed ARMhf coverage
        if: needs.armhf.result != 'success'
        run: exit 1
      - name: Make sure that all jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1