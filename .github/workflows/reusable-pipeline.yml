name: Reusable CI Pipeline

on:
  workflow_call:
    inputs:
      include-fmt:
        description: 'Include the rustfmt check job'
        required: false
        default: true
        type: boolean
      include-proto-compat:
        description: 'Include protobuf backward compatibility check'
        required: false
        default: true
        type: boolean
      include-miri:
        description: 'Include Miri job'
        required: false
        default: true
        type: boolean
      include-fuzz:
        description: 'Include fuzz smoke test job'
        required: false
        default: true
        type: boolean
      include-clippy-nursery:
        description: 'Include clippy nursery lints job'
        required: false
        default: true
        type: boolean
      rust-test-matrix:
        description: 'Deprecated; retained for caller compatibility while test platforms are defined by this workflow'
        required: false
        default: '["stable"]'
        type: string
      proto-compat-ref:
        description: 'Git ref for protobuf backward compatibility check'
        required: false
        default: 'main'
        type: string
      include-outdated:
        description: 'Include the outdated dependencies check job'
        required: false
        default: true
        type: boolean
      skip-audit-if-no-dep-changes:
        description: 'Skip security audit if no dependency files changed'
        required: false
        default: false
        type: boolean
      build-release:
        description: 'Build and test in release mode'
        required: false
        default: true
        type: boolean
      targets:
        description: 'JSON array of build/SBOM target configurations with os, target, asset_name, and optional features'
        required: false
        default: |
          [
            {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu", "asset_name": "tacon-linux-gnu-x86_64", "features": ""},
            {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-musl", "asset_name": "tacon-linux-musl-x86_64", "features": ""},
            {"os": "windows-latest", "target": "x86_64-pc-windows-msvc", "asset_name": "tacon-windows-msvc-x86_64", "features": "psk"}
          ]
        type: string
      binary-name:
        description: 'Name of the binary to build'
        required: false
        default: 'tacon'
        type: string
      versions:
        description: 'JSON map of crate-name → version to inject into Cargo.toml files. Empty or {} is a no-op.'
        required: false
        default: '{}'
        type: string

permissions:
  contents: read
  packages: read

jobs:
  cache-preflight:
    name: Cache Preflight (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Linux Stable
            os: ubuntu-latest
            toolchain: stable
            components: clippy llvm-tools-preview
            targets: x86_64-unknown-linux-musl
            cache_key: stable
            metadata_target: x86_64-unknown-linux-musl
            install_musl_tools: 'true'
            install_libseccomp_dev: 'true'
            install_openssl: 'true'
          - name: Windows Stable
            os: windows-latest
            toolchain: stable
            components: clippy
            targets: x86_64-pc-windows-msvc
            cache_key: stable
            metadata_target: x86_64-pc-windows-msvc
            install_musl_tools: 'false'
            install_libseccomp_dev: 'false'
            install_openssl: 'true'
          - name: Linux Nightly
            os: ubuntu-latest
            toolchain: nightly
            components: rustfmt clippy miri
            targets: x86_64-unknown-linux-musl
            cache_key: nightly
            metadata_target: x86_64-unknown-linux-musl
            install_musl_tools: 'true'
            install_libseccomp_dev: 'true'
            install_openssl: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust and native caches
        uses: ./.github/steps/setup-rust
        with:
          toolchain: ${{ matrix.config.toolchain }}
          components: ${{ matrix.config.components }}
          targets: ${{ matrix.config.targets }}
          cache-key: ${{ matrix.config.cache_key }}
          save-if: 'true'
          install-musl-tools: ${{ matrix.config.install_musl_tools }}
          install-libseccomp-dev: ${{ matrix.config.install_libseccomp_dev }}
          install-openssl: ${{ matrix.config.install_openssl }}

      - name: Resolve cargo metadata
        uses: ./.github/steps/resolve-cargo-metadata
        with:
          metadata-target: ${{ matrix.config.metadata_target }}

  pre-tests:
    name: Pre-Tests (${{ matrix.config.name }})
    needs: [cache-preflight]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Linux GNU
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            feature_args: --all-features
            install_musl_tools: 'false'
            install_libseccomp_dev: 'true'
            install_openssl: 'true'
            metadata_checks: 'true'
          - name: Linux MUSL
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            feature_args: ''
            install_musl_tools: 'true'
            install_libseccomp_dev: 'true'
            install_openssl: 'true'
            metadata_checks: 'false'
          - name: Windows MSVC
            os: windows-latest
            target: x86_64-pc-windows-msvc
            feature_args: --all-features
            install_musl_tools: 'false'
            install_libseccomp_dev: 'false'
            install_openssl: 'true'
            metadata_checks: 'false'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup nightly Rust
        uses: ./.github/steps/setup-rust
        with:
          toolchain: nightly
          components: rustfmt
          targets: ${{ matrix.config.target }}
          cache-key: nightly
          install-musl-tools: ${{ matrix.config.install_musl_tools }}
          install-libseccomp-dev: ${{ matrix.config.install_libseccomp_dev }}
          install-openssl: ${{ matrix.config.install_openssl }}

      - name: Check formatting
        if: inputs.include-fmt
        uses: ./.github/steps/check-format

      - name: Check unused dependencies
        uses: ./.github/steps/check-unused-deps
        with:
          target: ${{ matrix.config.target }}
          feature-args: ${{ matrix.config.feature_args }}

      - name: Setup stable Rust
        uses: ./.github/steps/setup-rust
        with:
          toolchain: stable
          components: clippy
          targets: ${{ matrix.config.target }}
          cache-key: stable
          install-musl-tools: ${{ matrix.config.install_musl_tools }}
          install-libseccomp-dev: ${{ matrix.config.install_libseccomp_dev }}
          install-openssl: ${{ matrix.config.install_openssl }}

      - name: Run Clippy
        uses: ./.github/steps/run-clippy
        with:
          target: ${{ matrix.config.target }}
          feature-args: ${{ matrix.config.feature_args }}

      - name: Clippy nursery lints
        if: inputs.include-clippy-nursery
        uses: ./.github/steps/run-clippy
        with:
          target: ${{ matrix.config.target }}
          feature-args: ${{ matrix.config.feature_args }}
          lint-args: -W clippy::nursery
          advisory: 'true'

      - name: Build documentation
        uses: ./.github/steps/build-docs
        with:
          target: ${{ matrix.config.target }}
          feature-args: ${{ matrix.config.feature_args }}

      - name: Security audit
        if: matrix.config.metadata_checks == 'true'
        uses: ./.github/steps/security-audit
        with:
          skip-if-no-dep-changes: ${{ inputs.skip-audit-if-no-dep-changes }}

      - name: Check outdated dependencies
        if: matrix.config.metadata_checks == 'true' && inputs.include-outdated
        uses: ./.github/steps/check-outdated

      - name: Protobuf compatibility
        if: matrix.config.metadata_checks == 'true' && inputs.include-proto-compat
        uses: ./.github/steps/proto-compat
        with:
          against-ref: ${{ inputs.proto-compat-ref }}
          github-token: ${{ github.token }}

  testing:
    name: Testing (${{ matrix.config.name }})
    needs: [pre-tests]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Linux GNU
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            feature_args: --all-features
            components: llvm-tools-preview
            install_musl_tools: 'false'
            install_libseccomp_dev: 'true'
            install_openssl: 'true'
            coverage: 'true'
            deep_checks: 'true'
          - name: Linux MUSL
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            feature_args: ''
            components: ''
            install_musl_tools: 'true'
            install_libseccomp_dev: 'true'
            install_openssl: 'true'
            coverage: 'false'
            deep_checks: 'false'
          - name: Windows MSVC
            os: windows-latest
            target: x86_64-pc-windows-msvc
            feature_args: --all-features
            components: ''
            install_musl_tools: 'false'
            install_libseccomp_dev: 'false'
            install_openssl: 'true'
            coverage: 'false'
            deep_checks: 'false'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup stable Rust
        uses: ./.github/steps/setup-rust
        with:
          toolchain: stable
          components: ${{ matrix.config.components }}
          targets: ${{ matrix.config.target }}
          cache-key: stable
          install-musl-tools: ${{ matrix.config.install_musl_tools }}
          install-libseccomp-dev: ${{ matrix.config.install_libseccomp_dev }}
          install-openssl: ${{ matrix.config.install_openssl }}

      - name: Run unit tests
        uses: ./.github/steps/run-tests
        with:
          target: ${{ matrix.config.target }}
          feature-args: ${{ matrix.config.feature_args }}
          build-release: ${{ inputs.build-release }}

      - name: Generate coverage
        if: matrix.config.coverage == 'true'
        uses: ./.github/steps/run-coverage

      - name: Setup nightly Rust for deep checks
        if: matrix.config.deep_checks == 'true' && (inputs.include-miri || inputs.include-fuzz)
        uses: ./.github/steps/setup-rust
        with:
          toolchain: nightly
          components: miri
          cache-key: nightly
          install-libseccomp-dev: ${{ matrix.config.install_libseccomp_dev }}
          install-openssl: ${{ matrix.config.install_openssl }}

      - name: Run Miri
        if: matrix.config.deep_checks == 'true' && inputs.include-miri
        uses: ./.github/steps/run-miri

      - name: Run fuzz smoke tests
        if: matrix.config.deep_checks == 'true' && inputs.include-fuzz
        uses: ./.github/steps/run-fuzz-smoke

  official-build:
    name: Official Build (${{ matrix.config.target }})
    needs: [testing]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(inputs.targets) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Inject versions
        uses: ./.github/steps/inject-versions
        with:
          versions: ${{ inputs.versions }}

      - name: Setup Rust
        uses: ./.github/steps/setup-rust
        with:
          targets: ${{ matrix.config.target }}
          cache-key: stable
          install-musl-tools: ${{ contains(matrix.config.target, 'musl') }}
          install-libseccomp-dev: ${{ runner.os == 'Linux' }}
          install-openssl: 'true'

      - name: Compute package names
        uses: ./.github/steps/compute-package-names
        with:
          asset-name: ${{ matrix.config.asset_name }}
          binary-name: ${{ inputs.binary-name }}
          features: ${{ matrix.config.features }}
          build-release: ${{ inputs.build-release }}

      - name: Build binary
        uses: ./.github/steps/build-binary
        with:
          target: ${{ matrix.config.target }}
          binary-name: ${{ inputs.binary-name }}

      - name: Stage binary package
        uses: ./.github/steps/stage-binary-package
        with:
          target: ${{ matrix.config.target }}
          binary-name: ${{ inputs.binary-name }}

      - name: Package debug symbols
        uses: ./.github/steps/package-debug-symbols
        with:
          target: ${{ matrix.config.target }}
          binary-name: ${{ inputs.binary-name }}

      - name: Collect OpenSSL runtime DLLs
        if: runner.os == 'Windows' && contains(matrix.config.features, 'psk')
        uses: ./.github/steps/collect-openssl-runtime

      - name: Package SBOMs
        uses: ./.github/steps/package-sboms
        with:
          target: ${{ matrix.config.target }}
          binary-name: ${{ inputs.binary-name }}
          features: ${{ matrix.config.features }}

      - name: Create Windows archive
        if: runner.os == 'Windows'
        uses: ./.github/steps/create-windows-archive
        with:
          asset-name: ${{ matrix.config.asset_name }}

      - name: Create MUSL archive
        if: contains(matrix.config.target, 'musl')
        uses: ./.github/steps/create-musl-archive
        with:
          asset-name: ${{ matrix.config.asset_name }}

      - name: Package Debian artifacts
        if: matrix.config.target == 'x86_64-unknown-linux-gnu'
        uses: ./.github/steps/package-debian
        with:
          target: ${{ matrix.config.target }}
          binary-name: ${{ inputs.binary-name }}
          versions: ${{ inputs.versions }}

      - name: Upload packaged artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.config.asset_name }}
          path: packaged/*
          retention-days: 7

  finalize-release-assets:
    name: Finalize Release Assets
    needs: [official-build]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download packaged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: raw/packages
          merge-multiple: true

      - name: Stage release assets
        uses: ./.github/steps/stage-release-assets

      - name: Generate checksums
        uses: ./.github/steps/generate-checksums

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release/*
          retention-days: 7

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - cache-preflight
      - pre-tests
      - testing
      - official-build
      - finalize-release-assets
    steps:
      - name: Check all jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1