name: Reusable CI Pipeline

on:
  workflow_call:
    inputs:
      include-fmt:
        description: 'Run the rustfmt validation job'
        required: false
        default: true
        type: boolean
      include-proto-compat:
        description: 'Run the protobuf backward-compatibility validation'
        required: false
        default: true
        type: boolean
      include-miri:
        description: 'Run the Miri job'
        required: false
        default: true
        type: boolean
      include-fuzz:
        description: 'Run the fuzz smoke-test job'
        required: false
        default: true
        type: boolean
      include-container-build:
        description: 'Build the container image'
        required: false
        default: true
        type: boolean
      include-container-publish:
        description: 'If the build succeeds, publish the container image'
        required: false
        default: false
        type: boolean
      container-registry:
        description: 'Container registry and namespace used for image tags, for example ghcr.io/authscaffold'
        required: false
        default: 'ghcr.io/authscaffold'
        type: string
      container-image-name:
        description: 'Container image repository name'
        required: false
        default: 'tacacsrs-agentd'
        type: string
      include-clippy-nursery:
        description: 'Run the Clippy nursery-lint job'
        required: false
        default: true
        type: boolean
      rust-test-matrix:
        description: 'Deprecated. This workflow defines the test platforms. This input remains for caller compatibility.'
        required: false
        default: '["stable"]'
        type: string
      proto-compat-ref:
        description: 'Git ref for protobuf backward-compatibility validation'
        required: false
        default: 'main'
        type: string
      include-outdated:
        description: 'Run the outdated-dependency validation job'
        required: false
        default: true
        type: boolean
      skip-audit-if-no-dep-changes:
        description: 'If dependency files do not change, skip the security audit'
        required: false
        default: false
        type: boolean
      build-release:
        description: 'The build commands and tests use release mode'
        required: false
        default: true
        type: boolean
      products:
        description: 'JSON array of configuration objects for build products. Each object contains package, artifact, target, packaging, and feature metadata.'
        required: false
        default: |
          [
            {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu", "asset_name": "tacon-linux-gnu-x86_64", "package_name": "tacon", "package_root": "executables/tacon", "artifact_name": "tacon", "artifact_kind": "bin", "features": "", "sbom_describe": "binaries"},
            {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu", "asset_name": "tacacsrs-agentd-linux-gnu-x86_64", "package_name": "tacacsrs-agentd", "package_root": "executables/tacacsrs_agentd", "artifact_name": "tacacsrs-agentd", "artifact_kind": "bin", "features": "", "sbom_describe": "binaries"},
            {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu", "asset_name": "tacacsrs-bash-plugin-linux-gnu-x86_64", "package_name": "tacacsrs-bash-plugin", "package_root": "libraries/tacacsrs_bash_plugin", "artifact_name": "tacacsrs_bash_plugin", "artifact_kind": "cdylib", "features": "", "sbom_describe": "all-cargo-targets"},
            {"os": "windows-latest", "target": "x86_64-pc-windows-msvc", "asset_name": "tacon-windows-msvc-x86_64", "package_name": "tacon", "package_root": "executables/tacon", "artifact_name": "tacon", "artifact_kind": "bin", "features": "", "sbom_describe": "binaries"}
          ]
        type: string
      versions:
        description: 'JSON map of crate names to versions for Cargo.toml files. An empty map or {} causes no changes.'
        required: false
        default: '{}'
        type: string

permissions:
  contents: read
  packages: read

jobs:
  cache-preflight:
    name: Cache Preflight (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Linux Stable
            os: ubuntu-latest
            toolchain: stable
            components: clippy llvm-tools-preview
            targets: x86_64-unknown-linux-gnu
            cache_key: stable
            metadata_target: x86_64-unknown-linux-gnu
            install_libseccomp_dev: 'true'
            install_openssl: 'true'
          - name: Windows Stable
            os: windows-latest
            toolchain: stable
            components: clippy
            targets: x86_64-pc-windows-msvc
            cache_key: stable
            metadata_target: x86_64-pc-windows-msvc
            install_libseccomp_dev: 'false'
            install_openssl: 'true'
          - name: Linux Nightly
            os: ubuntu-latest
            toolchain: nightly
            components: rustfmt clippy miri
            targets: x86_64-unknown-linux-gnu
            cache_key: nightly
            metadata_target: x86_64-unknown-linux-gnu
            install_libseccomp_dev: 'true'
            install_openssl: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust and configure native caches
        uses: ./.github/steps/setup-rust
        with:
          toolchain: ${{ matrix.config.toolchain }}
          components: ${{ matrix.config.components }}
          targets: ${{ matrix.config.targets }}
          cache-key: ${{ matrix.config.cache_key }}
          save-if: 'true'
          install-libseccomp-dev: ${{ matrix.config.install_libseccomp_dev }}
          install-openssl: ${{ matrix.config.install_openssl }}

      - name: Resolve cargo metadata
        uses: ./.github/steps/resolve-cargo-metadata
        with:
          metadata-target: ${{ matrix.config.metadata_target }}

  pre-tests:
    name: Pre-Tests (${{ matrix.config.name }})
    needs: [cache-preflight]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Linux GNU
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            feature_args: --all-features
            install_libseccomp_dev: 'true'
            install_openssl: 'true'
            metadata_checks: 'true'
            package_args: '--workspace'
          - name: Windows MSVC
            os: windows-latest
            target: x86_64-pc-windows-msvc
            feature_args: --all-features
            install_libseccomp_dev: 'false'
            install_openssl: 'true'
            metadata_checks: 'false'
            package_args: '--package tacon --package tacacsrs-cli-datastore --package tacacsrs-config --package tacacsrs-datastore --package tacacsrs-flows --package tacacsrs-messages --package tacacsrs-networking --package tacacsrs-secrets'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Install nightly Rust
        uses: ./.github/steps/setup-rust
        with:
          toolchain: nightly
          components: rustfmt
          targets: ${{ matrix.config.target }}
          cache-key: nightly
          install-libseccomp-dev: ${{ matrix.config.install_libseccomp_dev }}
          install-openssl: ${{ matrix.config.install_openssl }}

      - name: Make sure that formatting is correct
        if: inputs.include-fmt
        uses: ./.github/steps/check-format

      - name: Make sure that dependencies are used
        uses: ./.github/steps/check-unused-deps
        with:
          package-args: ${{ matrix.config.package_args }}
          target: ${{ matrix.config.target }}
          feature-args: ${{ matrix.config.feature_args }}

      - name: Install stable Rust
        uses: ./.github/steps/setup-rust
        with:
          toolchain: stable
          components: clippy
          targets: ${{ matrix.config.target }}
          cache-key: stable
          install-libseccomp-dev: ${{ matrix.config.install_libseccomp_dev }}
          install-openssl: ${{ matrix.config.install_openssl }}

      - name: Run Clippy
        uses: ./.github/steps/run-clippy
        with:
          package-args: ${{ matrix.config.package_args }}
          target: ${{ matrix.config.target }}
          feature-args: ${{ matrix.config.feature_args }}

      - name: Run Clippy nursery lints
        if: inputs.include-clippy-nursery
        uses: ./.github/steps/run-clippy
        with:
          package-args: ${{ matrix.config.package_args }}
          target: ${{ matrix.config.target }}
          feature-args: ${{ matrix.config.feature_args }}
          lint-args: -W clippy::nursery
          advisory: 'true'

      - name: Build documentation
        uses: ./.github/steps/build-docs
        with:
          package-args: ${{ matrix.config.package_args }}
          target: ${{ matrix.config.target }}
          feature-args: ${{ matrix.config.feature_args }}

      - name: Run security audit
        if: matrix.config.metadata_checks == 'true'
        uses: ./.github/steps/security-audit
        with:
          skip-if-no-dep-changes: ${{ inputs.skip-audit-if-no-dep-changes }}

      - name: Make sure that dependencies are current
        if: matrix.config.metadata_checks == 'true' && inputs.include-outdated
        uses: ./.github/steps/check-outdated

      - name: Make sure that protobuf changes are backward-compatible
        if: matrix.config.metadata_checks == 'true' && inputs.include-proto-compat
        uses: ./.github/steps/proto-compat
        with:
          against-ref: ${{ inputs.proto-compat-ref }}
          github-token: ${{ github.token }}

  testing:
    name: Testing (${{ matrix.config.name }})
    needs: [pre-tests]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Linux GNU
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            feature_args: --all-features
            components: llvm-tools-preview
            install_libseccomp_dev: 'true'
            install_openssl: 'true'
            coverage: 'true'
            deep_checks: 'true'
            package_args: '--workspace'
          - name: Windows MSVC
            os: windows-latest
            target: x86_64-pc-windows-msvc
            feature_args: --all-features
            components: ''
            install_libseccomp_dev: 'false'
            install_openssl: 'true'
            coverage: 'false'
            deep_checks: 'false'
            package_args: '--package tacon --package tacacsrs-cli-datastore --package tacacsrs-config --package tacacsrs-datastore --package tacacsrs-flows --package tacacsrs-messages --package tacacsrs-networking --package tacacsrs-secrets'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install stable Rust
        uses: ./.github/steps/setup-rust
        with:
          toolchain: stable
          components: ${{ matrix.config.components }}
          targets: ${{ matrix.config.target }}
          cache-key: stable
          install-libseccomp-dev: ${{ matrix.config.install_libseccomp_dev }}
          install-openssl: ${{ matrix.config.install_openssl }}

      - name: Run unit tests
        uses: ./.github/steps/run-tests
        with:
          package-args: ${{ matrix.config.package_args }}
          target: ${{ matrix.config.target }}
          feature-args: ${{ matrix.config.feature_args }}
          build-release: ${{ inputs.build-release }}

      - name: Generate coverage
        if: matrix.config.coverage == 'true'
        uses: ./.github/steps/run-coverage

      - name: Install nightly Rust for extended validation
        if: matrix.config.deep_checks == 'true' && (inputs.include-miri || inputs.include-fuzz)
        uses: ./.github/steps/setup-rust
        with:
          toolchain: nightly
          components: miri
          cache-key: nightly
          install-libseccomp-dev: ${{ matrix.config.install_libseccomp_dev }}
          install-openssl: ${{ matrix.config.install_openssl }}

      - name: Run Miri
        if: matrix.config.deep_checks == 'true' && inputs.include-miri
        uses: ./.github/steps/run-miri

      - name: Run fuzz smoke tests
        if: matrix.config.deep_checks == 'true' && inputs.include-fuzz
        uses: ./.github/steps/run-fuzz-smoke

  official-build:
    name: Official Build (${{ matrix.config.target }})
    needs: [testing]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(inputs.products) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Inject versions
        uses: ./.github/steps/inject-versions
        with:
          versions: ${{ inputs.versions }}

      - name: Install Rust
        uses: ./.github/steps/setup-rust
        with:
          targets: ${{ matrix.config.target }}
          cache-key: stable
          install-libseccomp-dev: ${{ runner.os == 'Linux' }}
          install-openssl: 'true'

      - name: Compute package names
        uses: ./.github/steps/compute-package-names
        with:
          asset-name: ${{ matrix.config.asset_name }}
          package-name: ${{ matrix.config.package_name }}
          artifact-name: ${{ matrix.config.artifact_name }}
          artifact-kind: ${{ matrix.config.artifact_kind }}
          features: ${{ matrix.config.features }}
          build-release: ${{ inputs.build-release }}

      - name: Build binary
        uses: ./.github/steps/build-binary
        with:
          target: ${{ matrix.config.target }}
          package-name: ${{ matrix.config.package_name }}
          artifact-name: ${{ matrix.config.artifact_name }}
          artifact-kind: ${{ matrix.config.artifact_kind }}

      - name: Stage binary package
        uses: ./.github/steps/stage-binary-package
        with:
          target: ${{ matrix.config.target }}

      - name: Package debug symbols
        uses: ./.github/steps/package-debug-symbols
        with:
          target: ${{ matrix.config.target }}

      - name: Collect OpenSSL runtime DLLs
        if: runner.os == 'Windows'
        uses: ./.github/steps/collect-openssl-runtime

      - name: Package SBOMs
        uses: ./.github/steps/package-sboms
        with:
          target: ${{ matrix.config.target }}
          package-root: ${{ matrix.config.package_root }}
          sbom-describe: ${{ matrix.config.sbom_describe }}
          features: ${{ matrix.config.features }}

      - name: Create Windows archive
        if: runner.os == 'Windows'
        uses: ./.github/steps/create-windows-archive
        with:
          asset-name: ${{ matrix.config.asset_name }}

      - name: Create Linux archive
        if: runner.os == 'Linux'
        uses: ./.github/steps/create-linux-archive
        with:
          asset-name: ${{ matrix.config.asset_name }}

      - name: Upload packaged artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.config.asset_name }}
          path: packaged/*
          retention-days: 7

  container-build:
    name: Container Build
    needs: [testing]
    if: ${{ !cancelled() && !failure() && inputs.include-container-build }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build tacacsrs-agentd container image
        uses: ./.github/steps/container-image
        with:
          versions: ${{ inputs.versions }}
          registry: ${{ inputs.container-registry }}
          image-name: ${{ inputs.container-image-name }}

  finalize-release-assets:
    name: Finalize Release Assets
    needs: [official-build]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download packaged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: raw/packages
          merge-multiple: true

      - name: Stage release assets
        uses: ./.github/steps/stage-release-assets

      - name: Generate checksums
        uses: ./.github/steps/generate-checksums

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release/*
          retention-days: 7

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - cache-preflight
      - pre-tests
      - testing
      - official-build
      - container-build
      - finalize-release-assets
    steps:
      - name: Make sure that all jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1