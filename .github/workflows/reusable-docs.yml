name: Reusable Documentation

on:
  workflow_call:
    inputs:
      deny-warnings:
        description: 'Treat documentation warnings as errors'
        required: false
        default: true
        type: boolean
      os-matrix:
        description: 'JSON array of OS runners'
        required: false
        default: '["ubuntu-latest", "windows-latest"]'
        type: string

jobs:
  docs:
    name: Documentation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os-matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust
        uses: ./.github/steps/setup-rust
        with:
          cache-key: docs-${{ matrix.os }}

      - name: Build documentation
        env:
          RUSTDOCFLAGS: ${{ inputs.deny-warnings && '-D warnings' || '' }}
        run: cargo doc --workspace --no-deps --all-features --document-private-items
