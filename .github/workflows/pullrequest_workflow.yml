name: Pull Request

on:
  pull_request:
    branches: ["main"]

permissions:
  pull-requests: read
  contents: read

# Cancel active runs for the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compute-versions:
    name: Compute Pre-release Versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.compute.outputs.versions }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Compute versions
        id: compute
        uses: ./.github/steps/compute-versions
        with:
          binary-name: tacon
          shared-executables: tacacsrs-agentd,tacacsrs-agent-health
          pre-release: dev

  pipeline:
    name: Pull Request Pipeline
    needs: [compute-versions]
    uses: ./.github/workflows/reusable-pipeline.yml
    permissions:
      pull-requests: read
      checks: write
      contents: read
    with:
      rust-test-matrix: '["stable"]'
      skip-audit-if-no-dep-changes: true
      versions: ${{ needs.compute-versions.outputs.versions || '{}' }}
    secrets: inherit

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [pipeline]
    if: always()
    steps:
      - name: Make sure that the pipeline succeeded
        if: needs.pipeline.result != 'success'
        run: exit 1
