name: Pull Request

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: read

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: PR Pipeline
    uses: ./.github/workflows/reusable-pipeline.yml
    permissions:
      checks: write
      contents: read
      packages: read
    with:
      include-nightly-clippy: false
      rust-test-matrix: '["stable", "beta"]'
      skip-audit-if-no-dep-changes: true
    secrets: inherit
