name: Pull Request

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: read

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compute-versions:
    name: Compute Pre-release Versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.compute.outputs.versions }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Compute versions
        id: compute
        uses: ./.github/steps/compute-versions
        with:
          binary-name: tacon
          pre-release: dev

  pipeline:
    name: PR Pipeline
    needs: [compute-versions]
    uses: ./.github/workflows/reusable-pipeline.yml
    permissions:
      checks: write
      contents: read
      packages: read
    with:
      rust-test-matrix: '["stable"]'
      skip-audit-if-no-dep-changes: true
      versions: ${{ needs.compute-versions.outputs.versions || '{}' }}
    secrets: inherit

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [pipeline]
    if: always()
    steps:
      - name: Check pipeline result
        if: needs.pipeline.result != 'success'
        run: exit 1
