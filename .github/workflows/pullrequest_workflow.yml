name: Pull Request

on:
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BINARY_NAME: tacon

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Format Check - Fast fail on formatting issues
  # ============================================
  fmt:
    name: Rustfmt
    uses: ./.github/workflows/reusable-fmt.yml

  # ============================================
  # Clippy Lints - Catch common mistakes
  # ============================================
  clippy:
    name: Clippy
    uses: ./.github/workflows/reusable-clippy.yml

  # ============================================
  # Tests - Run on multiple platforms
  # ============================================
  test:
    name: Test
    uses: ./.github/workflows/reusable-test.yml

  # ============================================
  # Build Check - Verify compilation for all targets
  # ============================================
  build:
    name: Build
    needs: [fmt, clippy]
    uses: ./.github/workflows/reusable-build.yml
    with:
      build-release: true

  # ============================================
  # Build Artifacts - Generate all compiled assets like release
  # Note: Matrix configuration is intentionally duplicated from release.yml
  # to maintain explicit control over PR artifact generation
  # ============================================
  build-artifacts:
    name: Build Artifacts
    needs: [fmt, clippy]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GNU (glibc)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: tacon-linux-gnu-x86_64

          # Linux MUSL (static, Alpine compatible)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_name: tacon-linux-musl-x86_64

          # Windows MSVC
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: tacon-windows-msvc-x86_64.exe
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/steps/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: pr-build-${{ matrix.target }}
          install-musl-tools: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}

      - name: Build Binary
        uses: ./.github/steps/build-binary
        with:
          target: ${{ matrix.target }}
          binary-name: ${{ env.BINARY_NAME }}
          asset-name: ${{ matrix.asset_name }}

  # ============================================
  # Generate Software Bill of Materials (SBOM)
  # ============================================
  sbom:
    name: Generate SBOM
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/steps/setup-rust
        with:
          cache-key: sbom

      - name: Generate SBOM (JSON)
        uses: ./.github/steps/generate-sbom
        with:
          output-format: json
          all-features: 'true'

      - name: Generate SBOM (XML)
        uses: ./.github/steps/generate-sbom
        with:
          output-format: xml
          all-features: 'true'

      - name: Collect SBOM files
        run: |
          mkdir -p sbom-output
          find . -name "*.cdx.json" -type f -exec cp {} sbom-output/ \;
          find . -name "*.cdx.xml" -type f -exec cp {} sbom-output/ \;
          echo "Collected SBOM files:"
          ls -lh sbom-output/

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: sbom-output/*

  # ============================================
  # Create checksums for all artifacts
  # ============================================
  checksums:
    name: Generate Checksums
    needs: [build-artifacts]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          # Use find to handle files robustly
          find . -type f -exec sha256sum {} \; | sed 's|^\./||' > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v6
        with:
          name: checksums-sha256.txt
          path: artifacts/checksums-sha256.txt

  # ============================================
  # Documentation - Ensure docs build without warnings
  # ============================================
  docs:
    name: Documentation
    uses: ./.github/workflows/reusable-docs.yml

  # ============================================
  # Code Coverage - Enforce minimum coverage threshold
  # ============================================
  coverage:
    name: Code Coverage
    uses: ./.github/workflows/reusable-coverage.yml

  # ============================================
  # Security Audit - Check for vulnerabilities
  # Only runs when dependencies change
  # ============================================
  audit:
    name: Security Audit
    uses: ./.github/workflows/reusable-security-audit.yml
    with:
      skip-if-no-dep-changes: true
    secrets: inherit

  # ============================================
  # Final Status - Gate for branch protection
  # Require this single job in GitHub branch protection settings
  # ============================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, build, build-artifacts, sbom, checksums, docs, coverage, audit]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.fmt.result }}" != "success" ]] || \
             [[ "${{ needs.clippy.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.build-artifacts.result }}" != "success" ]] || \
             [[ "${{ needs.sbom.result }}" != "success" ]] || \
             [[ "${{ needs.checksums.result }}" != "success" ]] || \
             [[ "${{ needs.docs.result }}" != "success" ]] || \
             [[ "${{ needs.coverage.result }}" != "success" ]] || \
             [[ "${{ needs.audit.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed!"
