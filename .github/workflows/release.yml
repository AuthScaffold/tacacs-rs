name: Release Assets

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BINARY_NAME: tacon

permissions:
  # Most jobs only need read access; the final release job elevates to write.
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/reusable-build.yml
    with:
      build-release: true
      upload-artifacts: true
      binary-name: tacon

  # ============================================
  # Generate Software Bill of Materials (SBOM)
  # ============================================
  sbom:
    name: Generate SBOM
    uses: ./.github/workflows/reusable-sbom.yml

  # ============================================
  # Build Debian package
  # ============================================
  build-deb:
    name: Build Debian Package
    needs: [build]
    uses: ./.github/workflows/reusable-deb.yml
    with:
      package-name: tacon
      upload-artifacts: true
      binary-artifact-name: tacon-linux-gnu-x86_64

  # ============================================
  # Create checksums for all artifacts
  # ============================================
  checksums:
    name: Generate Checksums
    needs: [build, build-deb]
    uses: ./.github/workflows/reusable-checksums.yml

  release:
    name: Update Release
    needs: [build, build-deb, sbom, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Determine tags
        id: tags
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          # Keep using the highest semver-like v* tag so GitHub-generated release notes
          # compare against the last repository release rather than against an asset upload rerun.
          # This is empty on the first release, which the next step handles explicitly.
          PREVIOUS_TAG="$(git tag --sort=-v:refname 'v*' | grep -Fxv "$TAG" | head -n1 || true)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate PR-title release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tags.outputs.tag }}"
          PREVIOUS_TAG="${{ steps.tags.outputs.previous_tag }}"
          args=(--method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$TAG")
          if [[ -n "$PREVIOUS_TAG" ]]; then
            args+=(-f previous_tag_name="$PREVIOUS_TAG")
          fi
          gh api "${args[@]}" > /tmp/release-notes.json

          BODY="$(jq -er '.body' /tmp/release-notes.json)"
          jq -n \
            --arg name "Release $TAG" \
            --arg body "$BODY" \
            '{name: $name, body: $body}' \
            > /tmp/release-update.json

      - name: Update GitHub release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tags.outputs.tag }}"
          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id')"
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --input /tmp/release-update.json \
            >/dev/null

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub-hosted Ubuntu runners provide a modern bash with mapfile support.
          mapfile -d '' files < <(find artifacts -maxdepth 1 -type f -print0 | sort -z)
          if ((${#files[@]} == 0)); then
            echo "No release artifacts were produced. Check that the build, build-deb, sbom, and checksums jobs completed successfully."
            exit 1
          fi
          gh release upload "${{ steps.tags.outputs.tag }}" "${files[@]}" --clobber
