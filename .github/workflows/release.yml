name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v1.0.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BINARY_NAME: tacon

permissions:
  contents: write

jobs:
  # ============================================
  # Build binaries for all platforms
  # ============================================
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GNU (glibc)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: tacon-linux-gnu-x86_64
            
          # Linux MUSL (static, Alpine compatible)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_name: tacon-linux-musl-x86_64
            
          # Windows MSVC
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: tacon-windows-msvc-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/steps/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: release-${{ matrix.target }}
          install-musl-tools: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}

      - name: Build Binary
        uses: ./.github/steps/build-binary
        with:
          target: ${{ matrix.target }}
          binary-name: ${{ env.BINARY_NAME }}
          asset-name: ${{ matrix.asset_name }}

  # ============================================
  # Create checksums for all artifacts
  # ============================================
  checksums:
    name: Generate Checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      
      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum * > checksums-sha256.txt
          cat checksums-sha256.txt
      
      - name: Upload checksums
        uses: actions/upload-artifact@v6
        with:
          name: checksums-sha256.txt
          path: artifacts/checksums-sha256.txt

  # ============================================
  # Create GitHub Release
  # ============================================
  release:
    name: Create Release
    needs: [build, checksums]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      
      - name: List artifacts
        run: ls -la artifacts/
      
      - name: Get tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
