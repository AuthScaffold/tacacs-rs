name: Release Binaries

# Triggered by CalVer tags pushed from the release-plz.yml CalVer job.
# To add a new binary, append its tag pattern below and ensure the CalVer
# matrix in release-plz.yml includes it.
on:
  push:
    tags:
      - "tacon-*"
      # Uncomment when ready to release:
      # - "tacacsrs-agentd-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., tacon-2026.416.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  # ============================================
  # Gate: ensure CI passed for this commit
  # ============================================
  check-ci:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI to pass
        uses: lewagon/wait-on-check-action@ccfb013c15c8afb7bf2b7c028fb74dc5a068cccc # v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: CI Pipeline / CI Success
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30

  # ============================================
  # Parse binary name and version from the tag
  # ============================================
  parse-tag:
    name: Parse Release Tag
    needs: check-ci
    runs-on: ubuntu-latest
    outputs:
      binary-name: ${{ steps.parse.outputs.binary-name }}
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      has-deb: ${{ steps.parse.outputs.has-deb }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Parse tag
        id: parse
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          # Extract binary name (everything before the last -YYYY.MMDD.BUILD)
          BINARY_NAME=$(echo "$TAG" | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+$//')
          VERSION=$(echo "$TAG" | sed -E 's/^.*-([0-9]+\.[0-9]+\.[0-9]+)$/\1/')

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "binary-name=$BINARY_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Parsed: binary=$BINARY_NAME version=$VERSION tag=$TAG"

          # Check if this binary has debian packaging
          # Find the binary's directory by scanning workspace members
          BINARY_DIR=$(find executables -maxdepth 1 -type d | while read dir; do
            if grep -q "name = \"$BINARY_NAME\"" "$dir/Cargo.toml" 2>/dev/null; then
              echo "$dir"
              break
            fi
          done)

          if [ -n "$BINARY_DIR" ] && [ -d "$BINARY_DIR/debian" ]; then
            echo "has-deb=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-deb=false" >> "$GITHUB_OUTPUT"
          fi

  # ============================================
  # Build binaries for all platforms
  # ============================================
  build:
    name: Build
    needs: parse-tag
    uses: ./.github/workflows/reusable-build.yml
    with:
      build-release: true
      upload-artifacts: true
      binary-name: ${{ needs.parse-tag.outputs.binary-name }}
      version: ${{ needs.parse-tag.outputs.version }}

  # ============================================
  # Generate Software Bill of Materials (SBOM)
  # ============================================
  sbom:
    name: Generate SBOM
    needs: [parse-tag]
    uses: ./.github/workflows/reusable-sbom.yml

  # ============================================
  # Build Debian package (only for binaries with debian/ dir)
  # ============================================
  build-deb:
    name: Build Debian Package
    needs: [parse-tag, build]
    if: needs.parse-tag.outputs.has-deb == 'true'
    uses: ./.github/workflows/reusable-deb.yml
    with:
      package-name: ${{ needs.parse-tag.outputs.binary-name }}
      upload-artifacts: true
      binary-artifact-name: ${{ needs.parse-tag.outputs.binary-name }}-linux-gnu-x86_64
      version: ${{ needs.parse-tag.outputs.version }}

  # ============================================
  # Create checksums for all artifacts
  # ============================================
  checksums:
    name: Generate Checksums
    needs: [parse-tag, build, build-deb]
    if: "!cancelled() && needs.build.result == 'success'"
    uses: ./.github/workflows/reusable-checksums.yml

  # ============================================
  # Create GitHub Release
  # ============================================
  release:
    name: Create Release
    needs: [parse-tag, build, sbom, checksums]
    if: "!cancelled() && needs.build.result == 'success'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.parse-tag.outputs.tag }}
          name: "${{ needs.parse-tag.outputs.binary-name }} ${{ needs.parse-tag.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
