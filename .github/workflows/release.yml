name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Trigger when a release PR is merged
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v1.0.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BINARY_NAME: tacon

permissions:
  contents: write

jobs:
  # ============================================
  # Determine if this is a valid release trigger
  # ============================================
  check-release:
    name: Check Release Trigger
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Check trigger conditions
        id: check
        run: |
          SHOULD_RELEASE="false"
          TAG=""
          
          # Tag push trigger
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then
            SHOULD_RELEASE="true"
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          
          # Manual workflow dispatch
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SHOULD_RELEASE="true"
            TAG="${{ github.event.inputs.tag }}"
          fi
          
          # Merged release PR (check for 'release' label)
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.merged }}" == "true" ]]; then
            if [[ "${{ contains(github.event.pull_request.labels.*.name, 'release') }}" == "true" ]]; then
              SHOULD_RELEASE="true"
              # Extract version from PR title (expects format: "release: vX.Y.Z" or "release: crate-name vX.Y.Z")
              PR_TITLE="${{ github.event.pull_request.title }}"
              TAG=$(echo "$PR_TITLE" | grep -oP 'v\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?' || echo "")
              if [[ -z "$TAG" ]]; then
                echo "::warning::Could not extract version from PR title: $PR_TITLE"
                SHOULD_RELEASE="false"
              fi
            fi
          fi
          
          echo "should-release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Should release: $SHOULD_RELEASE, Tag: $TAG"

  # ============================================
  # Build binaries for all platforms
  # ============================================
  build:
    name: Build (${{ matrix.target }})
    needs: check-release
    if: needs.check-release.outputs.should-release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GNU (glibc)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: tacon-linux-gnu-x86_64
            
          # Linux MUSL (static, Alpine compatible)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_name: tacon-linux-musl-x86_64
            
          # Windows MSVC
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: tacon-windows-msvc-x86_64.exe

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/steps/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: release-${{ matrix.target }}
          install-musl-tools: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}

      - name: Build Binary
        uses: ./.github/steps/build-binary
        with:
          target: ${{ matrix.target }}
          binary-name: ${{ env.BINARY_NAME }}
          asset-name: ${{ matrix.asset_name }}

  # ============================================
  # Create checksums for all artifacts
  # ============================================
  checksums:
    name: Generate Checksums
    needs: [check-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      
      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum * > checksums-sha256.txt
          cat checksums-sha256.txt
      
      - name: Upload checksums
        uses: actions/upload-artifact@v6
        with:
          name: checksums-sha256.txt
          path: artifacts/checksums-sha256.txt

  # ============================================
  # Create GitHub Release
  # ============================================
  release:
    name: Create Release
    needs: [check-release, build, checksums]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      
      - name: List artifacts
        run: ls -la artifacts/

      - name: Create and push tag (for PR-triggered releases)
        if: github.event_name == 'pull_request'
        run: |
          TAG="${{ needs.check-release.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-release.outputs.tag }}
          name: Release ${{ needs.check-release.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.check-release.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
