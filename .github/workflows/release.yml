name: Release Assets

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BINARY_NAME: tacon

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/reusable-build.yml
    with:
      build-release: true
      upload-artifacts: true
      binary-name: tacon

  # ============================================
  # Generate Software Bill of Materials (SBOM)
  # ============================================
  sbom:
    name: Generate SBOM
    uses: ./.github/workflows/reusable-sbom.yml

  # ============================================
  # Build Debian package
  # ============================================
  build-deb:
    name: Build Debian Package
    needs: [build]
    uses: ./.github/workflows/reusable-deb.yml
    with:
      package-name: tacon
      upload-artifacts: true
      binary-artifact-name: tacon-linux-gnu-x86_64

  # ============================================
  # Create checksums for all artifacts
  # ============================================
  checksums:
    name: Generate Checksums
    needs: [build, build-deb]
    uses: ./.github/workflows/reusable-checksums.yml

  release:
    name: Update Release
    needs: [build, build-deb, sbom, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Determine tags
        id: tags
        run: |
          TAG="${{ github.event.release.tag_name }}"
          PREVIOUS_TAG="$(git tag --sort=-v:refname 'v*' | grep -Fxv "$TAG" | head -n1 || true)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate PR-title release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tags.outputs.tag }}"
          PREVIOUS_TAG="${{ steps.tags.outputs.previous_tag }}"

          if [[ -n "$PREVIOUS_TAG" ]]; then
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f previous_tag_name="$PREVIOUS_TAG" \
              > /tmp/release-notes.json
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              > /tmp/release-notes.json
          fi

          TAG="$TAG" python - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["TAG"]
          notes = json.loads(Path("/tmp/release-notes.json").read_text(encoding="utf-8"))
          Path("/tmp/release-update.json").write_text(
              json.dumps(
                  {
                      "name": f"Release {tag}",
                      "body": notes["body"],
                  }
              ),
              encoding="utf-8",
          )
          PY

      - name: Update GitHub release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tags.outputs.tag }}"
          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id')"
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --input /tmp/release-update.json \
            >/dev/null

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find artifacts -maxdepth 1 -type f -print0 | sort -z)
          if ((${#files[@]} == 0)); then
            echo "No release artifacts were produced"
            exit 1
          fi
          gh release upload "${{ steps.tags.outputs.tag }}" "${files[@]}" --clobber
