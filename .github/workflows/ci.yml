name: CI

on:
  push:
    branches: ["main"]
  schedule:
    # Run weekly on Monday at 00:00 UTC to catch dependency issues
    - cron: "0 0 * * 1"

permissions:
  contents: read
  packages: read

jobs:
  # -- Release policy for main pushes ------------------------
  release-policy:
    name: Release Policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip-release: ${{ steps.detect.outputs.skip_release }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - name: Detect norelease marker
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail

          skip_release=false
          reason="release-enabled"
          marker_regex='(^|[^[:alnum:]_-])(\[?(no[-_ ]?release|skip[-_ ]?release)\]?)([^[:alnum:]_-]|$)'
          label_regex='^(no[-_ ]?release|skip[-_ ]?release)$'

          if [ "$EVENT_NAME" != "push" ]; then
            reason="not-a-push"
          elif printf '%s\n' "$HEAD_COMMIT_MESSAGE" | grep -Eiq "$marker_regex"; then
            skip_release=true
            reason="head-commit-marker"
          else
            api_url="${GH_API_URL}/repos/${GH_REPOSITORY}/commits/${COMMIT_SHA}/pulls"
            prs_json=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api_url")

            if printf '%s' "$prs_json" | jq -r '.[].labels[].name?' | grep -Eiq "$label_regex"; then
              skip_release=true
              reason="associated-pr-label"
            fi
          fi

          echo "skip_release=${skip_release}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          echo "skip_release=${skip_release} (${reason})"

  # ── Compute versions from git tags ───────────────────────
  compute-versions:
    name: Compute Versions
    runs-on: ubuntu-latest
    needs: [release-policy]
    if: github.event_name == 'push' && needs.release-policy.outputs.skip-release != 'true'
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.compute.outputs.versions }}
      calver-tag: ${{ steps.compute.outputs.calver_tag }}
      has-release: ${{ steps.compute.outputs.has_release }}
      new-tags: ${{ steps.compute.outputs.new_tags }}
      previous-calver-tag: ${{ steps.compute.outputs.previous_calver_tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: ./.github/steps/setup-rust
        with:
          cache-key: stable
          install-libseccomp-dev: 'false'
          install-openssl: 'false'

      - name: Compute versions
        id: compute
        uses: ./.github/steps/compute-versions
        with:
          binary-name: tacon
          shared-executables: tacacsrs-agentd

  # ── Run the full CI pipeline ─────────────────────────────
  pipeline:
    name: CI Pipeline
    needs: [release-policy, compute-versions]
    if: always()
    uses: ./.github/workflows/reusable-pipeline.yml
    permissions:
      checks: write
      contents: read
      packages: read
    with:
      include-fmt: false
      include-proto-compat: false
      include-outdated: false
      products: |
        [
          {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu", "asset_name": "tacon-linux-gnu-x86_64", "package_name": "tacon", "package_root": "executables/tacon", "artifact_name": "tacon", "artifact_kind": "bin", "features": "psk", "sbom_describe": "binaries", "man_page_name": "tacon", "debian_package": true},
          {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu", "asset_name": "tacacsrs-agentd-linux-gnu-x86_64", "package_name": "tacacsrs-agentd", "package_root": "executables/tacacsrs_agentd", "artifact_name": "tacacsrs-agentd", "artifact_kind": "bin", "features": "psk", "sbom_describe": "binaries", "man_page_name": "tacacsrs-agentd", "debian_package": true},
          {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu", "asset_name": "tacacsrs-bash-plugin-linux-gnu-x86_64", "package_name": "tacacsrs-bash-plugin", "package_root": "libraries/tacacsrs_bash_plugin", "artifact_name": "tacacsrs_bash_plugin", "artifact_kind": "cdylib", "features": "", "sbom_describe": "all-cargo-targets", "man_page_name": "", "debian_package": true},
          {"os": "windows-latest", "target": "x86_64-pc-windows-msvc", "asset_name": "tacon-windows-msvc-x86_64", "package_name": "tacon", "package_root": "executables/tacon", "artifact_name": "tacon", "artifact_kind": "bin", "features": "psk", "sbom_describe": "binaries", "man_page_name": "tacon", "debian_package": false}
        ]
      versions: ${{ needs.release-policy.outputs.skip-release == 'true' && '{}' || needs.compute-versions.outputs.versions || '{}' }}
    secrets: inherit

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [pipeline]
    if: always()
    steps:
      - name: Check pipeline result
        if: needs.pipeline.result != 'success'
        run: exit 1

  # ── Release: tag and publish (only on push to main) ──────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [ci-success, compute-versions, release-policy]
    if: >-
      github.event_name == 'push' &&
      github.repository_owner == 'AuthScaffold' &&
      needs.release-policy.outputs.skip-release != 'true' &&
      needs.ci-success.result == 'success' &&
      needs.compute-versions.outputs.has-release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      # ── Create all new tags (library semver + CalVer) ──
      - name: Create git tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          NEW_TAGS='${{ needs.compute-versions.outputs.new-tags }}'
          echo "$NEW_TAGS" | jq -r '.[]' | while read -r TAG; do
            echo "Creating tag: $TAG"
            git tag -a "$TAG" -m "Release $TAG"
          done

          git push origin --tags

      # ── Download artifacts built by the pipeline ──
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      # ── Create GitHub Release (for tacon only) ──
      - name: Create Release
        if: needs.compute-versions.outputs.calver-tag != ''
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.compute-versions.outputs.calver-tag }}
          name: "tacon ${{ needs.compute-versions.outputs.versions && fromJson(needs.compute-versions.outputs.versions).tacon || '' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          previous_tag: ${{ needs.compute-versions.outputs.previous-calver-tag }}
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
