name: CI

on:
  push:
    branches: ["main"]
  schedule:
    # Run weekly on Monday at 00:00 UTC to catch dependency issues
    - cron: "0 0 * * 1"

permissions:
  contents: read
  packages: read

jobs:
  # ── Compute versions from git tags ───────────────────────
  compute-versions:
    name: Compute Versions
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.compute.outputs.versions }}
      calver-tag: ${{ steps.compute.outputs.calver_tag }}
      has-release: ${{ steps.compute.outputs.has_release }}
      new-tags: ${{ steps.compute.outputs.new_tags }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: ./.github/steps/setup-rust
        with:
          cache-key: compute-versions

      - name: Compute versions
        id: compute
        uses: ./.github/steps/compute-versions
        with:
          binary-name: tacon

  # ── Run the full CI pipeline ─────────────────────────────
  pipeline:
    name: CI Pipeline
    needs: [compute-versions]
    if: always()
    uses: ./.github/workflows/reusable-pipeline.yml
    permissions:
      checks: write
      contents: read
      packages: read
    with:
      include-fmt: false
      include-proto-compat: false
      versions: ${{ needs.compute-versions.outputs.versions || '{}' }}
    secrets: inherit

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [pipeline]
    if: always()
    steps:
      - name: Check pipeline result
        if: needs.pipeline.result != 'success'
        run: exit 1

  # ── Release: tag and publish (only on push to main) ──────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [ci-success, compute-versions]
    if: >-
      github.event_name == 'push' &&
      github.repository_owner == 'AuthScaffold' &&
      needs.ci-success.result == 'success' &&
      needs.compute-versions.outputs.has-release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # ── Create all new tags (library semver + CalVer) ──
      - name: Create git tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          NEW_TAGS='${{ needs.compute-versions.outputs.new-tags }}'
          echo "$NEW_TAGS" | jq -r '.[]' | while read -r TAG; do
            echo "Creating tag: $TAG"
            git tag -a "$TAG" -m "Release $TAG"
          done

          git push origin --tags

      # ── Download artifacts built by the pipeline ──
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      # ── Create GitHub Release (for tacon only) ──
      - name: Create Release
        if: needs.compute-versions.outputs.calver-tag != ''
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.compute-versions.outputs.calver-tag }}
          name: "tacon ${{ needs.compute-versions.outputs.versions && fromJson(needs.compute-versions.outputs.versions).tacon || '' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
