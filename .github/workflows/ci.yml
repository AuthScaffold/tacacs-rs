name: CI

on:
  push:
    branches: ["main"]
  schedule:
    # Run weekly on Monday at 00:00 UTC to catch dependency issues
    - cron: "0 0 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================
  # Complete test suite
  # ============================================
  test:
    name: Test
    uses: ./.github/workflows/reusable-test.yml
    with:
      rust-matrix: '["stable", "beta"]'
      include-msrv: true
      msrv: "1.82"

  # ============================================
  # Code coverage
  # ============================================
  coverage:
    name: Code Coverage
    uses: ./.github/workflows/reusable-coverage.yml

  # ============================================
  # Minimal versions check - ensure dependencies work with minimum versions
  # ============================================
  minimal-versions:
    name: Minimal Versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust nightly
        uses: ./.github/steps/setup-rust
        with:
          toolchain: nightly
          cache-key: minimal-versions

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal

      - name: Generate minimal versions lockfile
        run: cargo +nightly update -Z minimal-versions

      - name: Build with minimal versions
        run: cargo +stable build --workspace --all-features

  # ============================================
  # Check for unused dependencies
  # ============================================
  unused-deps:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/steps/setup-rust
        with:
          toolchain: nightly

      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked

      - name: Check for unused dependencies
        run: cargo +nightly udeps --workspace --all-targets
        continue-on-error: true  # Don't fail CI, just report

  # ============================================
  # Security Audit - Check for new CVEs on schedule
  # Runs weekly to catch newly published vulnerabilities
  # ============================================
  audit:
    name: Security Audit
    uses: ./.github/workflows/reusable-security-audit.yml
    secrets: inherit

  # ============================================
  # Outdated Dependencies - Flag stale dependencies
  # ============================================
  outdated:
    name: Outdated Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/steps/setup-rust

      - name: Install cargo-outdated
        run: cargo install cargo-outdated --locked

      - name: Check for outdated dependencies
        run: cargo outdated --workspace --exit-code 1
        continue-on-error: true  # Don't fail CI, just report

  # ============================================
  # Nightly Compatibility - Catch upcoming Rust changes
  # ============================================
  nightly:
    name: Nightly Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/steps/setup-rust
        with:
          toolchain: nightly
          components: clippy
          cache-key: nightly

      - name: Build on nightly
        run: cargo +nightly build --workspace --all-features
        continue-on-error: true

      - name: Clippy on nightly
        run: cargo +nightly clippy --workspace --all-features -- -D warnings
        continue-on-error: true

  # ============================================
  # Documentation Links - Ensure docs links aren't broken
  # ============================================
  doc-links:
    name: Documentation Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/steps/setup-rust
        with:
          toolchain: nightly

      - name: Check documentation links
        env:
          RUSTDOCFLAGS: -D warnings --check -Z unstable-options
        run: cargo +nightly doc --workspace --no-deps --all-features
        continue-on-error: true
