name: CI

on:
  push:
    branches: ["main"]
  schedule:
    # Run weekly on Monday at 00:00 UTC to catch dependency issues
    - cron: "0 0 * * 1"

permissions:
  contents: read
  packages: read

jobs:
  # ── Compute versions from git tags ───────────────────────
  compute-versions:
    name: Compute Versions
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.assemble.outputs.versions }}
      calver-tag: ${{ steps.calver.outputs.tag }}
      has-release: ${{ steps.assemble.outputs.has_release }}
      new-tags: ${{ steps.assemble.outputs.new_tags }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # ── CalVer for tacon ──
      - name: Find latest CalVer tag
        id: latest-tag
        run: |
          LATEST_TAG=$(git tag --list 'tacon-*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "has_tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
            echo "has_tag=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for tacon changes
        id: app-changes
        run: |
          if [ "${{ steps.latest-tag.outputs.has_tag }}" = "false" ]; then
            echo "No previous tag — treating as changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            DIFF=$(git diff --name-only "${{ steps.latest-tag.outputs.tag }}"..HEAD -- \
              "executables/tacon/" \
              "libraries/")
            if [ -n "$DIFF" ]; then
              echo "Changes detected:"
              echo "$DIFF"
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "No changes since ${{ steps.latest-tag.outputs.tag }}"
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Calculate CalVer version
        id: calver
        if: steps.app-changes.outputs.changed == 'true'
        run: |
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%-m)
          DAY=$(date -u +%-d)
          MMDD=$((MONTH * 100 + DAY))

          TAG_PREFIX="tacon-${YEAR}.${MMDD}."
          EXISTING_BUILDS=$(git tag --list "${TAG_PREFIX}*" | sed "s|${TAG_PREFIX}||" | sort -n)

          if [ -z "$EXISTING_BUILDS" ]; then
            BUILD=0
          else
            MAX_BUILD=$(echo "$EXISTING_BUILDS" | tail -n1)
            BUILD=$((MAX_BUILD + 1))
          fi

          VERSION="${YEAR}.${MMDD}.${BUILD}"
          TAG="tacon-${VERSION}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "CalVer: $VERSION (tag: $TAG)"

      # ── Semver for libraries ──
      - name: Compute library versions
        id: libs
        run: |
          LIB_JSON="{}"
          TAGS_JSON="[]"

          for CARGO_TOML in libraries/*/Cargo.toml; do
            DIR=$(dirname "$CARGO_TOML")
            CRATE=$(grep '^name = ' "$CARGO_TOML" | head -1 | sed 's/name = "\(.*\)"/\1/')

            if [ -z "$CRATE" ]; then
              echo "WARNING: Could not read crate name from ${CARGO_TOML}"
              continue
            fi

            TAG_PREFIX="${CRATE}-v"

            LATEST=$(git tag --list "${TAG_PREFIX}*" --sort=-v:refname | head -n1)

            if [ -z "$LATEST" ]; then
              # First release — start at 0.1.0
              VERSION="0.1.0"
              echo "  ${CRATE}: no tag found → ${VERSION} (initial)"
              LIB_JSON=$(echo "$LIB_JSON" | jq --arg k "$CRATE" --arg v "$VERSION" '. + {($k): $v}')
              TAGS_JSON=$(echo "$TAGS_JSON" | jq --arg t "${TAG_PREFIX}${VERSION}" '. + [$t]')
            else
              CURRENT="${LATEST#${TAG_PREFIX}}"

              DIFF=$(git diff --name-only "${LATEST}"..HEAD -- "${DIR}/")
              if [ -n "$DIFF" ]; then
                # Bump patch
                IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
                PATCH=$((PATCH + 1))
                VERSION="${MAJOR}.${MINOR}.${PATCH}"
                echo "  ${CRATE}: ${CURRENT} → ${VERSION} (changed)"
                LIB_JSON=$(echo "$LIB_JSON" | jq --arg k "$CRATE" --arg v "$VERSION" '. + {($k): $v}')
                TAGS_JSON=$(echo "$TAGS_JSON" | jq --arg t "${TAG_PREFIX}${VERSION}" '. + [$t]')
              else
                VERSION="$CURRENT"
                echo "  ${CRATE}: ${VERSION} (unchanged)"
                LIB_JSON=$(echo "$LIB_JSON" | jq --arg k "$CRATE" --arg v "$VERSION" '. + {($k): $v}')
              fi
            fi
          done

          echo "lib_versions=${LIB_JSON}" >> "$GITHUB_OUTPUT"
          echo "new_lib_tags=${TAGS_JSON}" >> "$GITHUB_OUTPUT"

      # ── Assemble full versions map ──
      - name: Assemble versions
        id: assemble
        run: |
          VERSIONS='${{ steps.libs.outputs.lib_versions }}'

          # Add CalVer for tacon if it was computed
          CALVER='${{ steps.calver.outputs.version }}'
          if [ -n "$CALVER" ]; then
            VERSIONS=$(echo "$VERSIONS" | jq --arg v "$CALVER" '. + {"tacon": $v}')
          fi

          echo "versions=${VERSIONS}" >> "$GITHUB_OUTPUT"
          echo "Final versions map: ${VERSIONS}"

          # Merge library tags with CalVer tag
          NEW_TAGS='${{ steps.libs.outputs.new_lib_tags }}'
          CALVER_TAG='${{ steps.calver.outputs.tag }}'
          if [ -n "$CALVER_TAG" ]; then
            NEW_TAGS=$(echo "$NEW_TAGS" | jq --arg t "$CALVER_TAG" '. + [$t]')
          fi

          echo "new_tags=${NEW_TAGS}" >> "$GITHUB_OUTPUT"

          # There's a release if any new tags need to be created
          if [ "$(echo "$NEW_TAGS" | jq 'length')" -gt 0 ]; then
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Run the full CI pipeline ─────────────────────────────
  pipeline:
    name: CI Pipeline
    needs: [compute-versions]
    if: always()
    uses: ./.github/workflows/reusable-pipeline.yml
    permissions:
      checks: write
      contents: read
      packages: read
    with:
      include-fmt: false
      include-proto-compat: false
      versions: ${{ needs.compute-versions.outputs.versions || '{}' }}
    secrets: inherit

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [pipeline]
    if: always()
    steps:
      - name: Check pipeline result
        if: needs.pipeline.result != 'success'
        run: exit 1

  # ── Release: tag and publish (only on push to main) ──────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [ci-success, compute-versions]
    if: >-
      github.event_name == 'push' &&
      github.repository_owner == 'AuthScaffold' &&
      needs.ci-success.result == 'success' &&
      needs.compute-versions.outputs.has-release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # ── Create all new tags (library semver + CalVer) ──
      - name: Create git tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          NEW_TAGS='${{ needs.compute-versions.outputs.new-tags }}'
          echo "$NEW_TAGS" | jq -r '.[]' | while read -r TAG; do
            echo "Creating tag: $TAG"
            git tag -a "$TAG" -m "Release $TAG"
          done

          git push origin --tags

      # ── Download artifacts built by the pipeline ──
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      # ── Create GitHub Release (for tacon only) ──
      - name: Create Release
        if: needs.compute-versions.outputs.calver-tag != ''
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.compute-versions.outputs.calver-tag }}
          name: "tacon ${{ needs.compute-versions.outputs.versions && fromJson(needs.compute-versions.outputs.versions).tacon || '' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
