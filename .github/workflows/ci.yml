name: CI

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.event_name != 'push' && '-validation' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-policy:
    name: Release Policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip-release: ${{ steps.detect.outputs.skip_release }}
    steps:
      - name: Detect norelease marker
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          skip_release=false
          marker_regex='(^|[^[:alnum:]_-])(\[?(no[-_ ]?release|skip[-_ ]?release)\]?)([^[:alnum:]_-]|$)'
          label_regex='^(no[-_ ]?release|skip[-_ ]?release)$'
          if [ "$EVENT_NAME" = "push" ]; then
            if printf '%s\n' "$HEAD_COMMIT_MESSAGE" | grep -Eiq "$marker_regex"; then
              skip_release=true
            else
              prs_json=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/pulls")
              if printf '%s' "$prs_json" | jq -r '.[].labels[].name?' | grep -Eiq "$label_regex"; then
                skip_release=true
              fi
            fi
          fi
          echo "skip_release=${skip_release}" >> "$GITHUB_OUTPUT"
          echo "skip_release=${skip_release}"

  compute-versions:
    name: Compute Versions
    runs-on: ubuntu-latest
    needs: [release-policy]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      versions: ${{ steps.recover.outputs.versions || steps.compute.outputs.versions }}
      calver-tag: ${{ steps.recover.outputs.calver-tag || steps.compute.outputs.calver_tag }}
      has-release: ${{ steps.recover.outputs.has-release || steps.compute.outputs.has_release }}
      new-tags: ${{ steps.recover.outputs.new-tags || steps.compute.outputs.new_tags }}
      previous-calver-tag: ${{ steps.recover.outputs.previous-calver-tag || steps.compute.outputs.previous_calver_tag }}
      candidate: ${{ steps.recover.outputs.candidate }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: ./.github/steps/setup-rust
        with:
          cache-key: stable
          install-libseccomp-dev: 'true'
          install-openssl: 'true'
      - name: Recover an interrupted source release
        id: recover
        if: github.event_name == 'push'
        uses: ./.github/steps/source-release
        with:
          command: recover
          source: ${{ github.sha }}
      - name: Compute versions
        id: compute
        if: steps.recover.outputs.candidate == ''
        uses: ./.github/steps/compute-versions
        with:
          binary-name: tacon
          shared-executables: tacacsrs-agentd,tacacsrs-agent-health
          skip-semver-checks: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}

  prepare-release:
    name: Prepare Verified Source
    runs-on: ubuntu-latest
    needs: [release-policy, compute-versions]
    if: >-
      github.repository_owner == 'AuthScaffold' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        needs.release-policy.outputs.skip-release != 'true' &&
        needs.compute-versions.outputs.has-release == 'true'))
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.prepare.outputs.candidate }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Prepare signed hydrated source without publishing refs
        id: prepare
        uses: ./.github/steps/source-release
        with:
          command: prepare
          source: ${{ github.sha }}
          candidate: ${{ needs.compute-versions.outputs.candidate }}
          versions: ${{ needs.compute-versions.outputs.versions }}
          new-tags: ${{ needs.compute-versions.outputs.new-tags }}
          calver-tag: ${{ needs.compute-versions.outputs.calver-tag }}
          previous-calver-tag: ${{ needs.compute-versions.outputs.previous-calver-tag }}

  pipeline:
    name: CI Pipeline
    needs: [release-policy, compute-versions, prepare-release]
    if: >-
      !cancelled() &&
      needs.release-policy.result == 'success' &&
      (needs.compute-versions.result == 'success' || needs.compute-versions.result == 'skipped') &&
      (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    uses: ./.github/workflows/reusable-pipeline.yml
    permissions:
      checks: write
      contents: read
      pull-requests: read
    with:
      include-fmt: false
      include-proto-compat: false
      include-outdated: false
      validation-ref: ${{ needs.prepare-release.outputs.candidate || github.sha }}
      require-hydrated: ${{ needs.prepare-release.result == 'success' }}
      versions: ${{ needs.compute-versions.outputs.versions || '{}' }}
    secrets: inherit

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [pipeline, compute-versions, release-policy, prepare-release]
    if: always()
    steps:
      - name: Require validation and release policy
        if: needs.pipeline.result != 'success' || needs.release-policy.result != 'success'
        run: exit 1
      - name: Require version computation on pushes and rehearsals
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          needs.compute-versions.result != 'success'
        run: exit 1
      - name: Require the signed candidate for eligible releases
        if: >-
          github.repository_owner == 'AuthScaffold' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' &&
            needs.release-policy.outputs.skip-release != 'true' &&
            needs.compute-versions.outputs.has-release == 'true')) &&
          needs.prepare-release.result != 'success'
        run: exit 1

  # GitHub generates source downloads from the hydrated tag, not github.sha.
  release:
    name: Release Source
    runs-on: ubuntu-latest
    needs: [ci-success, prepare-release]
    if: >-
      github.event_name == 'push' &&
      needs.ci-success.result == 'success' &&
      needs.prepare-release.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Publish the hydrated tag and create its GitHub Release
        uses: ./.github/steps/source-release
        with:
          command: publish
          source: ${{ github.sha }}
          candidate: ${{ needs.prepare-release.outputs.candidate }}
