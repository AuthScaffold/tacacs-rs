name: CI

on:
  push:
    branches: ["main"]
  schedule:
    # Run weekly on Monday at 00:00 UTC to catch dependency issues
    - cron: "0 0 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================
  # Complete test suite
  # ============================================
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: [stable, beta]
        include:
          # Also test MSRV on Linux
          - os: ubuntu-latest
            rust: "1.75"  # Update to your MSRV
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust ${{ matrix.rust }}
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal
          rustup default ${{ matrix.rust }}
      
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.rust }}
      
      - name: Run tests
        run: cargo test --workspace --all-features

  # ============================================
  # Code coverage
  # ============================================
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview
      
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      
      - uses: Swatinem/rust-cache@v2
      
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  # ============================================
  # Dependency check - ensure Cargo.lock is up to date
  # ============================================
  lockfile:
    name: Lockfile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      
      - name: Check Cargo.lock
        run: cargo update --locked

  # ============================================
  # Minimal versions check - ensure dependencies work with minimum versions
  # ============================================
  minimal-versions:
    name: Minimal Versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust nightly
        run: rustup toolchain install nightly --profile minimal
      
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      
      - uses: Swatinem/rust-cache@v2
        with:
          key: minimal-versions
      
      - name: Generate minimal versions lockfile
        run: cargo +nightly update -Z minimal-versions
      
      - name: Build with minimal versions
        run: cargo +stable build --workspace --all-features

  # ============================================
  # Check for unused dependencies
  # ============================================
  unused-deps:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust nightly
        run: rustup toolchain install nightly --profile minimal
      
      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked
      
      - uses: Swatinem/rust-cache@v2
      
      - name: Check for unused dependencies
        run: cargo +nightly udeps --workspace --all-targets
        continue-on-error: true  # Don't fail CI, just report
