name: CI

on:
  push:
    branches: ["main"]
  schedule:
    # Run weekly on Monday at 00:00 UTC to catch dependency issues
    - cron: "0 0 * * 1"

permissions:
  contents: read
  packages: read

jobs:
  # ── Compute versions before building ─────────────────────
  compute-versions:
    name: Compute Versions
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
    outputs:
      calver: ${{ steps.calver.outputs.version }}
      calver-tag: ${{ steps.calver.outputs.tag }}
      has-app-changes: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Find latest CalVer tag
        id: latest-tag
        run: |
          LATEST_TAG=$(git tag --list 'tacon-*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "has_tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
            echo "has_tag=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for changes since last tag
        id: changes
        run: |
          if [ "${{ steps.latest-tag.outputs.has_tag }}" = "false" ]; then
            echo "No previous tag — treating as changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            DIFF=$(git diff --name-only "${{ steps.latest-tag.outputs.tag }}"..HEAD -- \
              "executables/tacon/" \
              "libraries/")
            if [ -n "$DIFF" ]; then
              echo "Changes detected:"
              echo "$DIFF"
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "No changes since ${{ steps.latest-tag.outputs.tag }}"
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Calculate CalVer version
        id: calver
        if: steps.changes.outputs.changed == 'true'
        run: |
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%-m)
          DAY=$(date -u +%-d)
          MMDD=$((MONTH * 100 + DAY))

          TAG_PREFIX="tacon-${YEAR}.${MMDD}."
          EXISTING_BUILDS=$(git tag --list "${TAG_PREFIX}*" | sed "s|${TAG_PREFIX}||" | sort -n)

          if [ -z "$EXISTING_BUILDS" ]; then
            BUILD=0
          else
            MAX_BUILD=$(echo "$EXISTING_BUILDS" | tail -n1)
            BUILD=$((MAX_BUILD + 1))
          fi

          VERSION="${YEAR}.${MMDD}.${BUILD}"
          TAG="tacon-${VERSION}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Calculated version: $VERSION (tag: $TAG)"

  # ── Run the full CI pipeline ─────────────────────────────
  pipeline:
    name: CI Pipeline
    needs: [compute-versions]
    if: always()
    uses: ./.github/workflows/reusable-pipeline.yml
    permissions:
      checks: write
      contents: read
      packages: read
    with:
      include-fmt: false
      include-proto-compat: false
      version: ${{ needs.compute-versions.outputs.calver }}
    secrets: inherit

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [pipeline]
    if: always()
    steps:
      - name: Check pipeline result
        if: needs.pipeline.result != 'success'
        run: exit 1

  # ── Release: tag and publish (only on push to main) ──────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [ci-success, compute-versions]
    if: >-
      github.event_name == 'push' &&
      github.repository_owner == 'AuthScaffold' &&
      needs.ci-success.result == 'success' &&
      needs.compute-versions.outputs.has-app-changes == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # ── Library tags via release-plz ──
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz release
        uses: release-plz/action@v0.5
        with:
          command: release
          verbose: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── CalVer tag for tacon ──
      - name: Create CalVer tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "${{ needs.compute-versions.outputs.calver-tag }}" \
            -m "Release tacon ${{ needs.compute-versions.outputs.calver }}"

          git push origin "${{ needs.compute-versions.outputs.calver-tag }}"

      # ── Download artifacts built by the pipeline ──
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      # ── Create GitHub Release ──
      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.compute-versions.outputs.calver-tag }}
          name: "tacon ${{ needs.compute-versions.outputs.calver }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
