name: CI

on:
  push:
    branches: ["main"]
  schedule:
    # Run weekly on Monday at 00:00 UTC to catch dependency issues
    - cron: "0 0 * * 1"

permissions:
  contents: read
  packages: read

jobs:
  pipeline:
    name: CI Pipeline
    uses: ./.github/workflows/reusable-pipeline.yml
    permissions:
      checks: write
      contents: read
      packages: read
    with:
      include-fmt: false
      include-proto-compat: false
    secrets: inherit
