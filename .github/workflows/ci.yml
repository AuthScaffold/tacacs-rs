name: CI

on:
  push:
    branches: ["main"]
  schedule:
    # Run weekly on Monday at 00:00 UTC to catch dependency issues
    - cron: "0 0 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BINARY_NAME: tacon

jobs:
  # ============================================
  # Complete test suite
  # ============================================
  test:
    name: Test
    uses: ./.github/workflows/reusable-test.yml
    with:
      rust-matrix: '["stable", "beta"]'
      include-msrv: true
      msrv: "1.82"

  # ============================================
  # Code coverage
  # ============================================
  coverage:
    name: Code Coverage
    uses: ./.github/workflows/reusable-coverage.yml

  # ============================================
  # Minimal versions check - ensure dependencies work with minimum versions
  # ============================================
  minimal-versions:
    name: Minimal Versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust nightly
        uses: ./.github/steps/setup-rust
        with:
          toolchain: nightly
          cache-key: minimal-versions

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal

      - name: Generate minimal versions lockfile
        run: cargo +nightly update -Z minimal-versions

      - name: Build with minimal versions
        run: cargo +stable build --workspace --all-features

  # ============================================
  # Check for unused dependencies
  # ============================================
  unused-deps:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/steps/setup-rust
        with:
          toolchain: nightly

      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked

      - name: Check for unused dependencies
        run: cargo +nightly udeps --workspace --all-targets
        continue-on-error: true  # Don't fail CI, just report

  # ============================================
  # Security Audit - Check for new CVEs on schedule
  # Runs weekly to catch newly published vulnerabilities
  # ============================================
  audit:
    name: Security Audit
    uses: ./.github/workflows/reusable-security-audit.yml
    secrets: inherit

  # ============================================
  # Outdated Dependencies - Flag stale dependencies
  # ============================================
  outdated:
    name: Outdated Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/steps/setup-rust

      - name: Install cargo-outdated
        run: cargo install cargo-outdated --locked

      - name: Check for outdated dependencies
        run: cargo outdated --workspace --exit-code 1
        continue-on-error: true  # Don't fail CI, just report

  # ============================================
  # Nightly Compatibility - Catch upcoming Rust changes
  # ============================================
  nightly:
    name: Nightly Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/steps/setup-rust
        with:
          toolchain: nightly
          components: clippy
          cache-key: nightly

      - name: Build on nightly
        run: cargo +nightly build --workspace --all-features
        continue-on-error: true

      - name: Clippy on nightly
        run: cargo +nightly clippy --workspace --all-features -- -D warnings
        continue-on-error: true

  # ============================================
  # Documentation Links - Ensure docs links aren't broken
  # ============================================
  doc-links:
    name: Documentation Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/steps/setup-rust
        with:
          toolchain: nightly

      - name: Check documentation links
        env:
          RUSTDOCFLAGS: -D warnings --check -Z unstable-options
        run: cargo +nightly doc --workspace --no-deps --all-features
        continue-on-error: true

  # ============================================
  # Build binaries for all platforms (outputs artifacts like release)
  # ============================================
  build-artifacts:
    name: Build Artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GNU (glibc)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: tacon-linux-gnu-x86_64

          # Linux MUSL (static, Alpine compatible)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_name: tacon-linux-musl-x86_64

          # Windows MSVC
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: tacon-windows-msvc-x86_64.exe
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/steps/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: ci-build-${{ matrix.target }}
          install-musl-tools: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}

      - name: Build Binary
        uses: ./.github/steps/build-binary
        with:
          target: ${{ matrix.target }}
          binary-name: ${{ env.BINARY_NAME }}
          asset-name: ${{ matrix.asset_name }}

  # ============================================
  # Generate Software Bill of Materials (SBOM)
  # ============================================
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/steps/setup-rust
        with:
          cache-key: sbom

      - name: Generate SBOM (JSON)
        uses: ./.github/steps/generate-sbom
        with:
          output-format: json
          all-features: 'true'

      - name: Generate SBOM (XML)
        uses: ./.github/steps/generate-sbom
        with:
          output-format: xml
          all-features: 'true'

      - name: Collect SBOM files
        run: |
          mkdir -p sbom-output
          find . -name "*.cdx.json" -type f -exec cp {} sbom-output/ \;
          find . -name "*.cdx.xml" -type f -exec cp {} sbom-output/ \;
          echo "Collected SBOM files:"
          ls -lh sbom-output/

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: sbom-output/*

  # ============================================
  # Create checksums for all artifacts
  # ============================================
  checksums:
    name: Generate Checksums
    needs: [build-artifacts]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum * > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v6
        with:
          name: checksums-sha256.txt
          path: artifacts/checksums-sha256.txt
