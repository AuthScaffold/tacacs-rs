name: CI

on:
  push:
    branches: ["main"]
  schedule:
    # Run weekly on Monday at 00:00 UTC to catch dependency issues
    - cron: "0 0 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BINARY_NAME: tacon

jobs:
  # ── Tier 1: Cheapest, most likely to fail ────────────────
  docs:
    name: Documentation Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/steps/setup-rust
        with:
          toolchain: nightly

      - name: Check documentation links
        env:
          RUSTDOCFLAGS: -D warnings --check -Z unstable-options
        run: cargo +nightly doc --workspace --no-deps --all-features
        continue-on-error: true

  proto-compat:
    name: Protobuf Compatibility
    uses: ./.github/workflows/reusable-proto-compat.yml

  audit:
    name: Security Audit
    uses: ./.github/workflows/reusable-security-audit.yml
    secrets: inherit

  # ── Tier 2: Moderate cost ────────────────────────────────
  test:
    name: Test
    uses: ./.github/workflows/reusable-test.yml
    with:
      rust-matrix: '["stable", "beta"]'
      include-msrv: true
      msrv: "1.85"
      release: true

  coverage:
    name: Code Coverage
    uses: ./.github/workflows/reusable-coverage.yml

  clippy-nursery:
    name: Clippy Nursery
    uses: ./.github/workflows/reusable-clippy-nursery.yml

  # ── Tier 3: Expensive, gate on tests ────────────────────
  miri:
    name: Miri
    needs: [test]
    uses: ./.github/workflows/reusable-miri.yml

  fuzz:
    name: Fuzz Smoke Test
    needs: [test, miri]
    uses: ./.github/workflows/reusable-fuzz.yml

  nightly:
    name: Nightly Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/steps/setup-rust
        with:
          toolchain: nightly
          components: clippy
          cache-key: nightly

      - name: Build on nightly
        run: cargo +nightly build --workspace --all-features
        continue-on-error: true

      - name: Clippy on nightly
        run: cargo +nightly clippy --workspace --all-features -- -D warnings
        continue-on-error: true

  minimal-versions:
    name: Minimal Versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust nightly
        uses: ./.github/steps/setup-rust
        with:
          toolchain: nightly
          cache-key: minimal-versions

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal

      - name: Generate minimal versions lockfile
        run: cargo +nightly update -Z minimal-versions

      - name: Build with minimal versions
        run: cargo +stable build --workspace --all-features

  # ── Tier 4: Informational dependency checks ─────────────
  unused-deps:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/steps/setup-rust
        with:
          toolchain: nightly

      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked

      - name: Check for unused dependencies
        run: cargo +nightly udeps --workspace --all-targets
        continue-on-error: true

  outdated:
    name: Outdated Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/steps/setup-rust

      - name: Install cargo-outdated
        run: cargo install cargo-outdated --locked

      - name: Check for outdated dependencies
        run: cargo outdated --workspace --exit-code 1
        continue-on-error: true

  # ── Tier 5: Artifacts, gate on tests ─────────────────────
  build-artifacts:
    name: Build Artifacts
    needs: [test, miri]
    uses: ./.github/workflows/reusable-build.yml
    with:
      build-release: true
      upload-artifacts: true
      binary-name: tacon

  sbom:
    name: Generate SBOM
    uses: ./.github/workflows/reusable-sbom.yml

  build-deb:
    name: Build Debian Package
    needs: [build-artifacts]
    uses: ./.github/workflows/reusable-deb.yml
    with:
      package-name: tacon
      upload-artifacts: true
      binary-artifact-name: tacon-linux-gnu-x86_64

  checksums:
    name: Generate Checksums
    needs: [build-artifacts, build-deb]
    uses: ./.github/workflows/reusable-checksums.yml
