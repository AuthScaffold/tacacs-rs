name: Generate Coverage
description: Generate code coverage report with summary and HTML artifact

inputs:
  output-path:
    description: 'Output path for the LCOV file'
    required: false
    default: 'lcov.info'
  fail-under-lines:
    description: 'Fail if line coverage is below this percentage (0 to disable)'
    required: false
    default: '0'

runs:
  using: composite
  steps:
    - name: Generate LCOV report
      shell: bash
      run: cargo llvm-cov --workspace --all-features --lcov --output-path ${{ inputs.output-path }}

    - name: Generate text summary
      shell: bash
      run: |
        echo '## Code Coverage' >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        cargo llvm-cov report --lcov --summary-only 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
        echo '```' >> "$GITHUB_STEP_SUMMARY"

    - name: Generate HTML report
      shell: bash
      run: cargo llvm-cov report --html --output-dir coverage-html

    - name: Upload HTML coverage artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: coverage-report
        path: coverage-html/

    - name: Check minimum coverage
      if: inputs.fail-under-lines != '0'
      shell: bash
      run: cargo llvm-cov report --fail-under-lines ${{ inputs.fail-under-lines }}
