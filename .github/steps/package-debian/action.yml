name: Package Debian Artifacts
description: Prepare Debian package assets. Then build the packages. Make sure that each package is valid. Then collect the packages.

inputs:
  target:
    description: 'Rust target triple that was built'
    required: true
  package-name:
    description: 'Cargo/debian package name'
    required: true
  package-root:
    description: 'Path to the package root containing Cargo.toml and debian assets'
    required: true
  man-page-name:
    description: 'Optional man page basename without extension'
    required: true
    default: ''
  versions:
    description: 'JSON map of package versions to inject'
    required: false
    default: '{}'

runs:
  using: composite
  steps:
    - name: Prepare Debian package assets
      uses: ./.github/steps/prepare-debian-package-assets
      with:
        target: ${{ inputs.target }}
        package-name: ${{ inputs.package-name }}
        package-root: ${{ inputs.package-root }}
        man-page-name: ${{ inputs.man-page-name }}
        versions: ${{ inputs.versions }}

    - name: Install cargo-deb
      uses: ./.github/steps/install-cargo-deb

    - name: Build Debian package
      uses: ./.github/steps/build-debian-package
      with:
        package-name: ${{ inputs.package-name }}

    - name: Make sure that the Debian package is valid
      uses: ./.github/steps/verify-debian-package
      with:
        package-name: ${{ inputs.package-name }}

    - name: Collect Debian packages
      uses: ./.github/steps/collect-debian-packages
      with:
        package-name: ${{ inputs.package-name }}
