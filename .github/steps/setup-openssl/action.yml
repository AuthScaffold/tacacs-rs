name: Setup OpenSSL
description: Install OpenSSL for building with the PSK feature. Uses apt on Linux and vcpkg with caching on Windows.

inputs:
  vcpkg-version:
    description: 'vcpkg commit or tag to checkout (used as part of the cache key)'
    required: false
    default: '2025.06.13'

runs:
  using: composite
  steps:
    # ── Linux: cached apt install ──────────────────────────
    - name: Restore OpenSSL apt cache (Linux)
      if: runner.os == 'Linux'
      id: apt-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: /tmp/openssl-debs
        key: apt-openssl-dev-linux-${{ runner.arch }}

    - name: Install OpenSSL from cache (Linux)
      if: runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit == 'true'
      shell: bash
      run: sudo dpkg -i /tmp/openssl-debs/*.deb

    - name: Install OpenSSL via apt (Linux)
      if: runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
        mkdir -p /tmp/openssl-debs
        cp /var/cache/apt/archives/libssl-dev*.deb /var/cache/apt/archives/pkg-config*.deb /tmp/openssl-debs/ 2>/dev/null || true

    # ── Windows: restore cached vcpkg install ─────────────
    - name: Restore vcpkg OpenSSL cache (Windows)
      if: runner.os == 'Windows'
      id: vcpkg-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: C:\vcpkg\installed
        key: vcpkg-openssl-windows-x64-${{ inputs.vcpkg-version }}

    - name: Install OpenSSL via vcpkg (Windows)
      if: runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        vcpkg install openssl:x64-windows
        vcpkg integrate install

    - name: Set OpenSSL environment variables (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $opensslDir = "C:\vcpkg\installed\x64-windows"
        echo "OPENSSL_DIR=$opensslDir" >> $env:GITHUB_ENV
        echo "OPENSSL_LIB_DIR=$opensslDir\lib" >> $env:GITHUB_ENV
        echo "OpenSSL configured: OPENSSL_DIR=$opensslDir"
