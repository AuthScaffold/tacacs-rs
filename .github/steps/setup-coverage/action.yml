name: Setup Coverage
description: Install Rust with llvm-tools and cargo-llvm-cov for code coverage

inputs:
  cache-key:
    description: 'Additional cache key suffix'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install Rust toolchain with llvm-tools
      shell: bash
      run: rustup toolchain install stable --profile minimal --component llvm-tools-preview

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@eea29cff9a2b68892c0845ae3e4f45fc47ee9354 # v2.75.13
      with:
        tool: cargo-llvm-cov

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      with:
        key: ${{ inputs.cache-key }}
