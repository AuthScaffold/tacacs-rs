name: Setup Rust
description: Install Rust toolchain with Linux build dependencies, optional components, targets, and caching

inputs:
  toolchain:
    description: 'Rust toolchain to install (stable, beta, nightly, or specific version)'
    required: false
    default: 'stable'
  components:
    description: 'Space-separated list of components to install (e.g., "clippy rustfmt llvm-tools-preview")'
    required: false
    default: ''
  targets:
    description: 'Space-separated list of targets to install (e.g., "x86_64-unknown-linux-musl")'
    required: false
    default: ''
  cache-key:
    description: 'Shared cache key for Swatinem/rust-cache (jobs with the same key share one cache slot)'
    required: false
    default: ''
  save-if:
    description: 'Whether to save the cache at the end of the job. Only the warm-cache job and nightly-specific jobs should save.'
    required: false
    default: 'false'
  install-musl-tools:
    description: 'Install musl-tools on Linux (for musl targets)'
    required: false
    default: 'false'
  install-libseccomp-dev:
    description: 'Install libseccomp-dev on Linux (required by session-wrapper)'
    required: false
    default: 'true'
  musl-libseccomp-version:
    description: 'libseccomp version to build statically for musl targets'
    required: false
    default: '2.6.0'

outputs:
  cache-hit:
    description: 'Whether the Rust cache was restored'
    value: ${{ steps.rust-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Build rustup command
      id: rustup-cmd
      shell: bash
      run: |
        CMD="rustup toolchain install $(printf '%q' "${{ inputs.toolchain }}") --profile minimal"
        
        # Add components if specified
        if [ -n "${{ inputs.components }}" ]; then
          IFS=' ' read -ra COMPONENTS <<< "${{ inputs.components }}"
          for component in "${COMPONENTS[@]}"; do
            CMD="$CMD --component $(printf '%q' "$component")"
          done
        fi
        
        # Add targets if specified
        if [ -n "${{ inputs.targets }}" ]; then
          IFS=' ' read -ra TARGETS <<< "${{ inputs.targets }}"
          for target in "${TARGETS[@]}"; do
            CMD="$CMD --target $(printf '%q' "$target")"
          done
        fi
        
        echo "cmd=$CMD" >> $GITHUB_OUTPUT

    - name: Install Rust toolchain
      shell: bash
      run: |
        ${{ steps.rustup-cmd.outputs.cmd }}
        rustup default ${{ inputs.toolchain }}

    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        PACKAGES=()

        if [ "${{ inputs.install-musl-tools }}" = "true" ]; then
          for package in gcc gperf linux-libc-dev make musl-tools; do
            if ! dpkg -s "$package" &>/dev/null; then
              PACKAGES+=("$package")
            fi
          done
        fi

        if [ "${{ inputs.install-libseccomp-dev }}" = "true" ] && ! dpkg -s libseccomp-dev &>/dev/null; then
          PACKAGES+=(libseccomp-dev)
        fi

        if [ ${#PACKAGES[@]} -eq 0 ]; then
          echo "Linux build dependencies already installed"
          exit 0
        fi

        sudo apt-get update
        sudo apt-get install -y "${PACKAGES[@]}"

    - name: Restore musl libseccomp cache
      id: musl-libseccomp-cache
      if: inputs.install-musl-tools == 'true' && runner.os == 'Linux'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.cache/tacacs-rs/libseccomp-musl/${{ inputs.musl-libseccomp-version }}/x86_64-linux-musl
        key: libseccomp-musl-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.musl-libseccomp-version }}-x86_64-linux-musl

    - name: Build libseccomp for musl
      if: inputs.install-musl-tools == 'true' && runner.os == 'Linux' && steps.musl-libseccomp-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        LIBSECCOMP_VERSION: ${{ inputs.musl-libseccomp-version }}
      run: |
        LIBSECCOMP_PREFIX="$HOME/.cache/tacacs-rs/libseccomp-musl/${LIBSECCOMP_VERSION}/x86_64-linux-musl"
        LIBSECCOMP_TARBALL="$RUNNER_TEMP/libseccomp-${LIBSECCOMP_VERSION}.tar.gz"
        DEB_HOST_MULTIARCH="$(gcc -print-multiarch)"
        LIBSECCOMP_CPPFLAGS="-idirafter /usr/include -idirafter /usr/include/${DEB_HOST_MULTIARCH}"

        rm -rf "$LIBSECCOMP_PREFIX"

        curl -fsSLo "$LIBSECCOMP_TARBALL" \
          "https://github.com/seccomp/libseccomp/releases/download/v${LIBSECCOMP_VERSION}/libseccomp-${LIBSECCOMP_VERSION}.tar.gz"
        tar -xzf "$LIBSECCOMP_TARBALL" -C "$RUNNER_TEMP"

        cd "$RUNNER_TEMP/libseccomp-${LIBSECCOMP_VERSION}"
        ./configure \
          --host=x86_64-linux-musl \
          --prefix="$LIBSECCOMP_PREFIX" \
          --enable-static \
          --disable-shared \
          CPPFLAGS="$LIBSECCOMP_CPPFLAGS" \
          CC=musl-gcc
        make -j"$(nproc)"
        make install

    - name: Configure musl libseccomp environment
      if: inputs.install-musl-tools == 'true' && runner.os == 'Linux'
      shell: bash
      env:
        LIBSECCOMP_VERSION: ${{ inputs.musl-libseccomp-version }}
      run: |
        LIBSECCOMP_PREFIX="$HOME/.cache/tacacs-rs/libseccomp-musl/${LIBSECCOMP_VERSION}/x86_64-linux-musl"

        test -f "$LIBSECCOMP_PREFIX/lib/libseccomp.a"
        test -f "$LIBSECCOMP_PREFIX/lib/pkgconfig/libseccomp.pc"

        echo "LIBSECCOMP_LIB_PATH=$LIBSECCOMP_PREFIX/lib" >> "$GITHUB_ENV"
        echo "LIBSECCOMP_LINK_TYPE=static" >> "$GITHUB_ENV"
        echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
        echo "PKG_CONFIG_PATH=$LIBSECCOMP_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"

    - name: Setup OpenSSL
      uses: ./.github/steps/setup-openssl

    - name: Setup Rust cache
      id: rust-cache
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.save-if }}
