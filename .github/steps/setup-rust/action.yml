name: Install Rust
description: Install a Rust toolchain, Linux build dependencies, components, and targets. Configure the cache.

inputs:
  toolchain:
    description: 'Rust toolchain to install (stable, beta, nightly, or specific version)'
    required: false
    default: 'stable'
  components:
    description: 'Space-separated list of components to install (for example, "clippy rustfmt llvm-tools-preview")'
    required: false
    default: ''
  targets:
    description: 'Space-separated list of targets to install'
    required: false
    default: ''
  cache-key:
    description: 'Shared cache key for Swatinem/rust-cache (jobs with the same key share one cache slot)'
    required: false
    default: ''
  save-if:
    description: 'Save the cache at the end of the job. Use true only for the warm-cache job and nightly-specific jobs.'
    required: false
    default: 'false'
  install-libseccomp-dev:
    description: 'Install libseccomp-dev on Linux (required by session-wrapper)'
    required: false
    default: 'true'
  install-openssl:
    description: 'Install OpenSSL development/runtime dependencies'
    required: false
    default: 'true'
outputs:
  cache-hit:
    description: 'Whether the Rust cache was restored'
    value: ${{ steps.rust-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Build rustup command
      id: rustup-cmd
      shell: bash
      run: |
        CMD="rustup toolchain install $(printf '%q' "${{ inputs.toolchain }}") --profile minimal"

        # If specified, add the components.
        if [ -n "${{ inputs.components }}" ]; then
          IFS=' ' read -ra COMPONENTS <<< "${{ inputs.components }}"
          for component in "${COMPONENTS[@]}"; do
            CMD="$CMD --component $(printf '%q' "$component")"
          done
        fi

        # If specified, add the targets.
        if [ -n "${{ inputs.targets }}" ]; then
          IFS=' ' read -ra TARGETS <<< "${{ inputs.targets }}"
          for target in "${TARGETS[@]}"; do
            CMD="$CMD --target $(printf '%q' "$target")"
          done
        fi

        echo "cmd=$CMD" >> $GITHUB_OUTPUT

    - name: Install Rust toolchain
      shell: bash
      run: |
        ${{ steps.rustup-cmd.outputs.cmd }}
        rustup default ${{ inputs.toolchain }}

    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        PACKAGES=()

        if [ "${{ inputs.install-libseccomp-dev }}" = "true" ] && ! dpkg -s libseccomp-dev &>/dev/null; then
          PACKAGES+=(libseccomp-dev)
        fi

        if [ ${#PACKAGES[@]} -eq 0 ]; then
          echo "Linux build dependencies already installed"
          exit 0
        fi

        sudo apt-get update
        sudo apt-get install -y "${PACKAGES[@]}"

    - name: Install OpenSSL
      if: inputs.install-openssl == 'true'
      uses: ./.github/steps/setup-openssl

    - name: Configure Rust cache
      id: rust-cache
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.save-if }}
