name: Inject Versions
description: Hydrate Cargo.toml and Cargo.lock versions from a JSON map

inputs:
  versions:
    description: >
      JSON object mapping crate names to versions,
      for example {"tacon":"2026.424.0","tacacsrs-protocol":"0.1.3"}.
      An empty object or '{}' causes no changes.
    required: false
    default: '{}'
  require-hydrated:
    description: 'Fail if hydration changes the checked-out commit'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install pinned TOML tooling
      shell: bash
      run: python -m pip install --disable-pip-version-check -r "${{ github.action_path }}/requirements.txt"

    - name: Hydrate Cargo package versions
      shell: bash
      run: |
        python "${{ github.action_path }}/hydrate_versions.py" \
          --workspace "${{ github.workspace }}" \
          --versions '${{ inputs.versions }}'

    - name: Require an already hydrated release candidate
      if: inputs.require-hydrated == 'true'
      shell: bash
      run: git diff --exit-code -- Cargo.lock ':(glob)**/Cargo.toml'
