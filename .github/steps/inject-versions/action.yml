name: Inject Versions
description: Rewrite Cargo.toml version fields from a JSON map of crate names to versions

inputs:
  versions:
    description: >
      JSON object mapping crate names to versions,
      e.g. {"tacon":"2026.424.0","tacacsrs-messages":"0.1.3"}.
      Empty or '{}' is a no-op.
    required: false
    default: '{}'

runs:
  using: composite
  steps:
    - name: Inject versions into Cargo.toml files
      shell: bash
      run: |
        VERSIONS='${{ inputs.versions }}'

        if [ -z "$VERSIONS" ] || [ "$VERSIONS" = "{}" ]; then
          echo "No versions to inject — skipping"
          exit 0
        fi

        echo "$VERSIONS" | jq -r 'to_entries[] | "\(.key)\t\(.value)"' | tr -d '\r' | while IFS=$'\t' read -r CRATE VERSION; do
          # Find the Cargo.toml that declares this crate
          CARGO_TOML=$(find . -name 'Cargo.toml' -not -path '*/target/*' \
            -exec grep -l "^name = \"${CRATE}\"" {} \;)

          if [ -z "$CARGO_TOML" ]; then
            echo "WARNING: No Cargo.toml found for crate '${CRATE}'"
            continue
          fi

          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" "$CARGO_TOML"
          echo "  ${CRATE} → ${VERSION}  (${CARGO_TOML})"
        done
