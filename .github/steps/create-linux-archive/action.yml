name: Create Linux Archive
description: Create a Linux tar archive from the staged package directory

inputs:
  asset-name:
    description: 'Platform-specific release asset name'
    required: true

runs:
  using: composite
  steps:
    - name: Create Linux archive
      shell: bash
      env:
        # Pass the caller input through the environment so it never reaches the
        # shell as code. PACKAGE_DIR already lives in the job environment from
        # compute-package-names.
        ASSET_NAME: ${{ inputs.asset-name }}
      run: bash "${{ github.action_path }}/run.sh"
