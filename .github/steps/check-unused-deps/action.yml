name: Make Sure That Dependencies Are Used
description: Run cargo-machete across workspace manifests

runs:
  using: composite
  steps:
    - name: Install cargo-machete
      uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
      with:
        tool: cargo-machete

    - name: Run cargo-machete
      shell: bash
      run: cargo machete --with-metadata --skip-target-dir . .github/tools/api-classifier
