name: Stage Binary Package
description: Stage the built binary into the package directory without stripping it

inputs:
  target:
    description: 'Rust target triple that was built'
    required: true

runs:
  using: composite
  steps:
    - name: Stage binary package contents
      shell: bash
      env:
        # Pass the caller input through the environment so it never reaches the
        # shell as code. PROFILE, ARTIFACT_FILENAME, and PACKAGE_DIR already live
        # in the job environment from compute-package-names.
        TARGET: ${{ inputs.target }}
      run: bash "${{ github.action_path }}/run.sh"
