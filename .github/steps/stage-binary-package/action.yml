name: Stage Binary Package
description: Stage the built binary into the package directory

inputs:
  target:
    description: 'Rust target triple that was built'
    required: true

runs:
  using: composite
  steps:
    - name: Stage binary package contents
      shell: bash
      run: |
        mkdir -p "$PACKAGE_DIR" packaged
        ARTIFACT_PATH="target/${{ inputs.target }}/${PROFILE}/${ARTIFACT_FILENAME}"

        if [ ! -f "$ARTIFACT_PATH" ]; then
          echo "Error: The expected artifact does not exist at $ARTIFACT_PATH."
          exit 1
        fi

        cp "$ARTIFACT_PATH" "$PACKAGE_DIR/${ARTIFACT_FILENAME}"

        if [[ "${{ runner.os }}" != "Windows" ]]; then
          chmod +x "$PACKAGE_DIR/${ARTIFACT_FILENAME}"
          if [ "$PROFILE" = "release" ]; then
            strip "$PACKAGE_DIR/${ARTIFACT_FILENAME}"
          fi
        fi
