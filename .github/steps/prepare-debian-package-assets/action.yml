name: Prepare Debian Package Assets
description: Prepare binaries, SBOMs, a man page, and Debian changelog assets for cargo-deb

inputs:
  target:
    description: 'Rust target triple that was built'
    required: true
  package-name:
    description: 'Cargo package name used for changelog/version lookup'
    required: true
  package-root:
    description: 'Path to the package root containing the debian assets directory'
    required: true
  man-page-name:
    description: 'Optional man page basename without extension'
    required: true
    default: ''
  versions:
    description: 'JSON map of package versions to inject'
    required: false
    default: '{}'

runs:
  using: composite
  steps:
    - name: Prepare Debian binary and SBOM assets
      shell: bash
      run: |
        mkdir -p target/release "${{ inputs.package-root }}/debian"
        cp "$PACKAGE_DIR/${ARTIFACT_FILENAME}" "target/release/${ARTIFACT_FILENAME}"
        chmod +x "target/release/${ARTIFACT_FILENAME}"
        cp "$PACKAGE_DIR/${SBOM_BASENAME}.json" "${{ inputs.package-root }}/debian/sbom.json"
        cp "$PACKAGE_DIR/${SBOM_BASENAME}.xml" "${{ inputs.package-root }}/debian/sbom.xml"

        # Copy each additional binary that was built with the primary artifact.
        # The package defines these binaries in src/bin/. They are not the
        # primary artifact. cargo-deb expects them in target/release/.
        PKG_BIN_DIR="${{ inputs.package-root }}/src/bin"
        if [[ -d "$PKG_BIN_DIR" ]]; then
          for RS_FILE in "$PKG_BIN_DIR"/*.rs; do
            [[ -f "$RS_FILE" ]] || continue
            BIN_NAME="$(basename "$RS_FILE" .rs)"
            if [[ "$BIN_NAME" == "$ARTIFACT_BASENAME" ]]; then
              continue
            fi
            BIN_SRC="target/${{ inputs.target }}/${PROFILE}/${BIN_NAME}"
            if [[ -f "$BIN_SRC" ]]; then
              cp "$BIN_SRC" "target/release/${BIN_NAME}"
              chmod +x "target/release/${BIN_NAME}"
              echo "Copied additional binary: ${BIN_NAME}"
            fi
          done
        fi

    - name: Copy generated man page and compress Debian assets
      shell: bash
      run: |
        PKG="${{ inputs.package-name }}"
        PKG_DIR="${{ inputs.package-root }}"
        MAN_PAGE_NAME="${{ inputs.man-page-name }}"

        if [ -n "$MAN_PAGE_NAME" ]; then
          MAN_PAGE=""
          for build_dir in \
            "target/${{ inputs.target }}/${PROFILE}/build" \
            "target/${PROFILE}/build" \
            target/release/build \
            target/debug/build
          do
            if [ -d "$build_dir" ]; then
              MAN_PAGE=$(find "$build_dir" -path "*/out/man/${MAN_PAGE_NAME}.1" -type f -print -quit)
              if [ -n "$MAN_PAGE" ]; then
                break
              fi
            fi
          done
          if [ -z "$MAN_PAGE" ]; then
            echo "Error: No generated man page exists for $MAN_PAGE_NAME."
            exit 1
          fi
          echo "Man page: $MAN_PAGE"
          cp "$MAN_PAGE" "${PKG_DIR}/debian/${MAN_PAGE_NAME}.1"
        fi

        VERSIONS='${{ inputs.versions }}'
        VERSION=$(echo "$VERSIONS" | jq -r --arg pkg "$PKG" '.[$pkg] // "0.0.0-dev"' | tr -d '\r')
        TAG_PREFIX="${PKG}-"
        MAINTAINER="AuthScaffold <github-discussions@authscaffold.com>"
        CHANGELOG="${PKG_DIR}/debian/changelog"

        mapfile -t TAGS < <(git tag --list "${TAG_PREFIX}*" --sort=v:refname)

        > "$CHANGELOG"

        if [ ${#TAGS[@]} -gt 0 ]; then
          LAST_TAG="${TAGS[-1]}"
          COMMITS=$(git log --pretty=format:"  * %s" "${LAST_TAG}..HEAD" -- "${PKG_DIR}")
        else
          COMMITS=$(git log --pretty=format:"  * %s" -- "${PKG_DIR}")
        fi
        if [ -z "$COMMITS" ]; then
          COMMITS="  * Release ${VERSION}"
        fi
        {
          echo "${PKG} (${VERSION}) stable; urgency=medium"
          echo ""
          echo "$COMMITS"
          echo ""
          echo " -- ${MAINTAINER}  $(date -u -R)"
        } >> "$CHANGELOG"

        for (( i=${#TAGS[@]}-1; i>=0; i-- )); do
          TAG="${TAGS[$i]}"
          TAG_VERSION="${TAG#${TAG_PREFIX}}"
          TAG_DATE=$(git log -1 --format="%aD" "$TAG")

          if [ $i -gt 0 ]; then
            PREV="${TAGS[$((i-1))]}"
            COMMITS=$(git log --pretty=format:"  * %s" "${PREV}..${TAG}" -- "${PKG_DIR}")
          else
            COMMITS=$(git log --pretty=format:"  * %s" "${TAG}" -- "${PKG_DIR}")
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="  * Release ${TAG_VERSION}"
          fi

          {
            echo ""
            echo "${PKG} (${TAG_VERSION}) stable; urgency=medium"
            echo ""
            echo "$COMMITS"
            echo ""
            echo " -- ${MAINTAINER}  ${TAG_DATE}"
          } >> "$CHANGELOG"
        done

        echo "Changelog ($(grep -c '^${PKG} ' "$CHANGELOG" || true) stanzas):"
        cat "$CHANGELOG"

        cd "${PKG_DIR}/debian"
        gzip -9 -n -c changelog > changelog.gz
        if [ -n "$MAN_PAGE_NAME" ]; then
          gzip -9 -n -c "${MAN_PAGE_NAME}.1" > "${MAN_PAGE_NAME}.1.gz"
        fi
