name: Collect Debian Packages
description: Copy Debian package outputs into the packaged artifact directory

inputs:
  package-name:
    description: 'Debian package name/prefix to collect'
    required: true

runs:
  using: composite
  steps:
    - name: Collect Debian packages
      shell: bash
      run: |
        cp target/debian/${{ inputs.package-name }}_*.deb packaged/
        cp target/debian/${{ inputs.package-name }}-dbgsym_*.ddeb packaged/ 2>/dev/null || true
