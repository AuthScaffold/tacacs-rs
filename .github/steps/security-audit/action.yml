name: Security Audit
description: Run cargo-audit. If dependency manifests are unchanged, the action can skip the audit.

inputs:
  skip-if-no-dep-changes:
    description: 'Skip audit when dependency manifests did not change'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
      id: audit-changes
      if: inputs.skip-if-no-dep-changes == 'true'
      with:
        filters: |
          deps:
            - '**/Cargo.toml'
            - '**/Cargo.lock'

    - name: Determine whether to run the audit
      id: should-run-audit
      shell: bash
      run: |
        if [ "${{ inputs.skip-if-no-dep-changes }}" = "true" ]; then
          echo "run=${{ steps.audit-changes.outputs.deps }}" >> "$GITHUB_OUTPUT"
        else
          echo "run=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Install cargo-audit
      if: steps.should-run-audit.outputs.run == 'true'
      uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
      with:
        tool: cargo-audit

    - name: Run security audit
      if: steps.should-run-audit.outputs.run == 'true'
      shell: bash
      run: cargo audit --file Cargo.lock

    - name: Skip audit notice
      if: steps.should-run-audit.outputs.run != 'true'
      shell: bash
      run: echo "No dependency changes. Skip the audit."
