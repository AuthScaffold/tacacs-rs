name: Protobuf Compatibility
description: Make sure that protobuf changes are backward-compatible with a Git ref

inputs:
  against-ref:
    description: 'Git ref for backward-compatibility validation'
    required: false
    default: 'main'
  github-token:
    description: 'GitHub token for the buf installation'
    required: true

runs:
  using: composite
  steps:
    - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
      with:
        github_token: ${{ inputs.github-token }}

    - name: Make sure that the comparison ref exists locally
      shell: bash
      run: |
        if git rev-parse --verify "${{ inputs.against-ref }}" >/dev/null 2>&1; then
          echo "Ref '${{ inputs.against-ref }}' already exists locally"
        elif git rev-parse --verify "origin/${{ inputs.against-ref }}" >/dev/null 2>&1; then
          git branch "${{ inputs.against-ref }}" "origin/${{ inputs.against-ref }}"
          echo "Created local branch '${{ inputs.against-ref }}' from 'origin/${{ inputs.against-ref }}'"
        else
          echo "::error::Ref '${{ inputs.against-ref }}' not found locally or on origin"
          exit 1
        fi

    - name: Make sure that protobuf changes are backward-compatible
      shell: bash
      run: |
        buf breaking --against '.git#branch=${{ inputs.against-ref }}' || \
          echo "::warning::Protobuf validation found errors. This validation is advisory, so the workflow continues."