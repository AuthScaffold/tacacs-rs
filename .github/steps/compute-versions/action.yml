name: Compute Versions
description: >
  Compute all crate versions from Git tags. Libraries use SemVer. The
  api-classifier tool detects breaking and additive public-API changes.
  Dependency changes propagate to dependent libraries. Executables use CalVer.

inputs:
  binary-name:
    description: 'Name of the CalVer-managed executable'
    required: false
    default: 'tacon'
  shared-executables:
    description: 'Comma-separated executable crate names that use the CalVer version without separate tags'
    required: false
    default: ''
  skip-semver-checks:
    description: 'Skip the api-classifier public-API analysis. This option is faster but always increments the patch version.'
    required: false
    default: 'false'
  pre-release:
    description: 'Pre-release label, for example "dev". If set, the label produces versions such as 0.1.2-dev.5 and no tags.'
    required: false
    default: ''

outputs:
  versions:
    description: 'JSON map of crate-name → version'
    value: ${{ steps.compute.outputs.versions }}
  new_tags:
    description: 'JSON array of new Git tags to create'
    value: ${{ steps.compute.outputs.new_tags }}
  has_release:
    description: 'True if the action must create new tags'
    value: ${{ steps.compute.outputs.has_release }}
  calver_tag:
    description: 'CalVer tag for the executable. Empty if unchanged.'
    value: ${{ steps.compute.outputs.calver_tag }}
  previous_calver_tag:
    description: 'Previous CalVer baseline tag. Empty for the first release.'
    value: ${{ steps.compute.outputs.previous_calver_tag }}

runs:
  using: composite
  steps:
    - name: Install api-classifier
      if: inputs.skip-semver-checks != 'true' && inputs.pre-release == ''
      shell: bash
      run: |
        set -euo pipefail
        # The additive (public-api) check renders rustdoc JSON with a pinned
        # nightly whose format the pinned public-api understands.
        rustup toolchain install nightly-2025-08-02 --profile minimal
        # Build and install the standalone, CI-only classifier. It is its own
        # workspace, so it never enters the product build or release set.
        cargo install \
          --path "${{ github.action_path }}/../../tools/api-classifier" \
          --locked \
          --root "${{ runner.temp }}/api-classifier"

    - name: Compute versions
      id: compute
      shell: bash
      env:
        INPUT_BINARY_NAME: ${{ inputs.binary-name }}
        INPUT_SHARED_EXECUTABLES: ${{ inputs.shared-executables }}
        INPUT_SKIP_SEMVER_CHECKS: ${{ inputs.skip-semver-checks }}
        INPUT_PRE_RELEASE: ${{ inputs.pre-release }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
        # Used only on the non-skip, non-pre-release path, where the step above
        # installed the tool. Other modes never invoke it.
        API_CLASSIFIER_BIN: ${{ runner.temp }}/api-classifier/bin/api-classifier
      run: python ${{ github.action_path }}/compute_versions.py
