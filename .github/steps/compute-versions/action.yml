name: Compute Versions
description: >
  Compute all crate versions from git tags.
  Libraries get semver (with cargo-semver-checks for break detection and
  dependency-aware cascading). Executables get CalVer.

inputs:
  binary-name:
    description: 'Name of the CalVer-managed executable'
    required: false
    default: 'tacon'
  shared-executables:
    description: 'Comma-separated executable crate names that should share the CalVer version without creating their own tags'
    required: false
    default: ''
  skip-semver-checks:
    description: 'Skip cargo-semver-checks (faster, but always patch-bumps)'
    required: false
    default: 'false'
  pre-release:
    description: 'Pre-release label (e.g. "dev"). When set, produces versions like 0.1.2-dev.5 with no tags.'
    required: false
    default: ''

outputs:
  versions:
    description: 'JSON map of crate-name → version'
    value: ${{ steps.compute.outputs.versions }}
  new_tags:
    description: 'JSON array of new git tags to create'
    value: ${{ steps.compute.outputs.new_tags }}
  has_release:
    description: 'Whether any new tags need to be created'
    value: ${{ steps.compute.outputs.has_release }}
  calver_tag:
    description: 'CalVer tag for the executable (empty if unchanged)'
    value: ${{ steps.compute.outputs.calver_tag }}
  previous_calver_tag:
    description: 'Previous CalVer tag used as baseline (empty if first release)'
    value: ${{ steps.compute.outputs.previous_calver_tag }}

runs:
  using: composite
  steps:
    - name: Install cargo-semver-checks
      if: inputs.skip-semver-checks != 'true' && inputs.pre-release == ''
      shell: bash
      run: cargo install cargo-semver-checks --locked

    - name: Compute versions
      id: compute
      shell: bash
      env:
        INPUT_BINARY_NAME: ${{ inputs.binary-name }}
        INPUT_SHARED_EXECUTABLES: ${{ inputs.shared-executables }}
        INPUT_SKIP_SEMVER_CHECKS: ${{ inputs.skip-semver-checks }}
        INPUT_PRE_RELEASE: ${{ inputs.pre-release }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
      run: python ${{ github.action_path }}/compute_versions.py
