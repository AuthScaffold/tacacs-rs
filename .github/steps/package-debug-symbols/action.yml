name: Package Debug Symbols
description: If target debug symbols are available, copy them into the package directory

inputs:
  target:
    description: 'Rust target triple that was built'
    required: true

runs:
  using: composite
  steps:
    - name: Package debug symbols (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        # Pass the caller input through the environment so it never reaches the
        # shell as code. PROFILE, ARTIFACT_FILENAME, and PACKAGE_DIR already live
        # in the job environment from compute-package-names.
        TARGET: ${{ inputs.target }}
      run: bash "${{ github.action_path }}/run.sh"

    - name: Package debug symbols (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $pdbFileTarget = "target/${{ inputs.target }}/${env:PROFILE}/${env:ARTIFACT_BASENAME}.pdb"
        $pdbDestination = Join-Path $env:PACKAGE_DIR "${env:ARTIFACT_BASENAME}.pdb"

        if (Test-Path $pdbFileTarget) {
          Copy-Item $pdbFileTarget $pdbDestination
        }
