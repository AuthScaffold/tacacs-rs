name: Build Binary
description: Build a binary for a specific target using package environment prepared by compute-package-names

inputs:
  target:
    description: 'Rust target triple (e.g., x86_64-unknown-linux-gnu)'
    required: true
  binary-name:
    description: 'Name of the binary to build'
    required: true

runs:
  using: composite
  steps:
    - name: Build binary
      shell: bash
      run: |
        cargo build \
          ${BUILD_PROFILE_FLAG} \
          --target "${{ inputs.target }}" \
          --bin "${{ inputs.binary-name }}" \
          ${FEATURE_ARGS}
