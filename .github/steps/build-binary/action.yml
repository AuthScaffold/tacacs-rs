name: Build Binary
description: Build a release binary for a specific target with artifact upload using Rust nightly artifact-dir feature

inputs:
  target:
    description: 'Rust target triple (e.g., x86_64-unknown-linux-gnu)'
    required: true
  binary-name:
    description: 'Name of the binary to build'
    required: true
  asset-name:
    description: 'Name for the uploaded asset'
    required: true
  features:
    description: 'Space-separated cargo features to enable for the build'
    required: false
    default: ''
  strip-binary:
    description: 'Strip the binary on Linux'
    required: false
    default: 'true'
  artifact-retention-days:
    description: 'Number of days to retain the artifact'
    required: false
    default: '7'

runs:
  using: composite
  steps:
    - name: Install nightly toolchain for artifact-dir feature
      shell: bash
      run: |
        # Install nightly (rustup will skip if already installed with this target)
        rustup toolchain install nightly --profile minimal --target ${{ inputs.target }}

    - name: Build release binary with artifact-dir
      shell: bash
      run: |
        # Use nightly's --artifact-dir to output binaries to a predictable location
        # Note: This uses an unstable feature. If builds break, consider pinning to a specific nightly version
        FEATURE_ARGS=()
        if [[ -n "${{ inputs.features }}" ]]; then
          FEATURE_ARGS+=(--features "${{ inputs.features }}")
        fi

        cargo +nightly build --release --target ${{ inputs.target }} --bin ${{ inputs.binary-name }} \
          "${FEATURE_ARGS[@]}" \
          -Z unstable-options --artifact-dir=build-output

    - name: Discover and prepare artifacts
      shell: bash
      run: |
        mkdir -p artifacts
        mkdir -p package
        
        # Determine the expected binary extension
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          BINARY_EXT=".exe"
        else
          BINARY_EXT=""
        fi
        
        # The artifact-dir output should contain the binary
        BINARY_NAME="${{ inputs.binary-name }}${BINARY_EXT}"
        BINARY_PATH="build-output/${BINARY_NAME}"
        
        if [ ! -f "$BINARY_PATH" ]; then
          echo "Error: Expected binary not found at $BINARY_PATH"
          echo "Contents of build-output:"
          ls -la build-output/
          exit 1
        fi
        
        echo "Found binary: $BINARY_PATH"
        
        if [[ "${{ runner.os }}" == "Windows" && "${{ inputs.asset-name }}" == *.zip ]]; then
          cp "$BINARY_PATH" "package/${BINARY_NAME}"
        else
          # Copy and rename to asset name
          cp "$BINARY_PATH" "artifacts/${{ inputs.asset-name }}"
          # Set execute permission (no-op on Windows, but that's fine)
          chmod +x "artifacts/${{ inputs.asset-name }}" || true
        fi

    - name: Strip binary (Linux only)
      if: runner.os == 'Linux' && inputs.strip-binary == 'true'
      shell: bash
      run: strip artifacts/${{ inputs.asset-name }}

    - name: Package debug symbols (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        # Debug symbols may be in build-output or target directory
        # Try build-output first (if --artifact-dir copied them)
        if ls build-output/*.dwp 1> /dev/null 2>&1; then
          cp build-output/*.dwp artifacts/${{ inputs.asset-name }}.dwp
        elif ls target/${{ inputs.target }}/release/*.dwp 1> /dev/null 2>&1; then
          cp target/${{ inputs.target }}/release/*.dwp artifacts/${{ inputs.asset-name }}.dwp
        fi

    - name: Package debug symbols (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Debug symbols may be in build-output or target directory
        # Try build-output first (if --artifact-dir copied them)
        $pdbFileBuildOutput = "build-output/${{ inputs.binary-name }}.pdb"
        $pdbFileTarget = "target/${{ inputs.target }}/release/${{ inputs.binary-name }}.pdb"
        $bundleAsset = "${{ inputs.asset-name }}"
        $pdbDestination = if ($bundleAsset.EndsWith(".zip")) {
          "package/${{ inputs.binary-name }}.pdb"
        } else {
          "artifacts/${{ inputs.asset-name }}.pdb"
        }
        
        if (Test-Path $pdbFileBuildOutput) {
          Copy-Item $pdbFileBuildOutput $pdbDestination
        } elseif (Test-Path $pdbFileTarget) {
          Copy-Item $pdbFileTarget $pdbDestination
        }

    - name: Bundle Windows release package
      if: runner.os == 'Windows' && endsWith(inputs.asset-name, '.zip')
      shell: pwsh
      run: |
        $packageDir = "package"
        $opensslBinDir = Join-Path $env:OPENSSL_DIR "bin"

        if (-not (Test-Path $opensslBinDir)) {
          throw "OpenSSL bin directory not found: $opensslBinDir"
        }

        $dlls = @(
          Get-ChildItem -Path $opensslBinDir -Filter "libcrypto-*.dll" -File -ErrorAction SilentlyContinue
          Get-ChildItem -Path $opensslBinDir -Filter "libssl-*.dll" -File -ErrorAction SilentlyContinue
        ) | Sort-Object -Property FullName -Unique

        if ($dlls.Count -eq 0) {
          throw "No OpenSSL runtime DLLs found in $opensslBinDir"
        }

        foreach ($dll in $dlls) {
          Copy-Item $dll.FullName (Join-Path $packageDir $dll.Name)
        }

        $destination = "artifacts/${{ inputs.asset-name }}"
        if (Test-Path $destination) {
          Remove-Item $destination
        }

        Compress-Archive -Path "$packageDir/*" -DestinationPath $destination

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.asset-name }}
        path: artifacts/*
        retention-days: ${{ inputs.artifact-retention-days }}
