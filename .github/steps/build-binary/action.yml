name: Build Binary
description: Build a binary for a specific target using package environment prepared by compute-package-names

inputs:
  target:
    description: 'Rust target triple (e.g., x86_64-unknown-linux-gnu)'
    required: true
  package-name:
    description: 'Cargo package name to build'
    required: true
  artifact-name:
    description: 'Binary or library target name to build'
    required: true
  artifact-kind:
    description: 'Artifact kind to build (bin or cdylib)'
    required: true

runs:
  using: composite
  steps:
    - name: Build binary
      shell: bash
      run: |
        if [[ "${{ inputs.artifact-kind }}" == "bin" ]]; then
          cargo build \
            ${BUILD_PROFILE_FLAG} \
            --target "${{ inputs.target }}" \
            --package "${{ inputs.package-name }}" \
            --bin "${{ inputs.artifact-name }}" \
            ${FEATURE_ARGS}
        elif [[ "${{ inputs.artifact-kind }}" == "cdylib" ]]; then
          cargo build \
            ${BUILD_PROFILE_FLAG} \
            --target "${{ inputs.target }}" \
            --package "${{ inputs.package-name }}" \
            --lib \
            ${FEATURE_ARGS}
        else
          echo "Error: unsupported artifact kind: ${{ inputs.artifact-kind }}"
          exit 1
        fi
