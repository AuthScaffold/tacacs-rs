name: Report Dependency Updates
description: Report available dependency updates without requiring unrelated upgrades

runs:
  using: composite
  steps:
    - name: Install cargo-outdated
      uses: taiki-e/install-action@7be9fd86bd1707236395105d6e9329dd1511a7e1 # v2.79.0
      with:
        tool: cargo-outdated

    - name: Run cargo-outdated
      shell: bash
      run: cargo outdated --workspace -i foreign-types,foreign-types-shared
