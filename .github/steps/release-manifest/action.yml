name: Generate Release Manifest
description: >
  Record the source commit, computed versions, YANG and protobuf schema
  identities, and SHA-256 digests of the staged release artifacts in one offline
  manifest. Run this step after staging the release assets and before generating
  the checksums file, so the checksums file can cover the manifest while the
  manifest never hashes itself or the checksums file.

inputs:
  artifacts:
    description: 'Directory that holds the staged release artifacts to hash'
    required: false
    default: 'release'
  versions:
    description: 'JSON map of crate names to computed versions'
    required: false
    default: '{}'
  source-commit:
    description: 'Source commit SHA recorded in the manifest'
    required: true
  provenance-directory:
    description: 'Directory with build-runner provenance records for each archive'
    required: true
  output:
    description: 'Path to write the release manifest JSON'
    required: false
    default: 'release/release-manifest.json'

runs:
  using: composite
  steps:
    - name: Generate the release manifest
      shell: bash
      env:
        INPUT_ARTIFACTS: ${{ inputs.artifacts }}
        INPUT_VERSIONS: ${{ inputs.versions }}
        INPUT_SOURCE_COMMIT: ${{ inputs.source-commit }}
        INPUT_PROVENANCE_DIRECTORY: ${{ inputs.provenance-directory }}
        INPUT_OUTPUT: ${{ inputs.output }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        # Materialize the versions JSON through an environment variable. The
        # value never enters the command line, so JSON quoting cannot break the
        # shell. The script reads the file with the standard json module.
        versions_file="${RUNNER_TEMP}/release-manifest-versions.json"
        printf '%s' "$INPUT_VERSIONS" > "$versions_file"

        python "$ACTION_PATH/release_manifest.py" \
          --artifacts "$INPUT_ARTIFACTS" \
          --versions "$versions_file" \
          --source "$INPUT_SOURCE_COMMIT" \
          --workspace "$GITHUB_WORKSPACE" \
          --provenance-dir "$INPUT_PROVENANCE_DIRECTORY" \
          --output "$INPUT_OUTPUT"
