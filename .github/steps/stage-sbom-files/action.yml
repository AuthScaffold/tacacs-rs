name: Stage SBOM Files
description: Stage generated SBOMs into the package directory and sanitize workspace-specific paths

inputs:
  package-root:
    description: 'Path to the package root that contains generated SBOM files'
    required: true

runs:
  using: composite
  steps:
    - name: Stage SBOM files
      shell: bash
      run: |
        JSON_SOURCE=$(find "${{ inputs.package-root }}" -maxdepth 1 -name '*.cdx.json' -type f | head -1)
        XML_SOURCE=$(find "${{ inputs.package-root }}" -maxdepth 1 -name '*.cdx.xml' -type f | head -1)
        JSON_DEST="$PACKAGE_DIR/${SBOM_BASENAME}.json"
        XML_DEST="$PACKAGE_DIR/${SBOM_BASENAME}.xml"

        if [ -z "$JSON_SOURCE" ] || [ -z "$XML_SOURCE" ]; then
          echo "Error: generated SBOM files were not found under ${{ inputs.package-root }}"
          exit 1
        fi

        cp "$JSON_SOURCE" "$JSON_DEST"
        cp "$XML_SOURCE" "$XML_DEST"

        WORKSPACE_PATH="${GITHUB_WORKSPACE}"
        REPO_URL="https://github.com/${GITHUB_REPOSITORY}"

        jq --arg ws "${WORKSPACE_PATH}/" \
           --arg repo "$REPO_URL" \
           '
          walk(
            if type == "string" then
              gsub($ws; "/workspace/") |
              gsub("download_url=file://[^\"&]*"; "download_url=\($repo)")
            else .
            end
          )
          ' "$JSON_DEST" > "${JSON_DEST}.tmp" && mv "${JSON_DEST}.tmp" "$JSON_DEST"

        sed -i "s|${WORKSPACE_PATH}/|/workspace/|g" "$XML_DEST"
        sed -i -E "s|download_url=file://[^\"&]*|download_url=${REPO_URL}|g" "$XML_DEST"
