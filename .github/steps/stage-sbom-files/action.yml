name: Stage SBOM Files
description: Stage generated SBOMs in the package directory. Replace workspace-specific paths.

inputs:
  package-root:
    description: 'Path to the package root that contains generated SBOM files'
    required: true

runs:
  using: composite
  steps:
    - name: Stage SBOM files
      shell: bash
      env:
        INPUT_PACKAGE_ROOT: ${{ inputs.package-root }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        python "$ACTION_PATH/stage_sbom.py" \
          --package-root "$INPUT_PACKAGE_ROOT" \
          --package-dir "$PACKAGE_DIR" \
          --basename "$SBOM_BASENAME" \
          --package-name "$PACKAGE_NAME" \
          --workspace "$GITHUB_WORKSPACE" \
          --repository "https://github.com/$GITHUB_REPOSITORY"
