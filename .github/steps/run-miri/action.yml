name: Run Miri
description: Run Miri tests as advisory extended validation

runs:
  using: composite
  steps:
    - name: Run Miri
      shell: bash
      env:
        MIRIFLAGS: -Zmiri-disable-isolation
      run: |
        cargo +nightly miri test --workspace --all-features || \
          echo "::warning::Miri found errors. This validation is advisory, so the workflow continues."
