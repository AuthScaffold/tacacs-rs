name: Run Miri
description: Run Miri validation across Miri-compatible workspace crates

runs:
  using: composite
  steps:
    - name: Run Miri
      shell: bash
      env:
        MIRIFLAGS: -Zmiri-disable-isolation
      run: |
        set -euo pipefail
        cargo +nightly miri test --locked --all-features \
          -p tacacsrs-secrets \
          -p tacacsrs-protocol \
          -p tacacsrs-credential-resolution \
          -p tacacsrs-lifecycle \
          -p tacacsrs-composition
        cargo +nightly miri test --locked --all-features \
          -p tacacsrs-bash-plugin --lib
