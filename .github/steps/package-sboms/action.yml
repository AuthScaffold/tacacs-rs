name: Package SBOMs
description: Generate JSON/XML SBOMs and stage sanitized SBOM files into the package directory

inputs:
  target:
    description: 'Rust target triple used for SBOM generation'
    required: true
  package-root:
    description: 'Path to the package root containing Cargo.toml'
    required: true
  sbom-describe:
    description: 'CycloneDX describe mode'
    required: false
    default: 'binaries'
  features:
    description: 'Space-separated cargo features to enable'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Clear prior SBOMs for package
      shell: bash
      run: |
        find "${{ inputs.package-root }}" -maxdepth 1 -name '*.cdx.json' -delete
        find "${{ inputs.package-root }}" -maxdepth 1 -name '*.cdx.xml' -delete

    - name: Generate SBOM (JSON)
      uses: ./.github/steps/generate-sbom
      with:
        output-format: json
        manifest-path: ${{ inputs.package-root }}/Cargo.toml
        describe: ${{ inputs.sbom-describe }}
        target: ${{ inputs.target }}
        target-in-filename: 'true'
        features: ${{ inputs.features }}

    - name: Generate SBOM (XML)
      uses: ./.github/steps/generate-sbom
      with:
        output-format: xml
        manifest-path: ${{ inputs.package-root }}/Cargo.toml
        describe: ${{ inputs.sbom-describe }}
        target: ${{ inputs.target }}
        target-in-filename: 'true'
        features: ${{ inputs.features }}

    - name: Stage SBOM files
      uses: ./.github/steps/stage-sbom-files
      with:
        package-root: ${{ inputs.package-root }}
