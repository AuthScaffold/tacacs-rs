name: Make Sure That the Debian Package Is Valid
description: Run lintian. Then show the Debian package metadata.

inputs:
  package-name:
    description: 'Debian package name or prefix for validation'
    required: true

runs:
  using: composite
  steps:
    - name: Run lintian
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y lintian
        lintian target/debian/${{ inputs.package-name }}_*.deb || true

    - name: Show Debian package information
      shell: bash
      run: |
        dpkg --info target/debian/${{ inputs.package-name }}_*.deb
        if ls target/debian/${{ inputs.package-name }}-dbgsym_*.ddeb 1>/dev/null 2>&1; then
          dpkg --info target/debian/${{ inputs.package-name }}-dbgsym_*.ddeb
        fi
