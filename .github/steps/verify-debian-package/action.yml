name: Verify Debian Package
description: Run lintian and display Debian package metadata

inputs:
  package-name:
    description: 'Debian package name/prefix to verify'
    required: true

runs:
  using: composite
  steps:
    - name: Verify Debian package with lintian
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y lintian
        lintian target/debian/${{ inputs.package-name }}_*.deb || true

    - name: Display Debian package info
      shell: bash
      run: |
        dpkg --info target/debian/${{ inputs.package-name }}_*.deb
        if ls target/debian/${{ inputs.package-name }}-dbgsym_*.ddeb 1>/dev/null 2>&1; then
          dpkg --info target/debian/${{ inputs.package-name }}-dbgsym_*.ddeb
        fi
