name: Run Tests
description: Run workspace tests for a target platform

inputs:
  package-args:
    description: 'Cargo workspace or package selection arguments'
    required: false
    default: '--workspace'
  target:
    description: 'Rust target triple for the tests'
    required: true
  feature-args:
    description: 'Cargo feature arguments to append'
    required: false
    default: ''
  build-release:
    description: 'Run tests in release mode'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Check pure protocol dependencies
      shell: bash
      run: |
        cargo tree --package tacacsrs-protocol --edges normal --prefix none |
          awk '/^(tokio|openssl|tonic|prost|redis|tacacsrs-config|tacacsrs-networking|tacacsrs-agent)[ -]/ {
            print "Forbidden protocol dependency: " $0
            failed = 1
          }
          END { exit failed }'

    - name: Check provider-neutral credential dependencies
      shell: bash
      run: |
        cargo tree --package tacacsrs-credential-resolution --edges normal --prefix none |
          awk '/^(tokio|openssl|tonic|prost|redis|tacacsrs-config|tacacsrs-networking|tacacsrs-agent|tacacsrs-sonic)[ -]/ {
            print "Forbidden credential dependency: " $0
            failed = 1
          }
          END { exit failed }'

    - name: Check schema-free networking dependencies
      shell: bash
      run: |
        cargo tree --package tacacsrs-networking --edges normal --prefix none |
          awk '/^(tonic|prost|redis|tacacsrs-config|tacacsrs-credential-resolution|tacacsrs-agent|tacacsrs-sonic)[ -]/ {
            print "Forbidden networking dependency: " $0
            failed = 1
          }
          END { exit failed }'

    - name: Check configuration adapter dependencies
      shell: bash
      run: |
        cargo tree --package tacacsrs-config --edges normal --prefix none |
          awk '/^(clap|tonic|prost|redis|tacacsrs-agent|tacacsrs-sonic)[ -]/ {
            print "Forbidden configuration dependency: " $0
            failed = 1
          }
          END { exit failed }'

    - name: Check IPC-independent agent dependencies
      shell: bash
      run: |
        cargo tree --package tacacsrs-agent --edges normal --prefix none |
          awk '/^(tonic|prost|tacacsrs-ipc)[ -]/ {
            print "Forbidden agent dependency: " $0
            failed = 1
          }
          END { exit failed }'

    - name: Check runtime-independent IPC dependencies
      shell: bash
      run: |
        cargo tree --package tacacsrs-ipc --edges normal --prefix none |
          awk '/^(redis|tacacsrs-config|tacacsrs-networking|tacacsrs-credential-resolution|tacacsrs-agent|tacacsrs-sonic)[ -]/ {
            print "Forbidden IPC dependency: " $0
            failed = 1
          }
          END { exit failed }'

    - name: Check Unix socket ownership dependencies
      shell: bash
      run: |
        cargo tree --package tacacsrs-unix-socket --edges normal --prefix none |
          awk '/^(tonic|prost|redis|openssl|tacacsrs-protocol|tacacsrs-config|tacacsrs-networking|tacacsrs-agent|tacacsrs-ipc)[ -]/ {
            print "Forbidden Unix socket dependency: " $0
            failed = 1
          }
          END { exit failed }'

    - name: Check supported core dependencies
      shell: bash
      run: |
        cargo tree --edges normal --prefix none |
          awk '/^(session-wrapper|tacacsrs-agent-ipc-emulator|tacacsrs-agent-ipc-emulatord|regorus|libseccomp)[ -]/ {
            print "Experimental dependency in supported core: " $0
            failed = 1
          }
          END { exit failed }'

    - name: Run unit tests
      shell: bash
      run: |
        RELEASE_FLAG=""
        if [ "${{ inputs.build-release }}" = "true" ]; then
          RELEASE_FLAG="--release"
        fi

        cargo test \
          ${{ inputs.package-args }} \
          --target "${{ inputs.target }}" \
          ${{ inputs.feature-args }} \
          ${RELEASE_FLAG}
