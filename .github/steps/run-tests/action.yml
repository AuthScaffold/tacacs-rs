name: Run Tests
description: >
  Enforce the production dependency architecture and run workspace tests for a
  target platform. The architecture check replaces the inline cargo-tree guards
  that used to live in this action.

inputs:
  package-args:
    description: 'Cargo workspace or package selection arguments'
    required: false
    default: '--workspace'
  target:
    description: 'Rust target triple for the tests'
    required: true
  feature-args:
    description: 'Cargo feature arguments to append'
    required: false
    default: ''
  build-release:
    description: 'Run tests in release mode'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Enforce the production dependency architecture
      uses: ./.github/steps/check-architecture
      with:
        target: ${{ inputs.target }}
        all-features: 'true'

    - name: Run unit tests
      shell: bash
      run: |
        RELEASE_FLAG=""
        if [ "${{ inputs.build-release }}" = "true" ]; then
          RELEASE_FLAG="--release"
        fi

        cargo test --locked \
          ${{ inputs.package-args }} \
          --target "${{ inputs.target }}" \
          ${{ inputs.feature-args }} \
          ${RELEASE_FLAG}
