[workspace]
resolver = "2"
members = [
    "libraries/tacacsrs_messages",
    "libraries/tacacsrs_networking",
    "libraries/tacacsrs_flow_abstractions",
    "libraries/tacacsrs_flows",
    "libraries/tacacsrs_agent_client",
    "libraries/tacacsrs_agent_ipc_emulator",
    "libraries/tacacsrs_agent",
    "libraries/tacacsrs_config",
    "libraries/tacacsrs_datastore",
    "libraries/tacacsrs_sonic",
    "executables/tacon",
    "executables/session_wrapper",
    "executables/tacacsrs_agentd",
    "executables/tacacsrs_agent_ipc_emulatord"
]
exclude = ["fuzz"]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/AuthScaffold/tacacs-rs"

[workspace.lints.rust]
# The `rpk` feature in `tacacsrs-networking` uses one tightly scoped OpenSSL
# FFI module for APIs not yet exposed by the `openssl` crate. Keep unsafe code
# denied by default so every exception requires an explicit local allowance.
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[workspace.lints.clippy]
# Lint groups (low priority so individual overrides win).
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# --- Workspace-wide allows for genuinely opinionated lints ---

# Style preferences — not worth fighting over.
module_name_repetitions = "allow"
option_if_let_else = "allow"
redundant_pub_crate = "allow"
significant_drop_tightening = "allow"

# Const-fn promotion is still unstable for many patterns; revisit when stable.
missing_const_for_fn = "allow"

# Transitive dependency version conflicts are outside our control.
multiple_crate_versions = "allow"
# Internal workspace crates don't need full crates.io metadata.
cargo_common_metadata = "allow"

# Release profile with debug symbols for crash analysis
[profile.release]
debug = "full"              # Full symbols (variable names, types, etc.) for detailed debugging
