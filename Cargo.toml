[workspace]
resolver = "2"
members = [
    "libraries/tacacsrs_messages",
    "libraries/tacacsrs_networking", 
    "executables/tacon"
]

# Release profile with debug symbols for crash analysis
[profile.release]
debug = "full"              # Full symbols (variable names, types, etc.) for detailed debugging
split-debuginfo = "packed"  # Separate symbol files (.pdb on Windows, .dwp on Linux)
