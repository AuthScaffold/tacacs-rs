[workspace]
resolver = "2"
members = [
    "libraries/tacacsrs_messages",
    "libraries/tacacsrs_secrets",
    "libraries/tacacsrs_networking",
    "libraries/tacacsrs_flows",
    "libraries/tacacsrs_agent_client",
    "libraries/tacacsrs_agent_ipc_emulator",
    "libraries/tacacsrs_agent",
    "libraries/tacacsrs_config",
    "libraries/tacacsrs_credential_resolution",
    "libraries/tacacsrs_datastore",
    "libraries/tacacsrs_cli_datastore",
    "libraries/tacacsrs_sonic",
    "libraries/tacacsrs_bash_plugin",
    "executables/tacon",
    "executables/session_wrapper",
    "executables/tacacsrs_agentd",
    "executables/tacacsrs_agent_health",
    "executables/tacacsrs_agent_ipc_emulatord"
]
exclude = ["fuzz"]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/AuthScaffold/tacacs-rs"

[workspace.lints.rust]
# The `rpk` feature in `tacacsrs-networking` uses one small OpenSSL FFI module.
# The `openssl` crate does not expose these APIs.
# Unsafe code remains denied by default. Each exception needs an explicit local allowance.
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[workspace.lints.clippy]
# These lint groups have low priority. Individual overrides take precedence.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# --- Workspace-wide allowances for opinionated lints ---

# Allow these style preferences.
module_name_repetitions = "allow"
option_if_let_else = "allow"
redundant_pub_crate = "allow"
significant_drop_tightening = "allow"

# Many patterns cannot use const fn on stable Rust.
# When support is stable, revisit this allowance.
missing_const_for_fn = "allow"

# Transitive dependency version conflicts are outside our control.
multiple_crate_versions = "allow"
# Internal workspace crates do not need all crates.io metadata.
cargo_common_metadata = "allow"

# The release profile includes debug symbols for crash analysis.
[profile.release]
debug = "full"              # Full symbols include variable names and types.
