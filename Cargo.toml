[workspace]
resolver = "2"
members = [
    "libraries/tacacsrs_messages",
    "libraries/tacacsrs_networking", 
    "libraries/tacacsrs_agent_client",
    "libraries/tacacsrs_agent",
    "executables/tacon",
    "executables/tacacsrs_agentd"
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/AuthScaffold/tacacs-rs"

# Release profile with debug symbols for crash analysis
[profile.release]
debug = "full"              # Full symbols (variable names, types, etc.) for detailed debugging
