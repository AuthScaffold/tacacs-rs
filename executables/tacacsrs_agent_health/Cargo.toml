[package]
name = "tacacsrs-agent-health"
version = "2026.821.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "gRPC health probe for tacacsrs-agentd"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
tacacsrs-agent-client = { path = "../../libraries/tacacsrs_agent_client" }
tokio = { version = "1.52.3", features = ["macros", "rt", "time"] }
tonic-health = "0.14.6"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "net", "process", "rt-multi-thread", "time"] }
tokio-stream = { version = "0.1.18", features = ["net"] }
tokio-util = "0.7.18"
tonic = "0.14.6"

[lints]
workspace = true