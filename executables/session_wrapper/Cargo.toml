[package]
name = "session-wrapper"
version = "0.0.0-dev"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Proof-of-concept TACACS+ login session wrapper"
build = "build.rs"

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
anyhow = { version = "1.0.102", features = ["backtrace"] }
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.10"
libc = "0.2.186"
libseccomp = "0.4.0"
log = "0.4"
tacacsrs-agent-client = { path = "../../libraries/tacacsrs_agent_client" }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "sync", "signal", "time"] }

[lints]
workspace = true

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dev-dependencies]
tempfile = "3.27.0"

# Debian package metadata
[package.metadata.deb]
maintainer = "AuthScaffold <github-discussions@authscaffold.com>"
copyright = "2024, AuthScaffold"
license-file = ["../../LICENSE", "0"]
extended-description = """\
session-wrapper controls commands in Linux x86_64 login sessions. It uses \
TACACS+ authorization and seccomp user notifications."""
depends = "$auto"
section = "admin"
priority = "optional"
assets = [
    ["target/release/session-wrapper", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/session-wrapper/", "644"],
    ["../../LICENSE", "usr/share/doc/session-wrapper/", "644"],
]
