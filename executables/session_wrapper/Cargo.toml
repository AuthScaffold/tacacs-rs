[package]
name = "session-wrapper"
version = "0.0.0-dev"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "TACACS+ controlled login session wrapper POC"

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
anyhow = { version = "1.0.102", features = ["backtrace"] }
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.10"
libc = "0.2.186"
libseccomp = "0.4.0"
log = "0.4"
tacacsrs-agent-client = { path = "../../libraries/tacacsrs_agent_client" }
tokio = { version = "1.52.2", features = ["rt", "rt-multi-thread", "sync", "signal", "time"] }

[lints]
workspace = true

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dev-dependencies]
tempfile = "3.27.0"
