[package]
name = "tacacsrs-agentd"
version = "2026.1124.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local service that connects clients to TACACS+ servers"

[dependencies]
anyhow = { version = "1.0.102", features = ["backtrace"] }
async-trait = "0.1.89"
dill = { version = "0.17.2", default-features = false }
clap = { version = "4.6.1", features = ["derive"] }
console-subscriber = { version = "0.5.0", optional = true }
env_logger = "0.11.10"
env_filter = "2"
log = "0.4"
serde_json = "1.0"
tacacsrs-agent = { path = "../../libraries/tacacsrs_agent" }
tacacsrs-composition = { path = "../../libraries/tacacsrs_composition" }
tacacsrs-config = { path = "../../libraries/tacacsrs_config" }
tacacsrs-networking = { path = "../../libraries/tacacsrs_networking" }
tacacsrs-secrets = { path = "../../libraries/tacacsrs_secrets" }
tacacsrs-sonic = { path = "../../libraries/tacacsrs_sonic" }
tacacsrs-kubesonic = { path = "../../libraries/tacacsrs_kubesonic" }
tacacsrs-lifecycle = { path = "../../libraries/tacacsrs_lifecycle" }
tacacsrs-revocation = { path = "../../libraries/tacacsrs_revocation" }
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "net", "parking_lot", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }

[features]
default = []
console = ["console-subscriber"]

[dev-dependencies]
async-trait = "0.1.89"
openssl = "0.10.80"
tacacsrs-ipc = { path = "../../libraries/tacacsrs_ipc" }
tacacsrs-protocol = { path = "../../libraries/tacacsrs_protocol" }
tacacsrs-testkit = { path = "../../libraries/tacacsrs_testkit" }
tokio = { version = "1.52.3", features = ["test-util"] }
tokio-util = "0.7.18"

[build-dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap_mangen = "0.3.0"
tacacsrs-config = { path = "../../libraries/tacacsrs_config" }
tacacsrs-secrets = { path = "../../libraries/tacacsrs_secrets" }

# Used in `build.rs`, which `cargo-machete` does not scan.
[package.metadata.cargo-machete]
ignored = ["clap_mangen"]

[lints]
workspace = true
