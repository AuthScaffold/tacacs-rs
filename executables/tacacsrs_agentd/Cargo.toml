[package]
name = "tacacsrs-agentd"
version = "2026.416.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Central TACACS+ client service for local consumers"

[dependencies]
anyhow = { version = "1.0.102", features = ["backtrace"] }
clap = { version = "4.6.1", features = ["derive"] }
console-subscriber = { version = "0.5.0", optional = true }
env_logger = "0.11.10"
log = "0.4"
tacacsrs-agent-client = { version = "0.1.2", path = "../../libraries/tacacsrs_agent_client" }
tacacsrs-agent = { version = "0.1.2", path = "../../libraries/tacacsrs_agent" }
tokio = { version = "1.52.1", features = ["full"] }

[features]
default = []
console = ["console-subscriber"]
psk = ["tacacsrs-agent/psk"]

[lints]
workspace = true
