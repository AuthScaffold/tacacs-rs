[package]
name = "tacacsrs-agentd"
version = "0.0.0-dev"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Central TACACS+ client service for local consumers"

[dependencies]
anyhow = { version = "1.0.102", features = ["backtrace"] }
clap = { version = "4.6.1", features = ["derive"] }
console-subscriber = { version = "0.5.0", optional = true }
env_logger = "0.11.10"
futures-util = { version = "0.3", default-features = false }
log = "0.4"
rustls-pki-types = "1.14.1"
tacacsrs-agent-client = { path = "../../libraries/tacacsrs_agent_client" }
tacacsrs-agent = { path = "../../libraries/tacacsrs_agent" }
tacacsrs-cli-datastore = { path = "../../libraries/tacacsrs_cli_datastore" }
tacacsrs-config = { path = "../../libraries/tacacsrs_config" }
tacacsrs-datastore = { path = "../../libraries/tacacsrs_datastore" }
tacacsrs-networking = { path = "../../libraries/tacacsrs_networking" }
tacacsrs-sonic = { path = "../../libraries/tacacsrs_sonic" }
tokio = { version = "1.52.3", features = ["full"] }

[features]
default = []
console = ["console-subscriber"]
psk = ["tacacsrs-agent/psk", "tacacsrs-cli-datastore/psk"]

[build-dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap_mangen = "0.3.0"
tacacsrs-config = { path = "../../libraries/tacacsrs_config" }

[package.metadata.cargo-udeps.ignore]
normal = ["env_logger"]

[lints]
workspace = true

# Debian package metadata
[package.metadata.deb]
maintainer = "AuthScaffold <github-discussions@authscaffold.com>"
copyright = "2024, AuthScaffold"
license-file = ["../../LICENSE", "0"]
extended-description = """\
tacacsrs-agentd is a long-running local TACACS+ client service. It maintains \
pooled upstream TACACS+ connections and exposes a local IPC interface for \
clients such as tacon and session-wrapper."""
depends = "$auto, init-system-helpers (>= 1.54)"
pre-depends = "debconf (>= 0.5) | debconf-2.0"
section = "net"
priority = "optional"
maintainer-scripts = "debian/maintainer-scripts"
assets = [
    ["target/release/tacacsrs-agentd", "usr/sbin/", "755"],
    ["debian/tacacsrs-agentd-config.ini", "etc/tacacsrs-agentd/config.ini", "644"],
    ["sonic/tacacsrs-agentd.service", "lib/systemd/system/tacacsrs-agentd.service", "644"],
    ["../../docs/tacacsrs-agentd.md", "usr/share/doc/tacacsrs-agentd/README.md", "644"],
    ["../../LICENSE", "usr/share/doc/tacacsrs-agentd/", "644"],
    ["debian/changelog.gz", "usr/share/doc/tacacsrs-agentd/changelog.Debian.gz", "644"],
    ["debian/tacacsrs-agentd.1.gz", "usr/share/man/man1/tacacsrs-agentd.1.gz", "644"],
]

[package.metadata.deb.variants.psk]
features = ["psk"]
depends = "$auto"
