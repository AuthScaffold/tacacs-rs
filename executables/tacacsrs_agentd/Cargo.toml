[package]
name = "tacacsrs-agentd"
version = "0.0.0-dev"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local service that connects clients to TACACS+ servers"

[dependencies]
anyhow = { version = "1.0.102", features = ["backtrace"] }
async-trait = "0.1.89"
clap = { version = "4.6.1", features = ["derive"] }
console-subscriber = { version = "0.5.0", optional = true }
env_logger = "0.11.10"
futures-util = { version = "0.3", default-features = false }
log = "0.4"
notify = "8.2.0"
rand = "0.10.0"
rustls-pki-types = "1.14.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tacacsrs-agent-client = { path = "../../libraries/tacacsrs_agent_client" }
tacacsrs-agent = { path = "../../libraries/tacacsrs_agent" }
tacacsrs-config = { path = "../../libraries/tacacsrs_config" }
tacacsrs-credential-resolution = { path = "../../libraries/tacacsrs_credential_resolution" }
tacacsrs-networking = { path = "../../libraries/tacacsrs_networking" }
tacacsrs-secrets = { path = "../../libraries/tacacsrs_secrets" }
tacacsrs-sonic = { path = "../../libraries/tacacsrs_sonic" }
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "net", "parking_lot", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1.18"
tokio-util = "0.7.18"
tonic-health = "0.14.6"

[features]
default = []
console = ["console-subscriber"]

[dev-dependencies]
foreign-types = "0.3.2"
openssl = "0.10.80"
openssl-sys = "0.9.116"
tokio-openssl = "0.6.5"
tacacsrs-protocol = { path = "../../libraries/tacacsrs_protocol" }
tokio = { version = "1.52.3", features = ["test-util"] }
tonic = "0.14.6"

[build-dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap_mangen = "0.3.0"
tacacsrs-config = { path = "../../libraries/tacacsrs_config" }
tacacsrs-secrets = { path = "../../libraries/tacacsrs_secrets" }

[package.metadata.cargo-udeps.ignore]
normal = ["env_logger"]

[lints]
workspace = true
