# Package defaults for tacacsrs-agentd installation profiles.
#
# The daemon does not read this configuration file.
# This file is reserved for future package-level configuration and runtime integration.
config_source=unset
install_sonic_systemd_service=no
ipc_endpoint=/run/tacacs/tacacs.sock
sonic_redis_url=redis://127.0.0.1/
sonic_redis_db=4