[package]
name = "tacon"
version.workspace = true
edition.workspace = true
description = "TACACS+ client CLI for authentication, authorization, and accounting"
readme = "README.md"
keywords = ["tacacs", "tacacs+", "network", "authentication", "cli"]
categories = ["command-line-utilities", "network-programming"]
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { version = "1.0.100", features = ["backtrace"] }
clap = { version = "4.5.57", features = ["derive"] }
env_logger = "0.11.8"
futures = "0.3"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tacacsrs-client-service = { path = "../../libraries/tacacsrs_client_service" }
tacacsrs-messages = { path = "../../libraries/tacacsrs_messages" }
tacacsrs-networking = { path = "../../libraries/tacacsrs_networking" }
tokio = { version = "1.49.0", features = ["full"] }

[features]
default = []
psk = ["tacacsrs-networking/psk"]

[build-dependencies]
clap = { version = "4.5.57", features = ["derive"] }
clap_mangen = "0.2.25"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

# Debian package metadata
[package.metadata.deb]
maintainer = "AuthScaffold <support@authscaffold.com>"
copyright = "2024, AuthScaffold <support@authscaffold.com>"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Tacon is a command-line TACACS+ client for authentication, authorization, and \
accounting (AAA) operations. It supports both traditional TACACS+ with obfuscation \
and modern TACACS+ over TLS 1.3, making it suitable for both legacy and \
next-generation network infrastructure."""
depends = "$auto"
section = "net"
priority = "optional"
assets = [
    ["target/release/tacon", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/tacon/", "644"],
    ["../../LICENSE", "usr/share/doc/tacon/", "644"],
    ["debian/changelog.gz", "usr/share/doc/tacon/changelog.Debian.gz", "644"],
    ["debian/tacon.1.gz", "usr/share/man/man1/tacon.1.gz", "644"],
]
