[package]
name = "tacon"
version = "2026.821.0"
edition.workspace = true
description = "TACACS+ client CLI for authentication, authorization, and accounting"
readme = "README.md"
keywords = ["tacacs", "tacacs+", "network", "authentication", "cli"]
categories = ["command-line-utilities", "network-programming"]
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { version = "1.0.102", features = ["backtrace"] }
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.10"
futures = "0.3"
log = "0.4"
rpassword = "7.4.0"
rustls-pki-types = "1.14.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tacacsrs-cli-datastore = { path = "../../libraries/tacacsrs_cli_datastore" }
tacacsrs-config = { path = "../../libraries/tacacsrs_config" }
tacacsrs-messages = { path = "../../libraries/tacacsrs_messages" }
tacacsrs-flows = { path = "../../libraries/tacacsrs_flows" }
tacacsrs-networking = { path = "../../libraries/tacacsrs_networking" }
tacacsrs-secrets = { path = "../../libraries/tacacsrs_secrets" }
tokio = { version = "1.52.3", features = ["full"] }

[target.'cfg(target_os = "linux")'.dependencies]
tacacsrs-agent-client = { path = "../../libraries/tacacsrs_agent_client" }

[build-dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap_mangen = "0.3.0"
tacacsrs-config = { path = "../../libraries/tacacsrs_config" }

[lints]
workspace = true
