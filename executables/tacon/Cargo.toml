[package]
name = "tacon"
version.workspace = true
edition.workspace = true
description = "TACACS+ client CLI for authentication, authorization, and accounting"
readme = "README.md"
keywords = ["tacacs", "tacacs+", "network", "authentication", "cli"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = { version = "1.0.100", features = ["backtrace"] }
clap = { version = "4.5.57", features = ["derive"] }
env_logger = "0.11.8"
futures = "0.3"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tacacsrs-messages = { path = "../../libraries/tacacsrs_messages" }
tacacsrs-networking = { path = "../../libraries/tacacsrs_networking" }
tokio = { version = "1.49.0", features = ["full"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

