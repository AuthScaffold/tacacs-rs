[package]
name = "tacon"
version = "0.0.0-dev"
edition.workspace = true
description = "TACACS+ client CLI for authentication, authorization, and accounting"
readme = "README.md"
keywords = ["tacacs", "tacacs+", "network", "authentication", "cli"]
categories = ["command-line-utilities", "network-programming"]
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { version = "1.0.102", features = ["backtrace"] }
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.10"
futures = "0.3"
log = "0.4"
rustls-pki-types = "1.14.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tacacsrs-agent-client = { path = "../../libraries/tacacsrs_agent_client" }
tacacsrs-cli-datastore = { path = "../../libraries/tacacsrs_cli_datastore" }
tacacsrs-config = { path = "../../libraries/tacacsrs_config" }
tacacsrs-messages = { path = "../../libraries/tacacsrs_messages" }
tacacsrs-flows = { path = "../../libraries/tacacsrs_flows" }
tacacsrs-networking = { path = "../../libraries/tacacsrs_networking" }
tokio = { version = "1.52.3", features = ["full"] }

[build-dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap_mangen = "0.3.0"
tacacsrs-config = { path = "../../libraries/tacacsrs_config" }

[lints]
workspace = true

# Debian package metadata
[package.metadata.deb]
maintainer = "AuthScaffold <github-discussions@authscaffold.com>"
copyright = "2024, AuthScaffold"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Tacon is a command-line TACACS+ client for authentication, authorization, and \
accounting (AAA) operations. It supports both traditional TACACS+ with obfuscation \
and modern TACACS+ over TLS 1.3, making it suitable for both legacy and \
next-generation network infrastructure."""
depends = "$auto"
recommends = "tacacsrs-agentd"
section = "net"
priority = "optional"
assets = [
    ["target/release/tacon", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/tacon/", "644"],
    ["../../LICENSE", "usr/share/doc/tacon/", "644"],
    ["debian/changelog.gz", "usr/share/doc/tacon/changelog.Debian.gz", "644"],
    ["debian/tacon.1.gz", "usr/share/man/man1/tacon.1.gz", "644"],
]
