
## The following build flag is used to enable tokio-console
## for watching the process instrumented with
## console_subscriber::init();
#[build]
#rustflags = ["--cfg", "tokio_unstable"]


# Target-specific debug info settings
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "split-debuginfo=packed", "-C", "debuginfo=full"]  # .pdb files on Windows with full debug info

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "split-debuginfo=off", "-C", "debuginfo=line-tables-only"]  # Line tables only for Linux

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "split-debuginfo=off", "-C", "debuginfo=line-tables-only"]  # Line tables only for musl builds