# release-plz configuration
# https://release-plz.ieni.dev/docs/config

[workspace]
# The workspace does not publish to crates.io. Git tags determine the versions.
git_only = true
# Permit uncommitted and ignored files, such as YANG cache files.
allow_dirty = true
publish = false
# Skip `cargo package` validation. Path-only workspace dependencies do not have version fields.
# This validation is not necessary because the workspace does not publish packages.
publish_no_verify = true
# Do not run semantic-version API checks. The internal libraries are not published.
semver_check = false
# Add a label that identifies release pull requests.
pr_labels = ["release"]
# The workflow releases packages only after GitHub merges the release pull request.
release_always = false

# --- Exclude applications. CalVer manages them separately. ---

[[package]]
name = "tacon"
release = false

[[package]]
name = "tacacsrs-agentd"
release = false

# --- Changelog: Flat list of pull request titles without conventional-commit groups. ---

[changelog]
body = """
## [{{ version }}]{%- if release_link -%}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% for commit in commits %}
- {{ commit.message }}
{%- endfor %}
"""
commit_parsers = [
  { message = "^chore: release", skip = true },
  { message = "^ci:", skip = true },
  { message = "^\\s*$", skip = true },
  { message = "^.*", group = "Changes" },
]
